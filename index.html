<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redis 学习电子书</title>
<style>
:root {
  --sidebar-w: 300px;
  --bg: #ffffff;
  --bg-sidebar: #f5f5f5;
  --text: #1a1a2e;
  --text-light: #555555;
  --accent: #1a73e8;
  --accent-hover: #1557b0;
  --border: #e0e0e0;
  --code-bg: #f0f0f0;
  --link: #1a73e8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
}
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  z-index: 100;
  transition: transform 0.3s;
  display: flex;
  flex-direction: column;
}
.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
}
.search-container {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.search-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}
.search-tab {
  flex: 1;
  padding: 7px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-light);
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  text-align: center;
  transition: all 0.2s;
}
.search-tab:hover {
  border-color: var(--accent);
  color: var(--text);
}
.search-tab.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
#searchInput {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  outline: none;
}
#searchInput:focus {
  border-color: var(--accent);
}
#searchInput::placeholder {
  color: var(--text-light);
}
.toc {
  list-style: none;
  padding: 8px 0;
  flex: 1;
  overflow-y: auto;
}
.toc li { margin: 1px 0; }
.nav-chapter {
  padding: 10px 16px 4px;
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}
.nav-chapter:hover { color: var(--accent); }
.nav-chapter .arrow {
  transition: transform 0.2s;
  font-size: 10px;
}
.nav-chapter.open .arrow { transform: rotate(90deg); }
.nav-sections {
  list-style: none;
  display: none;
  padding: 0 0 8px 0;
}
.nav-sections.open { display: block; }
.nav-sections li {
  padding: 4px 16px 4px 32px;
  font-size: 13px;
  color: var(--text-light);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-sections li:hover { color: var(--accent); background: rgba(137,180,250,0.05); }
.nav-sections li.active { color: var(--accent); background: rgba(137,180,250,0.1); }
.nav-chapter.hidden { display: none; }
.nav-sections li.hidden { display: none; }
#tocTip {
  position: fixed;
  z-index: 400;
  display: none;
  max-width: 420px;
  padding: 6px 10px;
  background: var(--bg-sidebar);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  font-size: 12px;
  line-height: 1.6;
  white-space: normal;
  word-break: break-all;
  pointer-events: none;
}

.search-results {
  list-style: none;
  padding: 8px 0;
  flex: 1;
  overflow-y: auto;
  display: none;
}
.search-results.open { display: block; }
.search-result {
  padding: 10px 16px;
  margin: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
}
.search-result:hover {
  background: rgba(137,180,250,0.08);
}
.search-result .ch-label {
  font-size: 11px;
  color: var(--text-light);
}
.search-result .snippet {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
  line-height: 1.4;
}
.search-no-result {
  padding: 20px 16px;
  font-size: 13px;
  color: var(--text-light);
  text-align: center;
}

.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  padding: 40px 60px;
  max-width: 900px;
}
.chapter { margin-bottom: 60px; }
.chapter-title {
  font-size: 28px;
  color: var(--accent);
  border-bottom: 2px solid var(--border);
  padding-bottom: 12px;
  margin-bottom: 30px;
}
.section { margin-bottom: 40px; }
.section-title {
  font-size: 22px;
  color: var(--text);
  margin-bottom: 16px;
  padding-left: 12px;
  border-left: 3px solid var(--accent);
}
h1 { font-size: 26px; margin: 24px 0 16px; color: var(--accent); }
h2 { font-size: 22px; margin: 20px 0 12px; color: var(--text); }
h3 { font-size: 18px; margin: 16px 0 10px; color: var(--text); }
h4 { font-size: 16px; margin: 12px 0 8px; }
p { margin: 8px 0; }
ul, ol { margin: 8px 0; padding-left: 24px; }
li { margin: 4px 0; }
code {
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.9em;
  font-family: "SF Mono", Monaco, monospace;
}
pre {
  background: var(--code-bg);
  padding: 16px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 12px 0;
  border: 1px solid var(--border);
}
pre code {
  background: none;
  padding: 0;
  font-size: 13px;
  line-height: 1.5;
}
img {
  max-width: 100%;
  border-radius: 8px;
  margin: 12px 0;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
strong { color: var(--text); }
mark {
  background: rgba(137,180,250,0.3);
  color: var(--accent);
  border-radius: 2px;
  padding: 0 2px;
}
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
  font-size: 16px;
}

/* Mobile */
.menu-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 18px;
  cursor: pointer;
}
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 60px 20px 20px; }
  .menu-toggle { display: block; }
}
</style>
</head>
<body>

<button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">Redis 学习电子书</div>
  <div class="search-container">
    <div class="search-tabs">
      <button class="search-tab active" data-mode="toc" onclick="switchMode('toc')">按章节</button>
      <button class="search-tab" data-mode="fulltext" onclick="switchMode('fulltext')">全文检索</button>
    </div>
    <input type="text" id="searchInput" placeholder="搜索章节..." oninput="onSearch(this.value)">
  </div>
  <ul class="toc" id="tocList"></ul>
  <ul class="search-results" id="searchResults"></ul>
</nav>

<main class="main" id="content">
</main>

const searchIndex = [{"sid": "chapter-0-section-0", "ch": "1.Redis入门概述", "sec": "1.Redis入门概述", "t": "redis入门概述 1.是什么 redis：remote dictionary server(远程字典服务器) 官网解释： remote dictionary server远程字典服务器是完全开源的，使用ansic语言编写遵守bsd协议，是一个高性能的key value数据库，提供了丰富的数据结构，例如string、hash、list、set、sortedset等等。数据是存在内存中的，同时redis支持事务、持久化、lua脚本、发布/订阅、缓存淘汰、流技术等多种功能，提供了主从模式、redis sentinel和redis cluster集群架构方案 安特雷兹 个人github：github.com/antirez 个人博客：antirez.com/latest/0 2.能干嘛 主流功能与应用 1.分布式缓存，挡在mysql数据库之前的带刀护卫 与传统数据库关系(mysql) ​ ·redis是key value数据库(nosql一种)，mysql是关系型数据库 ​ ·redis数据操作主要在内存，而mysql主要存储在磁盘 ​ ·redis在某一些场景使用中要明显优于mysql，比如计数器、排行榜等方面 ​ ·redis通常用于一些特定场景，需要与mysql一起配合使用 ​ ·两者并不是相互替换和竞争的关系，而是共用和配合使用 2.内存存储和持久化（rdb和aof） ​ redis支持异步将内存中的数据写到硬盘上，同时不影响继续服务 3.高可用架构搭配 ​ 单机、主从、哨兵、集群 4.缓存穿透、击穿、雪崩 5.分布式锁 6.队列 ​ redis提供list和set操作，这使得redis能作为一个很好的消息队列平台来使用。 ​ 我们常通过redis的队列功能做购买限制。比如到了节假日或者推广期间，进行一些活动，对用户购买行为进行限制，限制今天只能购买几次商品或者一段时间内只能购买一次。也比较适合使用。 7.排行榜+点赞 ​ 在互联网应用中，有各种各样的排行榜，如电商网站的月度销量排行榜、社交app的礼物排行榜、小程序的投票排行榜等等。redis提供的zset数据类型能够快速实现这些复杂的排行榜。 ​ 比如小说网站对小说进行排名，根据排名，将排名靠前的小说推荐给用户。 总体功能概述 优势 ​ 性能极高 redis读的速度是110000次/秒，写的速度是81000次/秒 ​ redis数据类型丰富，不仅仅支持简单的key value类型的数据，同时还提供list，set，zset，hash等数据结构的存储 ​ redis支持数据的持久化，可以将内存中的数据保持在磁盘中，重启的时候可以再次加载进行使用 ​ redis支持数据的备份，即master slave模式的数据备份 小总结 2.能干嘛 3.去哪下 官网地址: 英文：https://redis.io/ 中文：http://www.redis.cn/ https://www.redis.com.cn/documentation.html 安装包：https://redis.io/download/，选择redis7.0版本即可 redis源码地址：https://github.com/redis/redis redis在线测试地址(不用下载也能玩)：https://try.redis.io/ redis命令参考：http://doc.redisfans.com/ 4.怎么玩 官网文档； 多种数据类型基本操作和配置； 持久化和复制，rdb/aof 事务的控制 复制，集群等 redis迭代演化和redis7新特性浅谈 版本升级： xml 5.0版本是直接升级到6.0版本，对于这个激进的升级，redis之父antirez表现得很有信心和兴奋，所以第一时间发文来阐述6.0的一些重大功能\"redis 6.0.0 ga is out!\": 随后redis再接再厉，直接王炸redis7.0 2023年爆款 xml 2022年4月27日redis正式发布了7.0更新 (其实早在2022年1月31日，redis已经预发布了7.0rc 1，近过社区的考验后，确认没有重大bug才会正式发布) redis版本迭代推演介绍： ​ 几个里程碑式的重要版本:如上图：redis历史版本回顾 ​ 命名规则：redis从发布至今，已经有十余年的时光了，一直遵循着自己的命名规则: 1. 版本号第二位如果是奇数，则为非稳定版本，如2.7、2.9、3.1 2. 版本号第二位如果是偶数，则为稳定版，如2.6、2.8、3.2 3. 当前奇数版本就是下一个稳定版本的开发版，如2.9版本就是3.0版本的开发版本 4. 我们可以通过redis.io官网来下载自己感兴趣的版本进行源码阅读 5. 历史发布版本的源码：https://"}, {"sid": "chapter-1-section-0", "ch": "2.Redis安装配置", "sec": "1.Redis安装配置", "t": "redis安装配置 1.自行购买云服务器 自己购买阿里云、青牛云、腾讯云或华为云服务器，自带centoos或者ubuntu环境，直接开干 2.vmware本地虚拟机 通过命令 getconf long bit查看，它返回结果是多少就是多少位 3.redis的安装 window版安装： 下载地址：https://github.com/zkteco home/redis windows linux版安装： linux环境安装redis必须先具备gcc编译环境 ​ 1.1什么是gcc? gcc是linux下的一个编译程序，是c程序的编译工具。 gcc(gnu compiler collection)是 gnu(gnu's not unix) 计划提供的编译器家族，它能够支持 c,c++, objective c, fortran, java 和ada 等等程序设计语言前端，同时能路运在 x86，x86 64，ia 64，powerpc，sparc和alpha 等等几乎目前所有的硬件平台上。鉴于这些特征，以及 gcc 编译代码的高效性，使得 gcc 成为绝大多数自由软件开发编译的首选工具。虽然对于程序员们来说，编译器只是一个工具，除了开发和维护人员，很少有人关注编译器的发展，但是 gcc 的影响力是如此之大，它的性能提升甚至有望改善所有的自由软件的运行效率，同时它的内部结构的变化也体现出现代编译器发展的新特征。 ​ 1.2查看gcc版本 gcc v ​ 1.3安装 ·安装redis之前需要具备c++库环境 ·yum y install gcc c++ ·命令案例 版本选择 1.1查看自己redis版本的命令：redis server v 1.2安全bug按照官网提示，升级成为6.0.8及以上 1.3<font color= 'red' 目前建议都需要升级到6.0.8版本以上</font 1.4本次使用redis7.0"}, {"sid": "chapter-1-section-1", "ch": "2.Redis安装配置", "sec": "2.Redis7安装步骤", "t": "redis7安装步骤 1.下载获取redis 7.0.0.tar.gz后将它放入我们的linux目录/opt 2./opt目录下解压redis，tar zxvf redis 7.0.0.tar.gz，解压后会多一个redis 7.0.0的文件夹 3进入目录，cd redis 7.0.0 4.在redis 7.0.0目录下执行make命令 5.查看默认安装目录：/usr/local/bin，linux下的/usr/local类似我们windows系统的c:\\program files，安装完成后，去/usr/local/bin下查看 redis benchmark:性能测试工具，服务启动后运行该命令，看看自己电脑性能如何 redis check aof:修复有问题的aof文件，rdb和aof后续学习 redis check dump:修复有问题的dump.rdb文件 <font color='red' redis cli:客户端操作入口</font redis sentinel:redis集群使用 <font color='red' reids server:redis服务器启动命令</font 6.将默认的redis.conf拷贝到自己定义好的一个路径下，比如/myredis ，cp redis.conf /myredis/redis7.conf 7.修改/myredis目录下redis.conf配置文件做初始化设置 redis.conf配置文件，改完后确保生效，记得重启 1默认daemonize no 改为 daemonize yes 2默认protected mode yes 改为 protected mode no 3默认bind 127.0.0.1 改为 直接注释掉(默认bind 127.0.0.1只能本机访问)或改成本机ip，否则影响远程ip连接 4默认redis密码 改为 requirepass 自己设定的密码 8.启动服务 /usr/local/bin目录下运行redis server命令，启用/myredis目录下的redis.conf配置文件 执行命令：redis server /myredis/redis7.conf 9.连接服务 redis cli a 123456 p 6379( a 后面是redis设置的密码) 备注说明： warning: using a password with ' a' or ' u' option on the command line interface may not be safe.这段警告看着不舒服怎么办? warning 这串输出并不是普通输出，shell的标准输出包含两种： 1（标准输出） 2（标准错误）我们的命令，即包含1也包含2，2即是我们想要除去的提示 解决办法将标准错误去除即可，追加2 /dev/null，将标准错误丢弃即可，就没有烦人的警告了。 10.redis端口为什么是6379？ redis的默认端口是6379，是由手机键盘字母merz的位置决定的。merz在antirez的朋友圈语言中是\"愚蠢和傻b\"的代名词，源于意大利广告女郎alessia merz在电视节目上说了一堆愚蠢的话，redis之父对她有\"特殊\"印象，就给她弄成端口号了 11.关闭redis服务器 单实例关闭：在redis服务器外面关闭命令：redis cli a 123456 shutdown，如果在redis服务器里面可以直接使用shutdown命令 多实例关闭，指定端口关闭：redis cli p 6379 shutdown"}, {"sid": "chapter-1-section-2", "ch": "2.Redis安装配置", "sec": "3.Redis7卸载步骤", "t": "卸载redis步骤 1.停止redis server服务 2.删除/usr/local/bin目录下与redis相关的文件 ls l /usr/local/bin/redis rm rf /usr/local/bin/redis"}, {"sid": "chapter-2-section-0", "ch": "3.redis10大数据类型", "sec": "1.10大数据类型", "t": "10大数据类型 which 10 官网:https://redis.io/docs/data types/ 提前声明 这里说的数据类型是value的数据类型，key的类型都是字符串 1.redis字符串（string） string是redis最基本的数据类型，一个key对应一个value。 string类型是<font color='red' 二进制安全的</font ，意思是redis的string可以包含任何数据，比如jpg图片或者序列化的对象。 string类型是redis最基本的数据类型，一个redis中字符串value 最多可以是512m 2.redis列表（list） redis列表是最简单的字符串列表，按照插入顺序排序。你可以添加一个元素到列表的头部（左边）或者尾部（右边），它的底层实际是个双端链表，最多可以包含2^32 1个元素（4294967295，每个列表超过40亿个元素） 3.redis哈希表（hash） redis hash是一个string类型的field（字段）和value（值）的映射表，hash特别适合用户存储对象。 redis中每个hash可以存储2^32 1个键值对（40多亿） 4.redis集合（set） redis的set是string类型的无序集合。集合成员是唯一的，这就意味着集合中不能出现重复的数据，集合对象的编码可以是intset或者hashtable。 redis中set集合是通过哈希表实现的，所以添加，删除，查找的复杂度都是o(1)。 集合中最大的成员数为2^32 1（4294967295，每个集合可存储40多亿个成员） 5.redis有序集合（zset） zset(sorted set：有序集合) redis zset和set一样也是string类型元素的集合，且不允许重复的成员。 不同的是每个元素都会关联一个double类型的分数，redis正是通过分数来为集合中的成员进行从小到大的排序。 zset的成员是唯一的，但是分数（score）却可以重复。 zset集合是通过哈希表实现的，所以添加，删除，查找的复杂度都是o(1)。集合中最大的成员数是2^.32 1 6.redis地理空间（geo） redis geo主要用于存储地理位置信息，并对存储的信息进行操作，包括： 添加地理位置的坐标。 获取地理位置的坐标。 计算两个位置之间的距离。 根据用户给定的经纬度坐标来获取指定范围内的地址位置集合。 7.redis基数统计（hyperloglog） hyperloglog是用来做基数统计的算法，hyperloglog的优点是，在输入元素的数量或者体积非常非常大时，计算基数所需要的空间总是固定且是很小的。 在redis里面，每个hyperloglog键只需要花费12kb内存，就可以计算接近2^64个不同元素的基数。这和计算基数时，元素越多耗费内存就越多的集合形成鲜明对比。 但是，因为hyperloglog只会根据输入元素来计算基数，而不会存储输入元素本身，所以hyperloglog不能像集合那样，返回输入的各个元素。 8.redis位图（bitmap） 由0和1状态表现的二进制位的bit数组 9.redis位域（bitfield） 通过bitfield命令可以一次性操作多个比特位域(指的是连续的多个比特位)，它会执行一系列操作并返回一个响应数组，这个数组中的元素对应参数列表中的相应的执行结果。 说白了就是通过bitfield命令我们可以一次性对多个比特位域进行操作。 10.redis流（stream） redis stream是redis5.0版本新增加的数据结构。 redis stream主要用于消息队列（mq，message queue），redis本身就是一个redis发布订阅（pub/sub）来实现消息队列的功能，但它有个缺点就是消息无法持久化，如果出现网络断开、redis宕机等，消息就会被丢弃。 简单来说发布订阅（pub/sub）可以分发消息，但无法记录历史消息。 而redis stream提供了消息的持久化和主备复制功能，可以让任何客户端访问任何时刻的数据，并且能记住每一个客户端的访问位置，还能保证消息不丢失。 redis常见数据类型操作命令 官网英文： https://redis.io/commands/ 中文：http://www.redis.cn/commands.html"}, {"sid": "chapter-2-section-1", "ch": "3.redis10大数据类型", "sec": "2.redis键(key)", "t": "redis键（key） 案例 1.keys 查看当前库所有的key 2.exists key 判断某个key是否存在 3.type key 查看你的key是什么类型 4.del key 删除指定的key数据 5.unlink key 非阻塞删除，仅仅将keys从keyspace元数据中删除，真正的删除会在后续异步中操作。 del key 是原子的删除，只有删除成功了才会返回删除结果，如果是删除大key用del会将后面的操作都阻塞，而unlink key 不会阻塞，它会在后台异步删除数据。 6.ttl key 查看还有多少秒过期， 1表示永不过期， 2表示已过期 7.expire key 秒钟 为给定的key设置过期时间 8.move key dbindex[0 15] 将当前数据库的key移动到给定的数据库db当中 9.select dbindex 切换数据库【0 15】，默认为0 10.dbsize 查看当前数据库key的数量 11.flushdb 清空当前库 12.flushall 通杀全部库"}, {"sid": "chapter-2-section-2", "ch": "3.redis10大数据类型", "sec": "3.数据类型命令及落地运用", "t": "数据类型命令及落地运用 英文：https://redis.io/commands/ 中文：http://www.redis.cn/commands.html 备注： 1.命令不区分大小写，而key是区分大小写的 2.永远的帮助命令，help @类型 help @string help @list help @hash help @hyperloglog"}, {"sid": "chapter-2-section-3", "ch": "3.redis10大数据类型", "sec": "4.Redis字符串(String)", "t": "redis字符串(string) 官网：https://redis.io/docs/data types/strings/ 单值单value 案例： 1.最 常 用：set key value | get key 返回值： 设置成功则返回ok，返回nil为未执行set命令，如不满足nx，xx条件等。 若使用get参数，则返回该键原来的值，或在键不存在时nil。 如何获得设置指定的key过期的unix时间，单位为秒 java system.out.println(long.tostring(system.currenttimemillis()/1000l)); 2.同时设置/获取多个键值 mset key value [key value...] mget key [key ...] mset/mget/msetnx 3.获取指定区间范围内的值 getrange/setrange 4.数值增减 一定要是数据才能进行加减 递增数字：incr key 增加指定的整数：incrby key increment 递减数值：decr key 减少指定的整数：decrby key decrement 5.获取字符串长度和内容追加 获取字符串长度：strlen key 字符串内容追加：append key value 6.分布式锁 setnx key value setex(set with expire)键秒值/setnx(set if not exist) 7.getset(先get再set) getset：将给定key的值设为value，并返回key的旧值(old value)。 简单一句话：先get然后立即set"}, {"sid": "chapter-2-section-4", "ch": "3.redis10大数据类型", "sec": "5.Redis列表(List)", "t": "redis列表(list) 单key多value 简单说明：一个双端链表的结构，容量是2的32次方减1个元素大概40多亿，主要功能有push/pop等，一般用在栈、队列、消息队列等场景。left、right都可以插入添加； 如果键不存在，创建新的链表； 如果键已存在，新增内容； 如果值全移除，对应的键也就消失了 它的底层实际上就是个双向链表，对两端的作性能很高，通过索引下标的操作中间的节点性能会较差 案例： 1.lpush/rpush/lrange 注： 没有rrange 2.lpop/rpop 3.lindex，按照索引下标获得元素（从上到下） 4.llen,获取list列表中元素的个数 5.lrem key 数字n 给定值v1 解释：删除n个值等于v1的元素 从left往right删除2个值等于v1的元素，返回的值为实际删除的数量 lrem list3 0 值，表示删除全部给定的值，零个就是全部值 6.ltrim key 开始index 结束index 截取指定范围的值后在赋值给key 7.rpoplpush 源列表 目的列表 移除列表的最后一个元素，并将该元素添加到另一个列表并返回 8.lset key index value 让指定数组集合的小标位置值替换成新值 9.linsert key before/after 已有值 插入的新值"}, {"sid": "chapter-2-section-5", "ch": "3.redis10大数据类型", "sec": "6.Redis哈希(Hash)", "t": "redis哈希(hash) kv模式不变，但v是一个键值对 map<string, map<object, object 案例： 1.hset/hget/hmset/hmget/hgetall/hdel 2.hlen 获取某个key内的全部数量 3.hexists key 在key里面的某个值的key 4.hkeys/hvals hkeys key 查询出所有key对应的子key值 hvals key 查询出所有key对应的子key的value值 5.hincrby/hincrbyfloat 6.hsetnx 不存在赋值，存在了无效"}, {"sid": "chapter-2-section-6", "ch": "3.redis10大数据类型", "sec": "7.Redis集合(Set)", "t": "redis集合(set) 单值多value，且无重复 案例： 1.sadd key member [member ...] 添加元素，可以多次向同一个key中设置不同值，不会覆盖之前的值 2.smembers key 遍历集合中的所有元素 3.sismember key member 判断元素是否在集合中 4.srem key member [member ...] 删除元素 5.scard 获取集合里面的元素个数 6.srandmember key [数字] 从集合中随机展现设置的数字个数元素，元素不删除 7.spop key [数字] 从集合中随机弹出一个元素，出一个删除一个 8. smove key1 key2 将key1里已存在的某个值赋给key2 9.集合运算 集合的差集运算a b 属于a但是不属于b的元素构成的集合 sdiff key [key ...]，可以计算多个元素的差集 10.集合运算 集合的并集运算a∪b 属于a或者属于b的元素构成的集合 sunion key [key ...] 11.集合运算 集合的交集运算a∩b 属于a同时也属于b的共同拥有的元素构成的集合 sinter key [key ...] sintercard numkeys key 【key ...】【limit limit】 numkeys 的具体值由输入的key个数决定 sintercard 为redis7新命令，它不返回结果集，而是返回结果的基数。返回由所有给定集合的交集产生的集合的基数 基数的词语解释: 用于表示事物个数的数"}, {"sid": "chapter-2-section-7", "ch": "3.redis10大数据类型", "sec": "8.Redis有序集合Zset(sorted set)", "t": "redis有序集合zset(sorted set) 在set基础上，每个val值前加一个score分数值。之前set是k1 v1 v2 v3，现在zset是 k1 score1 v1 score2 v2 案例： 向有序集合中加入一个元素和该元素的分数 1.zadd key score member [score member ...] 添加元素 2.zrange key start stop [withscores] 按照元素分数从小到大的顺序返回索引从start到stop之间的所有元素 3.zrevrange key start stop [withscores] 反转集合，按照元素分数从大到小的顺序返回索引从start到stop之间的所有元素 4.zrangebyscore key min max 【withscores】【limit offset count】 获取指定分数范围的元素，可以在min和max前面加个(，表示不包含 limit作用是返回限制，limit开始下标步，一共多少步 5.zscore key member 获取元素的分数 6.zcard key 获取集合中元素的数量 7. zrem key member [member ...] 某个score对应的value值，作用是删除元素 8.zincrby key increment member 增加某个元素的分数 9.zcount key min max 获得指定分数内的元素个数 10.zmpop numkeys key [key ...] min|max [count count] 从键名列表中的 第一个非空排序集中弹出一个或多个元素 ，他们是成员分数对 11.zrank key member [withscore] 作用是通过子value获得下标值 12.zrevrank key member [withscore] 作用是通过子value逆序获得下标值"}, {"sid": "chapter-2-section-8", "ch": "3.redis10大数据类型", "sec": "9.Redis位图(bitmap)", "t": "redis位图(bitmap) 一句话：由0和1状态表现的二进制位的bit数组 看需求： 1. 用户是否登陆过y、n，比如软件的每日签到功能 2. 电影、广告是否被点击播放过 3. 钉钉打卡上下班，签到统计 是什么? 说明：用string类型作为底层数据结构实现的一种统计二值状态的数据类型 位图本质是数组，它是基于string数据类型的按位的操作。该数组由多个二进制位组成，每个二进制位都对应一个偏移量（我们称之为一个索引）。 bitmap支持的最大位数是2^32位，它可以极大的节约存储空间，使用512m内存就可以存储多达42.9亿的字节信息(2^32=4294967296) 能干嘛？ 用于状态统计，y、n类似atomicboolean 基本命令 1.setbit key offset value setbit 键偏移位 只能零或者1 bitmap的偏移量从零开始计算的 2.getbit key offset 获取键偏移位的值 3.strlen key 统计字节数占用多少 不是字符串长度而是占据几个字节，超过8位后自己按照8位一组 一byte 再扩容 4.bitcount key [start end [byte|bit]] 全部键里面包含有1的有多少个 5.bitop operation(and|or|xor|not) destkey key [key ...] 案例：连续2天都签到的用户数量 假如某个网站或者系统，它的用户有1000w，我们可以使用redis的hash结构和bitmap结构做个用户id和位置的映射"}, {"sid": "chapter-2-section-9", "ch": "3.redis10大数据类型", "sec": "10.Redis基数统计(HyperLogLog)", "t": "redis基数统计(hyperloglog) 看需求： 用户搜索网站关键词的数量 统计用户每天搜索不同词条个数 统计某个网站的uv、统计某个文章的uv 什么是uv？ unique visitor，独立访客，一般理解为客户端ip， 需要去重考虑 是什么 去重复统计功能的基数估计算法 就是hyperloglog tex redis在2.8.9版本添加了hyperloglog 结构。 redis hyperloglog是用来做基数统计的算法，hyperloglog 的优点是，在输入元素的数量或者体积非常非常大时，计算基数所需的空间总是固定的、并且是很小的。 在redis里面，每个 hyperloglog键只需要花费12kb内存，就可以计算接近2^64个不同元素的基数。这和计算基数时，元素越多耗费 内存就越多的集合形成鲜明对比。 但是，因为hyperloglog只会根据输入元素来计算基数，而不会储存输入元素本身，所以hyperloglog不能像集合那样，返回输入的各个元素。 基数 ：是一种数据集，去重复后的真实个数 tex (全集)={2,4,6,8,77,39,4,8,10} 去掉重复的内容 基数={2,4,6,8,77,39,10} = 7 基数统计：用于统计一个集合中不重复的元素个数，就是对集合去重复后剩余元素的计算。 一句话：去重脱水后的真实数据 基本命令："}, {"sid": "chapter-2-section-10", "ch": "3.redis10大数据类型", "sec": "11.Redis地理空间(GEO)", "t": "redis地理空间(geo) 简介： 移动互联网时代lbs应用越来越多，交友软件中附近的小姐姐、外卖软件中附近的美食店铺、高德地图附近的核酸检查点等等，那这种附近各种形形色色的xxx地址位置选择是如何实现的? 地球上的地理位置是使用二维的经纬度表示，经度范围( 180,180]，纬度范围( 90，90]，只要我们确定一个点的经纬度就可以取得他在地球的位置。 例如滴滴打车，最直观的操作就是实时记录更新各个车的位置， 然后当我们要找车时，在数据库中查找距离我们(坐标x0,y0)附近r公里范围内部的车辆 使用如下sql即可: sql select taxi from position where x0 r< x < x0 + r and y0 r< y < y0+r 但是这样会有什么问题呢? 1.查询性能问题，如果并发高，数据量大这种查询是要搞垮数据库的 2.这个查询的是一个矩形访问，而不是以我为中心r公里为半径的圆形访问。 3.精准度的问题，我们知道地球不是平面坐标系，而是一个圆球，这种矩形计算在长距离计算时会有很大误差 原理 redis在3.2版本以后增加了地址位置的处理 命令 1.geoadd key longitude latitude member [longitude latitude member] 多个经度(longitude)、纬度(latitude)、位置名称(member)添加到指定的key中 命令：geoadd city 116.403963 39.915119 \"天安门\" 116.403414 39.924091 \"故宫\" 116.024067 40.362639 \"长城\" geo类型实际上是zset，可以使用zset相关的命令对其进行遍历，如果遍历出现中文乱码可以使用如下命令：redis cli raw 2.geopos key member [member] 从键里面返回所有指定名称(member )元素的位置（经度和纬度），不存在返回nil geopos city 天安门 故宫 长城 3.geodist key member1 member2 [m|km|ft|mi] 返回两个给定位置之间的距离 m 米 km 千米 ft 英寸 mi 英里 4.georadius key longitude latitude radius m|km|ft|mi \\[withcoord] \\[withdist] \\[withhash] [count count [any] 以给定的经纬度为中心，返回与中心的距离不超过给定最大距离的所有元素位置 withdist: 在返回位置元素的同时， 将位置元素与中心之间的距离也一并返回。 距离的单位和用户给定的范围单位保持一致。 withcoord: 将位置元素的经度和维度也一并返回。 withhash:以 52 位有符号整数的形式， 返回位置元素经过原始 geohash 编码的有序集合分值。 这个选项主要用于底层应用或者调试，实际中的作用并不大 count 限定返回的记录数。 5.georadiusbymember 跟georadius类似 6.geohash 返回一个或多个位置元素的geohash表示 geohash 算法生成的base32编码值，3维变2维变1维"}, {"sid": "chapter-2-section-11", "ch": "3.redis10大数据类型", "sec": "12.Redis流(Stream)", "t": "redis流(stream) 是什么 redis5.0 之前的痛点，redis消息队列的2种方案： 1. list实现消息队列，list实现方式其实就是点对点的模式 2. pub/sub redis5.0版本新增了一个更强大的数据结构 stream 一句话：stream流就是redis版的mq消息中间件+阻塞队列 能干嘛 实现消息队列，它支持消息的持久化、支持自动生成全局唯一id、支持ack确认消息的模式、支持消费组模式等，让消息队列更加的稳定和可靠 底层结构和原理说明 一个消息链表，将所有加入的消息都串起来，每个消息都有一个唯一的id和对应的内容 基本命令理论简介 队列相关指令 消费组相关指令 xinfo groups 打印消费组的详细信息 xinfo stream 打印stream的详细信息 四个特殊符号 | + | 最小和最大可能出现的id | | | | | $ | $表示只消费新的消息，当前流中最大的id，可用于将要到来的信息 | | | 用于xreadgroup命令，表示迄今还没有发送给组中使用者的信息，会更新消费者组的最后id | | | 用于xadd命令，让系统自动生成id | 基本命令代码实操 redis流实例演示 队列相关命令 1.xadd 添加消息到队列末尾，消息id必须要比上一个id大，默认用星号表示自动生成id； 用于xadd命令中，让系统自动生成id； xadd用于向stream队列中添加消息，如果指定的stream队列不存在，则该命令执行时会新建一个stream队列 生成的消息id，有两部分组成，毫秒时间戳 该毫秒内产生的第一条消息 // 表示服务器自动生成messageid(类似mysql里面主键auto increment)，后面顺序跟着一堆业务key/value | 信息条目指的是序列号，在相同的毫秒下序列号从0开始递增，序列号是64位长度，理论上在同一毫秒内生成的数据量无法到达这个级别，因此不用担心序列号会不够用。milisecondstime指的是redis节点服务器的本地时间，如果存在当前的毫秒时间截比以前已经存在的数据的时间戳小的话(本地时间钟后跳)，那么系统将会采用以前相同的毫秒创建新的id，也即redis 在增加信息条目时会检查当前 id 与上一条目的 id，自动纠正错误的情况，一定要保证后面的 id 比前面大，.个流中信息条目的id必须是单调增的，这是流的基础。 | | | | 客户端显示传入规则:<br / redis对于id有强制要求，格式必须是 时间戳 自增id 这样的方式，且后续id不能小于前一个id | | stream的消息内容，也就是图中的messaget它的结构类似hash结构，以kev value的形式存在 | 2.xrange key start end [count count] 用于获取消息列表（可以指定范围），忽略删除的消息 start 表示开始值， 代表最小值 end 表示结束值，+代表最大值 count 表示最多获取多少个值 3.xrevrange key end start [count count] 根据id降序输出 4.xdel key id [id ...] 5.xlen key 6.xtrim key maxlen|minid 用于对stream的长度进行截取，如超长会进行截取 maxlen 允许的最大长度，对流进行修剪限制长度 minid 允许的最小id，从某个id值开始比该id值小的将会被抛弃 7.xread \\[count count] [block milliseconds] streams key [key ...] id [id ...] 可以读取多个key 用于获取消息(阻塞/非阻塞) ​ 只会返回大于指定id的消息，count最多读取多少条消息；block是否以阻塞的方式读取消息，默认不阻塞，如果milliseconds设置为0，表示永远阻塞 非阻塞 $表特殊id，表示以当前stream已经存储的最大的id作为最后一个id，当前stream中不存在大于当前最大id的消息，因此此时返回nil 0 0代表从最小的id开始获取stream中的消息，当不指定count，将会返回stream中的所有消息，注意也可以使用0 (00/000也都是可以的) ​ 阻塞 小总结（类似java里面的阻塞队列） stream的基础方法，使用xadd存入消息和xread循环阻塞读取消息的方式可以实现简易版的消息队列 消费组相关指令 1.xgroup create key group id|$ 用于创建消费组 xgroup create mystream group $ xgroup create mystream groupb 0 $表示从stre"}, {"sid": "chapter-2-section-12", "ch": "3.redis10大数据类型", "sec": "13.Redis位域(bitfield)", "t": "redis位域(bitfield) 能干嘛 位域修改、溢出控制 一句话 将一个redis字符串看作是 一个由二进制位组成的数组 并能对变长位宽和任意没有字节对齐的指定整型位域进行寻址和修改 命令代码实操 ascii码表：https://ascii.org.cn 1.bitfield key [get type offset] 2.bitfield key set type offstet value 3.bitfield key [incrby type offset increment] 如果偏移量后面的值发生溢出（大于127），redis对此也有对应的溢出控制，默认情况下，incrby使用wrap参数 4.溢出控制 overflow [wrap|sat|fail] wrap:使用回绕(wrap around)方法处理有符号整数和无符号整数溢出情况 sat:使用饱和计算(saturation arithmetic)方法处理溢出，下溢计算的结果为最小的整数值，而上溢计算的结果为最大的整数值 fail:命令将拒绝执行那些会导致上溢或者下溢情况出现的计算，并向用户返回空值表示计算未被执行"}, {"sid": "chapter-3-section-0", "ch": "4.Redis持久化", "sec": "1.总体介绍", "t": "总体介绍 官网地址：https://redis.io/docs/manual/persistence/ 为什么需要持久化 持久化双雄 rdb (redis database) aof (append only file)"}, {"sid": "chapter-3-section-1", "ch": "4.Redis持久化", "sec": "2.RDB(Redis DataBase)", "t": "redis database 官网介绍 rdb(redis 数据库)：rdb持久化以指定的时间间隔执行数据集的时间点快照 是什么 在指定的时间间隔，执行数据集的时间点快照 实现类似照片记录效果的方式，就是把某一时刻的数据和状态以文件的形式写到磁盘上，也就是快照。这样一来即使故障宕机，快照文件也不会丢失，数据的可靠性也就得到了保证。 这个快照文件就称为rdb文件(dump.rdb)其中，rdb就是redis database的缩写。 能干嘛 在指定的时间间隔内将内存中的数据集快照写入磁盘，也就是行话讲的snapshot内存快照，它恢复时再将硬盘快照文件直接读回到内存里。 redis的数据都在内存中，保存备份时它执行的是全量快照，也就是说，把内存中的所有数据都记录到磁盘中，一锅端。 rdb保存的是dump.rdb文件。"}, {"sid": "chapter-3-section-2", "ch": "4.Redis持久化", "sec": "3.RDB案例演示", "t": "rdb案例演示 需求说明 配置文件(6 vs 7) redis6.0.16及以下 redis6.2以及redis 7.0.0 操作步骤 自动触发 redis7版本，按照redis.conf里配置的 save \\<seconds \\<changes 本次案例5秒2次修改 修改dump文件保存路径 修改dump文件名称 触发备份 第一种情况，5秒内保存2次 第二种情况，两次保存间隔超过5秒 注：rdb 持久化是 redis 的一种持久化机制，它会在 redis 数据发生修改时对内存中的数据进行快照，然后保存到磁盘，以保证数据的持久性。通常情况下，rdb 保存快照的时间间隔由配置文件中的参数 save 决定，格式为 save \\<seconds \\<changes ，表示在 \\<seconds 秒内，如果数据有 \\<changes 次修改，则会进行一次快照。 在题目描述的情况下，rdb 设置了每 5 秒进行一次快照，但是如果在 5 秒内修改次数超过了 2 次，也会进行快照。这是因为在 redis 中，保存快照并不是在规定的时间到达后才进行，而是在修改数据时和时间间隔条件的双重限制下才进行的。 如果限制只按时间间隔来进行保存快照，则会出现两个问题： 如果时间间隔太大，那么 redis 持久化的数据可能会丢失，并且故障恢复时的数据可能会受到影响。 如果时间间隔太小，那么数据的保存成本就会过高，并可能导致 redis 运行效率下降。 因此，redis 引入了按时间和数据修改次数双重限制的快照保存机制，以在灵活性和效率之间取得平衡。如果在 5 秒内修改的次数超过 2 次，则说明数据的变化较快，在此情况下保存快照并不会带来明显的性能问题。因此，redis 将其纳入保存快照的范围，以保证数据的安全和一致性 如何恢复 将备份文件(dump.rdb)移动到 redis 安装目录并启动服务即可 备份成功后故意用flushdb清空redis，看看是否可以恢复数据 执行flushall/flushdb命令也会产生dump.rdb文件，但里面是空的，无意义 物理恢复，一定要将服务产生的rdb文件备份一份，然后分机隔离，避免生产上物理损坏后备份文件也挂了。 手动触发 使用save或者bgsave命令 redis提供了两个命令来生成rdb文件，分别是save和bgsave save ：在主程序中执行会 阻塞 当前redis服务器，直到持久化工作完成执行save命令期间，redis不能处理其他命令， 线上禁止使用 bgsave(默认) ： redis会在后台异步进行快照操作， 不阻塞 快照同时还可以相应客户端请求，该触发方式会fork一个子进程由子进程复制持久化过程 官网说明 redis会使用bgsave对当前内存中的所有数据做快照，这个操作是子进程在后台完成的，这就允许主进程同时可以修改数据。 fork是什么？ 在linux程序中，fork()会产生一个和父进程完全相同的子进程，但子进程在此后会exec系统调用，处于效率考虑，尽量避免膨胀 lastsave 可以通过lastsave命令获取最后一次成功执行快照的时间"}, {"sid": "chapter-3-section-3", "ch": "4.Redis持久化", "sec": "4.RDB优劣", "t": "rdb优劣 优势 官网说明： rdb是redis 数据的一个非常紧凑的单文件时间点表示。rdb文件非常适合备份。例如，您可能希望在最近的24小时内每小时归档一次rdb文件，并在30天内每天保存一个rdb快照。这使您可以在发生灾难时轻松恢复不同版本的数据集。 rdb非常适合灾难恢复，它是一个可以传输到远程数据中心或amazon s3(可能已加密）的压缩文件。 rdb最大限度地提高了redis 的性能，因为redis 父进程为了持久化而需要做的唯一工作就是派生一个将完成所有其余工作的子进程。父进程永远不会执行磁盘i/о或类似操作。 与aof 相比，rdb允许使用大数据集更快地重启。 在副本上，rdb支持重启和故障转移后的部分重新同步。 小总结： 适合大规模的数据恢复 按照业务定时备份 对数据完整性和一致性要求不高 rdb文件在内存中的加载速度要比aof快很多 劣势 官网说明： 如果您需要在redis停止工作时（例如断电后）将数据丢失的可能性降到最低，那么rdb并不好。您可以配置生成rdb的不同保存点（例如，在对数据集至少5分钟和100次写入之后，您可以有多个保存点)。但是，您通常会每五分钟或更长时间创建一次rdb快照，因此，如果redis由于任何原因在没有正确关闭的情况下停止工作，您应该准备好丢失最新分钟的数据。 rdb需要经常fork()以便使用子进程在磁盘上持久化。如果数据集很大，fork()可能会很耗时，并且如果数据集很大并且cpu性能不是很好，可能会导致redis停止为客户端服务几毫秒甚至一秒钟。aof也需要fork()但频率较低，您可以调整要重写日志的频率，而不需要对持久性进行任何权衡。 小总结： 在一定间隔时间做一次备份，所以如果redis意外down掉的话，就会丢失从当前至最近一次快照期间的数据， 快照之间的数据会丢失 内存数据的全量同步，如果数据量太大会导致io严重影响服务器性能 rdb依赖于主进程的fork，在更大的数据集中，这可能会导致服务请求的瞬间延迟。fork的时候内存中的数据被克隆了一份，大致2倍的膨胀性，需要考虑 模拟数据丢失："}, {"sid": "chapter-3-section-4", "ch": "4.Redis持久化", "sec": "5.RDB快照文件", "t": "rdb快照文件.md 如何检查修复dump.rdb文件？ 进入到redis安装目录，执行redis check rdb命令 redis check rdb ./redisconfig/dump.rdb 哪些情况会触发rdb快照 1. 配置文件中默认的快照配置 2. 手动save/bgsave命令 3. 执行flushdb/fulshall命令也会产生dump.rdb文件，但是也会将命令记录到dump.rdb文件中，恢复后依旧是空，无意义 4. 执行shutdown且没有设置开启aof持久化 5. 主从复制时，主节点自动触发 如何禁用快照 1. 动态所有停止rdb保存规则的方法：redis cli config set value \"\" 2. 手动修改配置文件 rdb优化配置项详解 配置文件snapshotting模块 save \\<seconds \\<changes ：配置快照保存条件 dir：配置快照保存目录地址 dbfilename：配置快照的文件名 stop writes on bgsave error： 默认yes，如果配置成no，表示不在乎数据不一致或者有其他的手段发现和控制这种不一致，那么在快照写入失败时，也能确保redis继续接受新的请求 rdbcompression： 默认yes，对于存储到磁盘中的快照，可以设置是否进行压缩存储。如果是的话，redis会采用lzf算法进行压缩。如果你不想消耗cpu来进行压缩的话，可以设置为关闭此功能 rdbchecksum： 默认yes，在存储快照后，还可以让redis使用crc64算法来进行数据校验，但是这样做会增加大约10%的性能消耗，如果希望获取到最大的性能提升，可以关闭此功能 rdb del sync files： 在没有持久化的情况下删除复制中使用的rdb文件。默认情况下no，此选项是禁用的。 小总结："}, {"sid": "chapter-3-section-5", "ch": "4.Redis持久化", "sec": "6.AOF(Append Only File)", "t": "aof(append only file) 官网介绍 是什么 以日志的形式来记录每个写操作，将redis执行过的所有写指令记录下来(读操作不记录)，只许追加文件但是不可以改写文件，redis启动之初会读取该文件重新构建数据，换言之，redis重启的话就根据日志文件的内容将写指令从前到后执行一次以完成数据的恢复工作 默认情况下，redis是没有开启aof的。开启aof功能需要设置配置：appendonly yes 能干嘛 aof保存的是appendonly.aof文件 aof持久化工作流程 1.client作为命令的来源，会有多个源头以及源源不断的请求命令。 2.在这些命令到达redis server 以后并不是直接写入aof文件，会将其这些命令先放入aof缓存中进行保存。这里的aof缓冲区实际上是内存中的一片区域，存在的目的是当这些命令达到一定量以后再写入磁盘，避免频繁的磁盘io操作。 3.aof缓冲会根据aof缓冲区 同步文件的三种写回策略 将命令写入磁盘上的aof文件。 4.随着写入aof内容的增加为避免文件膨胀，会根据规则进行命令的合并( 又称aof重写 )，从而起到aof文件压缩的目的。 5.当redis server服务器重启的时候会队aof文件载入数据。 aof缓冲区三种写回策略 always ：同步写回，每个写命令执行完立刻同步地将日志写会磁盘 everysec ：每秒写回，每个写命令执行完，只是先把日志写到aof文件的内存缓冲区，每隔1秒把缓冲区中的内容写入到磁盘 no ：操作系统控制的写回，每个写命令执行完，只是先把日志写到aof文件的内存缓冲区，由操作系统决定何时将缓冲区内容写回磁盘 小总结："}, {"sid": "chapter-3-section-6", "ch": "4.Redis持久化", "sec": "7.AOF案例演示和优劣对比", "t": "aof案例演示和优劣对比 配置文件说明 (6 vs 7) 如何开启aof 使用默认写回策略 aof文件 保存路径 redis6及以前 aof保存文件的位置和rdb保存文件的位置一样，都是通过redis.conf配置文件的dir配置 .jpg) redis7最新 .jpg) 一句话： aof文件 保存名称 redis6及以前 ，有且仅有一个 .jpg) redis7 multi part aof的设计 从1个文件到3个文件 .jpg) mp aof实现 方案概述 顾名思义，mp aof就是将原来的单个aof文件拆分成多个aof文件。在mp aof中，我们将aof分为三种类型, 分别为: base: 表示基础aof ，它一般由子进程通过重写产生，该文件最多只有一个。 incr:表示增量aof ，它一般会在aofrw开始执行时被创建，该文件可能存在多个。 history :表示历史aof，它由base和incr aof变化而来，每次aofrw成功完成时，本次aofrw之前对应的base和incr aof都将变为history，history类型的aof会被redis自动删除。 为了管理这些aof文件，我们引入了一个manifest (清单)文件来跟踪、管理这些aof。同时，为了便于aof备份和拷贝，我们将所有的aof文件和manifest文件放入一个单独的文件目录中，目录名由appenddirname配置(redis 7.0新增配置项)决定。 redis7.0config 中对应的配置项 正常恢复 1. 修改默认的appendonly no，改为yes 2. 写操作继续，生成aof文件到指定目录（然后将appendonly文件备份，使用flushdb+shutdown服务器来模拟redis宕机数据丢失，删除生成的新aof文件，将备份文件恢复） 3. 恢复：重启redis然后重新加载，结果ok，将数据重新写入到了redis 异常恢复 1. 故意胡乱改动正常的aof文件，模拟网络闪断文件写入不完整等其他异常情况 2. 重启redis之后就会进行aof文件的载入 3. 异常修复命令：redis check aof fix进行修复 4. 启动后ok 优势 更好的保护数据不丢失、性能高、可做紧急恢复 使用aof redis 更加持久: 您可以有不同的fsync 策略: 根本不fsync、每秒 fsync、每次查询时fsync。使用每秒fsync的默认策略，写入性能仍然很棒。fsync 是使用后台线程执行的，当没有fsync正在进行时，主线程将努力执行写入，因此您只能丢失一秒钟的写入。 aof 日志是一个仅附加日志，因此不会出现寻道问题，也不会在断电时出现损坏问题。即使由于某种原因(磁盘已满或其他原因) 日志以写一半的命令结尾，redis check aof 工具也能够轻松修复它。 当aof 变得太大时，redis 能够在后台自动重写aof。重写是完全安全的，因为当 redis继续附加到旧文件时，会使用创建当前数据集所需的最少操作集生成一个全新的文件，一旦第二个文件准备就绪，redis 就会切换两者并开始附加到新的那一个。 aof以易于理解和解析的格式依次包含所有操作的日志。您甚至可以轻松导出aof文件。例如，即使您不小心使用孩flushall命令刷新了所有内容，只要在此期间没有执行日志重写，您仍然可以通过停止服务器、删除最新命令并重新启动 redis 来保存您的数据集。 劣势 相同数据集的数据而言aof文件要远大于rdb文件，恢复速度慢于rdb aof运行效率要慢于rdb，每秒同步策略效率较好，不同步效率和rdb相同 aof文件通常比相同数据集的等效 rdb 文件大。 根据确切的 fsync策略，aof可能比 rdb 慢。一般来说，将fsync 设置为每秒性能仍然非常高，并且在禁用 fsync的情况下，即使在高负载下它也应该与 rdb 一样快。即使在巨大的写入负载的情况下，rdb仍然能够提供关于最大延迟的更多保证。"}, {"sid": "chapter-3-section-7", "ch": "4.Redis持久化", "sec": "8.AOF重写机制", "t": "aof重写机制 是什么？ 由于aof持久化是redis不断将写命令记录到 aof 文件中，随着redis不断的进行，aof 的文件会越来越大,文件越大，占用服务器内存越大以及 aof 恢复要求时间越长。 为了解决这个问题， redis新增了重写机制 ，当aof文件的大小超过所设定的峰值时，redis就会 自动 启动aof文件的内容压缩.只保留可以恢复数据的最小指令集或者可以 手动使用命令 bgrewriteaof 来重新 。 一句话：启动aof文件的内容压缩，只保留可以恢复数据的最小指令集。 触发机制 官网默认配置 自动触发 满足配置文件中的选项后，redis会记录上次重写时的aof大小，默认配置是当aof文件大小是上次rewrite后大小的一倍且文件大于64m时 手动触发 客户端向服务器发送bgrewriteaof命令 案例说明 需求说明： 启动aof文件的内容压缩，只保留可以恢复数据的最小指令集。 举个例子: 比如有个key 开始你 set k1 v1 然后改成 set k1 v2 最后改成 set k1 v3 如果不重写，那么这3条语句都在aof文件中，内容占空间不说启动的时候都要执行一遍，共计3条命令但是，我们实际效果只需要set k1 v3这一条，所以， 开启重写后，只需要保存set k1 3就可以了只需要保留最后一次修改值，相当于给aof文件瘦身减肥，性能更好。 aof重写不仅降低了文件的占用空间，同时更小的aof也可以更快地被redis加载。 需求验证： 启动aof文件的内容压缩，只保留可以恢复数据的最小指令集。 步骤： 前期配置准备： 1. 开启aof，appendonly yes，设置aof持久化开启 2. 重写峰值修改为1k 3. 关闭混合，设置为no 4. 删除执勤啊的全部aof和rdb，清除干扰项 自动触发案例01 1. 完成上述正确配置，重启redis服务器，执行 set k1 v1 查看aof文件是否正常 2. 查看aof三大 配置文件 appendonly.aof.1.base.aof；appendonly.aof.1.incr.aof；appendonly.aof.manifest 3. k1不停的更新值 4. 重写触发 手动触发案例02 客户端向服务器发送bgrewriteaof命令 结论 也就是说aof文件重写并不是对原文件进行重新整理，而是直接读取服务器现有的键值对，然后用一条命令去代替之前记录这个键值对的多条命令，生成一个新的文件后去替换原来的aof文件。 aof文件重写触发机制:通过 redis.conf配置文件中的 auto aof rewrite percentage:默认值为100，以及auto aof rewrite min size: 64mb配置，也就是说默认redis会记录上次重写时的aof大小， 默认配置是当aof文件大小是上次rewrite后大小的一倍且文件大于64m时触发。 重写原理 1. 在重写开始前，redis会创建一个“重写子进程”，这个子进程会读取现有的aof文件，并将其包含的指令进行分析压缩并写入到一个临时文件中。 2. 与此同时，主进程会将新接收到的写指令一边累积到内存缓冲区中，一边继续写入到原有的aof文件中，这样做是保证原有的aof文件的可用性，避免在重写过程中出现意外。 3. 当“重写子进程”完成重写工作后，它会给父进程发一个信号，父进程收到信号后就会将内存中缓存的写指令追加到新aof文件中 4. 当追加结束后，redis就会用新aof文件来代替旧aof文件，之后再有新的写指令，就都会追加到新的aof文件中 5. 重写aof文件的操作，并没有读取旧的aof文件，而是将整个内存中的数据库内容用命令的方式重写了一个新的aof文件，这点和快照有点类似 aof 优化配置项详解 配置文件 append only mode模块 小总结"}, {"sid": "chapter-3-section-8", "ch": "4.Redis持久化", "sec": "9.RDB-AOF混合持久化", "t": "rdb aof混合持久化 官网建议 rdb vs aof 问题： 可否共存？ 如果共存听谁的？ redis配置文档解答：rdb和aof共存时会优先加载aof文件 数据恢复顺序和加载流程 你怎么选？用哪个？ rdb持久化方式能够在指定的时间间隔对你的数据进行快照存储。 aof持久化方式记录每次对服务器写的操作，当服务器重启的时候会重新执行这些命令来恢复原始的数据，aof命令以redis协议追加保存每次写的操作到文件末尾。 同时开启两种持久化方式 在这种情况下，当redis重启的时候会优先载入aof文件来恢复原始的数据，因为在通常情况下aof文件保存的数据集要比rdb文件保存的数据集要完整。 rdb的数据不实时，同时使用两者时服务器重启也只会找aof文件。但是作者也不建议只使用aof方式备份，因为rdb更适合用于备份数据库（aof在不断的变化不好备份），留着rdb作为一个万一的手段。 推荐方式 rdb+aof混合方式 1开启混合方式设置 $设置aof use rdb preamble的值为yes， yes表示开启，设置为no表示禁用​$ 2 rdb+aof的混合方式 结论:rdb镜像做全量持久化，aof做增量持久化 先使用rdb进行快照存储，然后使用aof持久化记录所有的写操作，当重写策略满足或手动触发重写的时候，将最新的数据存储为新的rdb记录。这样的话，重启服务的时候会从rdb和aof两部分恢复数据，既保证了数据完整性，又提高了恢复数据的性能。简单来说:混合持久化方式产生的文件一部分是rdb格式，一部分是aof格式。 》aof包括了rdb头部+aof混写"}, {"sid": "chapter-3-section-9", "ch": "4.Redis持久化", "sec": "10纯缓存模式", "t": "纯缓存模式 同时关闭rdb+aof，专心做缓存 1. save \"\" 禁用rdb 禁用rdb持久化模式下，我们仍然可以使用命令save、bgsave生成rdb文件 2. appendonly no 禁用aof 禁用aof持久化模式下，我们仍然可以使用命令bgrewriteaof生成aof文件"}, {"sid": "chapter-4-section-0", "ch": "5.Redis事务", "sec": "1.redis事务介绍", "t": "redis事务介绍 是什么 官网：https://redis.io/docs/manual/transactions/ 可以一次执行多个命令，本质是一组命令的集合，一个事务中的所有命令都会序列化，$按顺序地串行化执行而不会被其他命令插入，不许加塞​$ 能干嘛 一个队列中，一次性、顺序性、排他性的执行一系列命令 redis事务 vs 数据库事务 | 1.单独的隔离操作 | redis的事务仅仅是保证事务里的操作会被连续独占的执行，redis命令执行是单线程架构，在执行完事务内所有指令前是不可能再去同时执行其他客户端的请求的 | | | | | 2.没有隔离级别的概念 | 因为事务提交前任何指令都不会被实际执行，也就不存在”事务内的查询要看到事务里的更新，在事务外查询不能看到”这种问题了 | | 3.不保证原子性 | redis的事务不保证原子性，也就是不保证所有指令同时成功或同时失败，只有决定是否开始执行全部指令的能力，没有执行到一半进行回滚的能力 | | 4.排它性 | redis会保证一个事务内的命令依次执行，而不会被其它命令插入 |"}, {"sid": "chapter-4-section-1", "ch": "5.Redis事务", "sec": "2.怎么玩", "t": "怎么玩 官网 ：https://redis.io/docs/manual/transactions/ 常用命令 case1：正常执行 multi exec case2：放弃事务 multi discard case3：全体连坐 官网说明： 一个语法出错，全体连坐。如果任何一个命令语法有错，redis会直接返回错误，所有的命令都不会执行 case4：冤头债主 官网说明： 补充： 注意和传统数据库事务的区别，不一定要么全部成功要么全部失败 case5：watch监控 redis使用watch来提供乐观锁定，类似于cas(check and set) 1. 悲观锁：悲观锁(pessimistic lock)，顾名思义，就是很悲观，每次去拿数据的时候都认为别人会修改，所以每次在拿数据的时候都会上锁，这样别人想拿这个数据就会block直到它拿到锁 2. 乐观锁：乐观锁(optimistic lock)，顾名思义，就是很乐观，每次去拿数据的时候都认为别人不会修改，所以不会上锁，但是在更新的时候会判断一下在此期间别人有没有去更新这个数据。 乐观锁策略：提交版本必须大于记录当前版本才能执行更新 3. cas watch key [key ...] 1. 初始化k1和balance两个key，先监控在开启multi，保证两个key变动在同一个事务内 2. 有加塞篡改：watch命令是一种乐观锁的实现，redis在修改的时候会检测数据是否被更改，如果被更改了，则执行失败 图中3和4不管哪个先执行，最终的结果都是整个事务执行失败 unwatch 小结 一旦执行了exec之前加的监控锁都会被取消掉 当客户端连接丢失的时候(比如退出链接)，所有东西都会被取消监视 小总结 开启：以multi开始一个事务 入队：将多个命令入队到事务中，接到这些命令并不会立即执行，而是放到等待执行的事务队列里面 执行：有exec命令触发事务"}, {"sid": "chapter-5-section-0", "ch": "6.Redis管道", "sec": "1.Redis管道介绍", "t": "redis管道介绍 面试题：如何优化频繁命令往返造成的性能瓶颈？ redis是一种基于 客户端 服务端模型 以及请求/响应协议的tcp服务。一个请求会遵循以下步骤: 1客户端向服务端发送命令分四步(发送命令→命令排队→命令执行 返回结果)，并监听socket返回，通常以阻塞模式等待服务端响应。 2服务端处理命令，并将结果返回给客户端。 上述两步称为: round trip time(简称rtt,数据包往返于两端的时间)。 如果同时需要执行大量的命令，那么就要等待上一条命令应答后再执行，这中间不仅仅多了rtt (round time trip) ，而且还频繁调用系统io， 发送网络请求，同时需要redis调用多次read()和write()系统方法， 系统方法会将数据从用户态转移到内核态，这样就会对进程上下文有比较大的影响了，性能不太好，0(π π)0。这时候redis管道就出现了。"}, {"sid": "chapter-5-section-1", "ch": "6.Redis管道", "sec": "2.是什么", "t": "是什么 上述问题的解决思路 管道(pipeline)可以一次性发送多条命令给服务端， 服务端依次处理完毕后，通过一 条响应一次性将结果返回，通过减少客户端与redis的通信次数来实现降低往返延时时间 。pipeline实现的原理是队列，先进先出特性就保证数据的顺序性。 官网： https://redis.io/docs/manual/pipelining/ 定义： pipeline是为了解决rtt往返时，仅仅是将命令打包一次性发送，对整个redis的执行不造成其他任何影响 一句话： 批处理命令变种优化措施 ，类似redis的原生批命令(mget和mset) 案例演示 小总结 pipeline与原生批量命令对比 1. 原生批量命令是原子性(例如：mset、mget)，pipeline是非原子性的 2. 原生批量命令一次只能执行一种命令，pipeline支持批量执行不同命令 3. 原生批量命令是服务端实现，而pipeline需要服务端与客户端共同完成 pipeline与事务对比 1. 事务具有原子性，管道不具有原子性 2. 管道一次性将多条命令发送到服务器，事务是一条一条的发，事务只有在接收到exec命令后才会执行，管道不会 3. 执行事务时会阻塞其他命令的执行，而执行管道中的命令时不会 使用pipeline注意事项 1. pipeline缓冲的指令只是会依次执行，不保证原子性，如果执行中指令发生异常，将会继续执行后续的指令 2. 使用pipeline组装的命令个数不能太多，不然数量过大客户端阻塞的时间可能过久，同时服务端此时也被迫回复一个队列答复，占用很多内存"}, {"sid": "chapter-6-section-0", "ch": "7.Redis发布订阅", "sec": "1.Redis发布订阅介绍", "t": "redis发布订阅介绍 学习定位：了解即可 是什么 定义： 是一种消息通信模式：发送者(publish)发送消息，订阅者(subscribe)接收消息，可以实现进程间的消息传递 官网： https://redis.io/docs/manual/pubsub/ 一句话： redis可以实现消息中间件mq的功能，通过发布订阅实现消息的引导和分流。但是目前不推荐使用该功能，专业的事情交给专业的中间件处理，redis就做好分布式缓存功能 能干嘛 redis客户端可以订阅任意数量的频道，类似我们微信关注多个公众号 当有新消息通过publish命令发送给频道channel1时，订阅客户端都会收到消息 小总结"}, {"sid": "chapter-6-section-1", "ch": "7.Redis发布订阅", "sec": "2.Redis发布订阅常用命令", "t": "redis发布订阅常用命令 常用命令： subscribe channel [channel ...] 订阅给定的一个或多个频道的信息 推荐先执行订阅然后在发布，订阅成功之前发布的消息是收不到的 订阅的客户端每次可以收到一个3个参数的消息 1. 消息种类 2. 始发频道的名称 3. 实际的消息内容 publish channel message 发布消息到指定的频道 psubscribe pattern [pattern ...] 按照模式批量订阅，订阅一个或多个符合给定模式(支持 号？号之类的)的频道 pubsub subcommand [argument [argument ...]] 查看订阅与发布系统 pubsub channels ​ 由活跃频道组成的列表 pubsub numsub [channel [channel ...]] ​ 某个频道有几个订阅者 pubsub numpat ​ 只统计使用psubscribe命令执行的返回客户端订阅的唯一模式的数量 unsubscribe [channel [channel ...]] 退订给定的频道 punsubscribe [pattern [pattern ...]] 退订所有给定模式的频道"}, {"sid": "chapter-6-section-2", "ch": "7.Redis发布订阅", "sec": "3.案例演示", "t": "案例演示 1. 开启3个客户端，演示客户端a、b订阅消息，客户端c发布消息 2. 演示批量订阅和发布 3. 取消订阅 小总结 <font color = 'red' 可以实现消息中间件mq的功能，通过发布订阅实现消息的引导和分流。但是不推荐使用该功能，专业的事情交给专业的中间件处理，redis就做好分布式缓存功能 </font pub/sub缺点 1. 发布的消息在redis系统中不能持久化，因此，必须先执行订阅，在等待消息发布。如果先发布了消息，那么该消息由于没有订阅者，消息将被直接丢弃 2. 消息只管发送，对于发布者而言消息是即发即失，不管接受，也没有ack机制，无法保证消息的消费成功 3. 以上的缺点导致redis的pub/sub模式就像个小玩具，在生产环境中几乎无用武之地，为此redis5.0版本新增了stream数据结构，不但支持多播，还支持数据持久化，相比pub/sub更加的强大"}, {"sid": "chapter-7-section-0", "ch": "8.Redis复制(replica)", "sec": "1.Redis复制介绍", "t": "redis复制介绍 是什么 官网地址：https://redis.io/docs/management/replication/ 一句话：就是主从复制，master以写为主，slave以读为主，当master数据变化的时候，自动将新的数据异步同步到其他的slave数据库 能干嘛 读写分离 容灾恢复 数据备份 水平扩容支撑高并发 怎么玩 配从(库)不配主(库) 权限细节，重要 master如果配置了requirepass参数，需要密码登录 ，那么slave就要配置masterauth来设置校验密码，否则的话master会拒绝slave的访问请求 基本操作命令 info replication ：可以查看复制结点的主从关系和配置信息 replicaof 主库ip 主库端口 ：一般写入进redis.conf配置文件内，重启后依然生效 slaveof 主库ip 主库端口 ： ​ 每次与master断开之后，都需要重新连接，除非你配置进了redis.conf文件；在运行期间修改slave节点的信息，如果该数据库已经是某个主数据库的从数据库，那么会停止和原主数据库的同步关系 转而和新的主数据库同步，重新拜码头 slaveof no one ：使当前数据库停止与其他数据库的同步，转成主数据库，自立为王"}, {"sid": "chapter-7-section-1", "ch": "8.Redis复制(replica)", "sec": "2.案例演示-配置文件", "t": "案例演示 配置文件 架构说明 一个master两个slave，三台虚拟机，每台都安装redis 拷贝多个redis.conf文件 redis6379.conf、redis6380.conf、redis6381.conf 小口诀 三台虚拟机需要能相互ping通且需要注意防火墙配置 三大命令： 1. 主从复制 replicaof 主库ip 主库端口，配从(库)不配主(库) 2. 改换门庭 slaveof 新主库ip 新主库端口 3. 自立为王 slaveof no one 修改配置文件细节操作 redis6379.conf为例，步骤如下： 1. 开启daemonize yes 2. 注释掉bind 127.0.0.1 3. protected mode no 4. 指定端口 5. 指定当前工作目录，dir 6. pid文件名字，pidfile 7. log文件名字，logfile 如果日志文件和启动文件同级，这里可以配置为./6379.log，否则这里一定要写绝对路径，是个巨坑！！！ 8. requiredpass 9. dump.rdb名字 10. aof文件，appendfilename 11. 从机访问主机的通行密码masterauth，必须配置 从机需要配置，主机不用"}, {"sid": "chapter-7-section-2", "ch": "8.Redis复制(replica)", "sec": "3.案例演示-常用3招", "t": "案例演示 配置文件 一主二仆 方案1：配置文件固定写死主从关系 配置文件执行：replicaof 主库ip 主库端口 配从(库)不配(主)库：配置从机 先master后两台slave依次启动 主从关系查看 主机日志 ​ 从机日志 ​ 命令：info replication命令查看 主从问题演示 1. q：从机可以执行写命令吗？ a： 不可以，从机只能读 2. q：从机切入点问题？ q：slave是从头开始复制还是从切入点开始复制? a：master启动，写到k3 slave1跟着master同时启动，跟着写到k3 slave2写到k3后才启动，那之前的是否也可以复制? y，首次一锅端，后续跟随，master写，slave跟 3. q：主机shutdown后，从机会上位吗？ a： 从机不动，原地待命，从机数据可以正常使用，等待主机重启归来 4. q：主机shutdown后，重启后主从关系还在吗？从机还能否顺利复制？ a：主从关系依然存在，从机依旧是从机，可以顺利复制 5. q：某台从机down后，master继续，从机重启后它能跟上大部队吗？ a：可以，类似于从机切入点问题 方案2：命令操作手动主从关系指令 1. 从机停机去掉配置文件中的配置项，3台目前都是主机状态，各不从属 2. 3台master 3. 预设的从机上执行命令 salveof 主库ip 主库端口 4. q：用命令使用的话，2台从机重启后，关系还在吗？ a：不会存在了 配置 vs 命令的区别，配置，持久稳定永久生效；命令，当成生效 薪火相传 上一个slave可以是下一个slave的master，slave同样可以接收其他slaves的连接和同步请求，那么该slave作为了链条中下一个的master,可以有效减轻主master的写压力 中途变更转向:会清除之前的数据，重新建立主从关系并拷贝最新的 slaveof 新主库ip 新主库端口 反客为主 slaveof no one 使当前数据库停止与其他数据库的同步关系"}, {"sid": "chapter-7-section-3", "ch": "8.Redis复制(replica)", "sec": "4.复制原理和工作流程", "t": "复制原理和工作流程 slave启动，同步初请 slave启动成功链接到master后会发送一个sync命令 slave首次全新连接master，一次完全同步(全量复制)将被自动执行，slave自身原有数据会被master数据覆盖清除 首次连接，全量复制 master节点收到sync命令后会开始在后台保存快照(即rdb持久化，主从复制时会触发rdb)，同时收集所有接收到的用于修改数据集的命令并缓存起来，master节点执行rdb持久化完后，master将rdb快照文件和所有缓存的命令发送到所有slave，以完成一次完全同步 而slave服务在接收到数据库文件数据后，将其存盘并加载到内存中，从而完成复制初始化 心跳持续，保持通信 repl ping replica period 10 进入平稳，增量复制 master继续将新的所有收集到的修改命令自动依次传送给slave，完成同步 从机下线，重连续传 master会检查backlog里面的offset，master和slave都会保存一个复制的offset还有一个masterid，offset是保存在backlog中的。master只会把已经缓存的offset后面的数据复制给slave，类似断点续传 复制的缺点 复制延时，信号衰减 由于所有的写操作都是先在master上操作，然后同步更新到slave上，所以从master同步到slave机器有一定的延迟，当系统很繁忙的时候，延迟问题会更加严重，slave机器数量的增加也会使这个问题更加严重。 master挂了怎么办？ 默认情况下，不会在slave节点中自动选一个master 那每次都要人工干预？ 无人值守变成刚需"}, {"sid": "chapter-8-section-0", "ch": "9.Redis哨兵(sentinel)", "sec": "1.Redis哨兵基本介绍", "t": "redis哨兵基本介绍 是什么 吹哨人巡查监控后台master主机是否故障，如果故障了根据投票数自动将某一个从库转换为新主库，继续对外服务 作用：俗称无人值守运维 官网理论：https://redis.io/docs/management/sentinel/ 能干嘛 主从监控 ：监控主从redis库运行是否正常 消息通知 ：哨兵可以将故障转移的结果发送给客户端 故障转移 ：如果master异常，则会进行主从切换，将其中一个slave作为新master 配置中心 ：客户端通过连接哨兵来获得当前redis服务的主节点地址"}, {"sid": "chapter-8-section-1", "ch": "9.Redis哨兵(sentinel)", "sec": "2.sentinel配置参数说明", "t": "配置参数说明 redis sentinel架构，前提说明 3个哨兵：自动监控和维护集群，不存放数据，只是吹哨人 1主2从：用于数据读取和存放 操作步骤 1. /myredis目录下新建或者拷贝sentinel.conf文件按，名字绝对不能错 2. 先看看/opt目录下默认的sentinel.conf文件的内容 3. 重要参数项说明 bind：服务监听地址，用于客户端连接，默认本机地址 daemonize：是否以后台daemon方式运行 protected model：安全保护模式 port：端口 logfile：日志文件路径 pidfile：pid文件路径 dir：工作目录 sentinel\\ monitor <master name <ip <redis port <quorum 设置要监控的master服务器 quorum表示最少有几个哨兵认可客观下线，同意故障迁移的法定票数 网络是不可靠的有时候一个sentinel会因为网络堵塞而误以为master redis已经死掉，在sentinel集群环境下需要多个sentinel互相沟通来确认某个master是否真的死掉了，quorum这个参数是进行客观下线的一个依据，意思是至少有quorum个sentinel认为这个master有故障，才会对这个master进行下线以及故障转移。因为有的时候，某个sentinel节点可能因为自身网络原因，导致无法连接master，而此时master并没有出现故障，所以，这就需要多个sentinel都一致认为改master有问题，才可以进行下一步操作，这就保证了公平性和高可用。 sentinel\\ auth pass <master name <password master设置了密码，连接master服务的密码 其他 | sentinel down after milliseconds <master name <milliseconds | 指定多少毫秒之后，主节点没有应答哨兵，此时哨兵主观上认为主节点下线 | | | | | sentinel parallel syncs <master name <nums | 表示允许并行同步的slave个数，当master挂了后，哨兵会选出新的master，此时，剩余的slave会向新的master发起同步数据 | | sentinel failover timeout <master name <milliseconds | 故障转移的超时时间，进行故障转移时，如果超过设置的毫秒，表示故障转移失败 | | sentinel notification script <master name <script path | 配置当某一事件发生时所需要执行的脚本 | | sentinel client reconfig script <master name <script path | 客户端重新配置主节点参数脚本 |"}, {"sid": "chapter-8-section-2", "ch": "9.Redis哨兵(sentinel)", "sec": "3.sentinel通用配置及主从复制", "t": "sentinel通用配置及主从配置 sentinel26379.conf、sentinel26380.conf、sentinel26381.conf 最终配置 master主机配置文件说明 理论上sentinel配置文件应该部署在不同的服务器上，做成集群，但是本次演示将其放到一台机器上 先启动一主二从3个redis实例，测试正常的主从复制 架构说明 主机6379配置修改 6379后续可能会变成从机，需要设置访问新主机的密码，所以此处会设置masterauth， 不然后续可能会报错 master link status:down 3台不同的虚拟机实例，启动三台真是机器实例并连接 redis server redis6379.conf redis server redis6380.conf redis server redis6381.conf redis cli a 123456 p 6379 redis cli a 123456 p 6380 redis cli a 123456 p 6381 sentinel的两种启动方式 再启动3个哨兵监控后再测试一次主从复制 redis server sentinel26379.conf sentinel redis server sentinel26380.conf sentinel redis server sentinel26381.conf sentinel 启动后我们会发现sentinel配置文件会自动在配置文件中加上部分配置"}, {"sid": "chapter-8-section-3", "ch": "9.Redis哨兵(sentinel)", "sec": "4.哨兵监控节点异常", "t": "主节点异常情况 原有的master挂了 我们自己手动关闭6379服务器，模拟master挂了 问题思考 1. 两台从机数据是否ok 2. 是否会从剩下的2台机器上选出新的master 3. 之前down机的master机器重启回来，谁将会是新老大？会不会双master冲突 揭晓答案 1. 两台从机数据ok 2. 会投票选出新的master主机 3. 谁是master，限本次案例 本案例中6381被选举为新的master，上位成功 重启6379之后，它会从原来的master降级为slave 6380还是slave，只不过是换了一个新老大6381(从跟随6379变成跟随6381) 对比配置文件 老master的redis6379.conf文件 新master的redis6381.conf文件 结论 文件的内容，在运行期间会被sentinel动态进行更改 master slave切换后，master redis.conf、slave redis.conf、sentinel.conf的内容都会发生改\\\\变，即master redis.conf中会多一行slaveof的配置，而升级为master的主机会去掉原来的slaveof配置，\\.conf的监控目标会随之调换 其他备注 生产上都是不同机房不同服务器，很少出现3个哨兵全部挂掉的情况 可以同时金童多个master，一行一个"}, {"sid": "chapter-8-section-4", "ch": "9.Redis哨兵(sentinel)", "sec": "5.哨兵运行流程和选举原理", "t": "哨兵运行流程和选举原理 当一个主从配置中master失效后，sentinel可以选举出一个新的master用于自动接替原master的工作，主从配置中的其他redis服务器自动指向新的master同步数据，一般建议sentinel采取奇数台，防止某一台sentinel无法连接到master导致误切换 运行流程，故障切换 三个哨兵监控一主二从，正常运行中 sdown主观下线(subjectively down) 1. sdown（主观不可用）是 单个sentinel自己主观上 检测到的关于master的状态，从sentinel的角度来看，如果发送了ping心跳后，在一定时间内没有收到合法的回复，就达到了sdown的条件。 2. sentinel配置文件中的down after milliseconds设置了判断主观下线的时间长度 3. 说明 odown客观下线(objectively down) 1. odown需要一定数量的sentinel，多个哨兵达成一致意见才能认为一个master客观上已经宕机 2. 说明 quorum这个参数是进行客观下线的一个依据，法定人数/法定票数 意思是至少有quorum个sentinel认为这个master有故障才会对这个master进行下线以及故障转移。因为有的时候，某个sentinel节点可能因为自身网络原因导致无法连接master，而此时master并没有出现故障，所以这就需要多个sentinel都一致认为该master有问题，才可以进行下一步操作，这就保证了公平性和高可用。 选举出领导者哨兵(哨兵中选出兵王) 1. 当主节点被判断客观下线后，各个哨兵节点会进行协商，先选举出一个领导者哨兵节点（兵王）并由该领导者也即被选举出的兵王进行failover（故障转移）。 哨兵日志文件解读分析 2. 哨兵领导者，兵王如何选出来的？ raft算法 监视该主节点的所有哨兵都有可能被选为领导者，选举使用的算法是raft算法;raft算法的基本思路是先到先得:即在一轮选举中，哨兵a向b发送成为领导者的申请、如果b没有同意过其他哨兵，则会同意a成为领导者。 由兵王开始推动故障切换流程并选出新的master 1. 新主登基 某个slave被选中成为新master 选出新master的规则，剩余slave节点健康前提下，会按下图规则进行选举 1. redis.conf文件中，优先级slave priority或者replica priority最高的从节点(数字越小优先级越高) 2. 复制偏移位置offset最大的从节点(也就是在master还没有宕机时，复制到数据比其他slave要多) 3. 最小run id的从节点，字典顺序，ascii码 2. 群臣俯首 一朝天子一朝臣，换个码头重新拜 执行slaveof no one命令让选出来的从节点成为新的主节点，并通过slaveof命令让其他节点成为其从节点 sentinel leader会对选举出的新master执行slaveof on one操作，将其提升为master节点 sentinel leader向其他slave发送命令，让剩余的slave成为新的master节点的slave 3. 旧主拜服 老master回来也认怂，会被降级为slave 老master重新上线后，会将它设置为新选出的master的从节点 sentinel leader会让原来的master降级为slave并恢复正常工作 4. 小总结 上述的failover操作均由sentinel自己独自完成，完全不需要人工干预 哨兵使用建议 1. 哨兵节点的数量应为多个，哨兵本身应该集群，保证高可用 2. 哨兵节点的数量应该是奇数 3. 各个哨兵节点的配置应一致 4. 如果哨兵节点部署在docker等容器里面，尤其要注意端口的正确映射 5. 哨兵集群+主从复制，并不能保证数据零丢失，所以需要使用集群"}, {"sid": "chapter-9-section-0", "ch": "10.Redis集群(cluster)", "sec": "1.Redis集群介绍", "t": "redis集群介绍 是什么 定义：由于数据量过大，单个master复制集难以承担，因此需要对多个复制集进行集群，形成水平扩展每个复制集只负责存储整个数据集 的一部分，这就是redis的集群，其作用是提供在多个redis节点间共享数据的程序集。 官网：https://redis.io/docs/reference/cluster spec/ 一图： 一句话：redis集群是一个提供在多个redis节点间共享数据的程序集，redis集群可以支持多个master 能干嘛 redis集群支持多个master，每个master又可以挂载多个slave 1. 读写分离 2. 支持数据的高可用 3. 支持海量数据的读写存储操作 由于cluster自带sentinel的故障转移机制，内置了高可用的支持，无需再去使用哨兵功能 客户端与redis的节点连接，不再需要连接集群中所有的节点，只需要任意连接集群中的一个可用节点即可 槽位slot负责分配到各个物理服务节点，由对应的集群来负责维护节点、插槽和数据之间的关系"}, {"sid": "chapter-9-section-1", "ch": "10.Redis集群(cluster)", "sec": "2.集群算法-分片-槽位slot", "t": "集群算法 分片 槽位slot 官网出处： 翻译说明： redis集群的槽位slot redis集群的数据分片 redis集群没有使用一致性hash 而是引入了哈希槽的概念。 redis集群有16384个哈希槽每个key通过crc16校验后对16384取模来决定放置哪个槽，集群的每个节点负责一部分hash槽，举个例子，比如当前集群有3个节点，那么： redis集群的分片 | 分片是什么 | 使用redis集群时我们会将存储的数据分散到多台redis机器上，这称为分片。简言之，集群中的每个redis实例都被认为是整个数据的一个分片。 | | | | | 如何找到给定key的分片 | 为了找到给定key的分片，我们对key进行crc16(key)算法处理并通过对总分片数量取模。然后，使用确定性哈希函数，这意味着给定的key将多次始终映射到同一个分片，我们可以推断将来读取特定key的位置。 | 分片和槽位的优势 最大优势，方便扩缩容和数据分派查找 这种结构很容易添加或者删除节点，比如如果我想添加个节点d，我需要从节点a，b，c中得部分槽位到d上。如果我想一出节点a，需要将a中的槽移动到b和c节点上，然后将没有任何槽的节点从集群中移除即可。由于一个结点将哈希槽移动到另一个节点不会停止服务，所以无论添加删除或者改变某个节点的哈希槽的数量都不会造成集群不可用的状态。"}, {"sid": "chapter-9-section-2", "ch": "10.Redis集群(cluster)", "sec": "3.slot槽位映射方案", "t": "slot槽位映射方案 slot槽位映射，一般业界有三种解决方案 1. 哈希取余分区(小厂) 2亿条记录就是2亿个k,v，我们单机不行必须要分布式多机，假设有3台机器构成一个集群，用户每次读写操作都是根据公式：hash(key) % n个机器台数，计算出哈希值，用来决定数据映射到哪一个节点上。 优点：简单粗暴，直接有效，只需要预估好数据规划好节点，例如3台、8台、10台，就能保证一段时间的数据 支撑。使用hash算法让固定的一部分请求落到同一台服务器上，这样每台服务器固定处理一部分请求 (并维护这些请求的信息)， 起到负载均衡+分而治之的作用。 缺点：原来规划好的节点，进行扩容或者缩容就比较麻烦了额，不管扩缩，每次数据变动导致节点有变动，映射关系需要重新进行计算，在服务器个数固定不变时没有问题，如果需要弹性扩容或故障停机的情况下，原来的取模公式就会发生变化: hash(key)/3会 变成hash(key) /?。此时地址经过取余运算的结果将发生很大变化，根据公式获取的服务器也会变得不可控。 某个redis机器宕机了，由于台数数量变化，会导致hash取余全部数据重新洗牌。 2. 一致性哈希算法分区(中厂) 是什么？ 一致性hash算法背景是在1997年由麻省理工学院提出的，设计目标是 为了解决分布式缓存数据变动和映射问题 ，某个机器宕机了，分母数量改变了，自然取余数不行了 能干嘛？ 提出一致性hash解决方案。目的是当服务器个数发生变动时，尽量减少影响客户端到服务器的映射关系 3大步骤 算法构建一致性哈希环 一致性哈希算法必然有个hash函数并按照算法产生hash值，这个算法的所有可能哈希值会构成一个全量集，这个集合可以成为一个hash空间[0,2^32 1]，这个是一个线性空间，但是在算法中，我们通过适当的逻辑控制将它首尾相连(o= 2^32),这样让它逻辑上形成了一个环形空间。 它也是按照使用取模的方法， 前面笔记介绍的节点取模法是对节点（服务器）的数量进行取模。而一致性hash算法是对2^32取模，简单来说，一致性hash算法将整个哈希值空间组织成一个虚拟的圆环 ，如假设某哈希函数h的值空间为0 2^32 1(即哈希值是一个32位无符号整形），整个哈希环如下图:整个空间 按顺时针方向组织 ，圆环的正上方的点代表0，o点右侧的第一个点代表1，以此类推，2、3、4、……直到2^32 1，也就是说0点左侧的第一个点代表2^32 1，0和2个32 1在零点中方向重合，我们把这个由2^32个点组成的圆环称为hash环。 服务器ip节点映射 将集群中各个ip节点映射到环上的某一个位置。 将各个服务器使用hash进行一个哈希，具体可以选择服务器的ip或主机名作为关键字进行哈希，这样每台机器就能确定其在哈希环上的位置。假如4个节点nodea、b、c、d，经过ip地址的 哈希函数 计算(hash(ip))，使用ip地址哈希后在环空间的位置如下: key落到服务器的落键规则 当我们需要存储一个kv键值对时，首先计算key的hash值，hash(key)，将这个key使用相同的函数hash计算出哈希值并确定此数据在环上的位置， 从此位置沿环顺时针“行走” ，第一台遇到的服务器就是其应该定位到的服务器，并将该键值对存储在该节点上。 如我们有object a、 object b、 object c. object d四个数据对象，经过哈希计算后，在环空间上的位置如下:根据一致性hash算法，数据a会被定为到node a上，b被定为到node b上，c被定为到node c上，d被定为到node d上。 优点 一致性哈希算法的容错性 ：假设node c宕机，可以看到此时对象a、b、d不会受到影响。一般的，在一致性hash算法中，如果一台服务器不可用，则受影响的数据仅仅是此服务器到其环空间中前一台服务悉 〈即沿着逆时针方向行走遇到的第一台服务器）之间数据 ，其它不会受到影响。简单说，就是c挂了，受到影响的只是b、c之间的数据 且这些数据会转移到d进行存储 。 一致性哈希算法的扩展性 数据量增加了，需要增加一台节点nodex，x的位置在a和b之间，那收到影响的也就是a到x之间的数据，重新把a到x的数据录入到x上即可，不会导致hash取余全部数据重新洗牌。 缺点 一致性哈希算法的数据倾斜问题 一致性hash算法在服务 节点太少时 ，容易因为节点分布不均匀而造成 数据倾斜 （被缓存的对象大部分集中缓存在某一台服务器上)问题，例如系统中只有两台服务器: 小总结 为了在节点数目发生改变时尽可能少的迁移数据 将所有的存储节点排列在收尾相接的hash环上，每个key在计算hash后会顺时针找到临近的存储节点存放。而当有节点加入或退出时仅影响该节点在hash环上顺时针相"}, {"sid": "chapter-9-section-3", "ch": "10.Redis集群(cluster)", "sec": "4.3主3从Redis集群配置", "t": "3主3从redis集群配置 找3台真实虚拟机，各自新建 mkdir p /myredis/cluster 新建6个独立的redis实例服务 ip： 192.168.0.100 + 端口6381/6382 ​ vim /myredis/cluster/rediscluster6381.conf conf bind 0.0.0.0 daemonize yes protected mode no port 6381 logfile \"/myredis/cluster/cluster6381.log\" pidfile /myredis/cluster6381.pid dir /myredis/cluster dbfilename dump6381.rdb appendonly yes appendfilename \"appendonly6381.aof\" requirepass 123456 masterauth 123456 cluster enabled yes cluster config file nodes 6381.conf cluster node timeout 5000 ​ vim /myredis/cluster/rediscluster6382.conf ip：192.168.0.100 + 端口6383/6384 ​ vim /myredis/cluster/rediscluster6383.conf ​ vim /myredis/cluster/rediscluster6384.conf ip：192.168.0.100 + 端口6385/6386 ​ vim /myredis/cluster/rediscluster6385.conf ​ vim /myredis/cluster/rediscluster6386.conf 启动6台主机实例 ​ redis server /myredis/cluster/rediscluster6381.conf ​ ... ​ redis server /myredis/cluster/rediscluster6386.conf 通过redis cli 命令为6台机器构建集群关系 构建主从关系命令 conf // 一定要注意，此处要修改自己的ip为真实ip redis cli a 123456 cluster create cluster replicas 1 192.168.111.175:6381 192.168.111.175:6382 192:168.111.172:6383 192.168.111.172:6384 192.168.111.174:6385 192.168.111.174:6386 cluster replicas 1 表示为每个master创建一一个slave节点 一切ok的话，3主3从搞定 6381作为切入点，查看并检验集群状态 连接进6381作为切入点，查看节点状态 cluster nodes cluster info"}, {"sid": "chapter-9-section-4", "ch": "10.Redis集群(cluster)", "sec": "5.3主3从redis集群读写", "t": "3主3从redis集群读写 对6381新增连个key，看看效果如何 为什么报错 如何解决 防止路由失效加参数 c并新增两个key： redis cli a 123456 p 6381 c 服务加上 c后查看集群信息 信息无变化 查看某个key该属于对应的槽位值 cluster keyslot 键名称"}, {"sid": "chapter-9-section-5", "ch": "10.Redis集群(cluster)", "sec": "6.主从容错切换迁移", "t": "主从容错切换迁移 容错切换迁移 主6381和从机切换，先停止主机6381 6381主机停了，对应的真实从机上位 6381作为1号主机分配的从机以实际情况为准，具体是几号机器就是几号机器 再次查看集群信息，本次6381主6384从 停止主机6381，再次查看集群信息 6384成功上位 随后，6381原来的主机回来了，是否会上位？ 恢复前： 恢复后： 6381不会上位并以从节点形式回归 集群不保证数据一致性100%ok，是会有数据丢失的情况 redis集群不保证强一致性这意味着在特定的条件下，redis集群可能会丢掉一些被系统收到的写入请求命令 手动故障转移or节点从属调整该如何处理 上面6381宕机后，6381鸡儿6384主从对调了，和原始设计图不一样了,该如何调换主从位置呢 重新登录6381机器 常用命令：cluster failover"}, {"sid": "chapter-9-section-6", "ch": "10.Redis集群(cluster)", "sec": "7.主从扩容案例", "t": "主从扩容案例 新建6387、6388两个服务实例配置文件+新建后启动 ip：192.168.11.174+端口6387/端口6388 vim /myredis/cluster/rediscluster6387.conf vim /myredis/cluster/rediscluster6388.conf 启动87/88两个新的节点实例，此时他们自己都是master redis server /myredis/cluster/rediscluster6387.conf redis server /myredis/cluster/rediscluster6388.conf 将新增的6387节点(空槽位)作为master节点加入集群 将新增的6387作为master节点加入原有集群 redis cli a 密码 cluster add node 自己实际ip地址:6387 自己实际ip地址:6381 6387就是将要作为master新增节点 6381 就是原来集群节点里面的领路人，相当于6387拜拜6381的码头从而找到组织加入集群redis cli a 123456 cluster add node 192.168.111.174:6387 192.168.111.175:6381 检查集群情况第一次 redis cli a 密码 cluster check 真实ip地址:6381 例如：redis cli a 123456 cluster check 192.168.111.175:6381 重新分派槽位( reshard) 重新分派槽号 命令:redis cli a 密码 cluster reshard ip地址:端口号 redis cli a 123456 cluster reshard 192.168.111.175:6381 检查集群情况第二次 redis cli cluster check 真实ip地址：6381 redis cli cluster check 192.168.111.175:6381 槽位分派说明 为什么6387是3个新的区间，以前的还是连续？ 重新分配成本太高，所以前3家各自匀出来一部分，从6381/6383/6385三个旧节点分别匀出1367个坑位给信节点6387 为主节点6387分配从节点6388 命令：redis cli a 密码 cluster \\ add node ip:新slave端口 ip :新master端口 cluster slave cluster master id 新主机节id redis cli a 111111 cluster add node 192.168.111.174:6388 192.168.111.174:6387 cluster slave cluster master id 4feb6a7ee0ed2b39f86474cf4189ab2a554a40f 这个是6387的编号，按照自己实际情况 检查集群情况第三次 redis cli cluster check 真实ip地址：6381 redis cli cluster check 192.168.111.175:6381"}, {"sid": "chapter-9-section-7", "ch": "10.Redis集群(cluster)", "sec": "8.主从缩容案例", "t": "主从缩容案例 目的：6387和6388下线 检查集群情况第一次，先获得从节点6388的节点id redis cli a 123456 cluster check 192.168.111.174:6388 从集群中将4号结点6388删除 redis cli a 123456 cluster del node 192.168.111.174:6388 218e7b8b4f81be54ff173e4776b4f4faaf7c13da 将6387的槽号清空，重新分配，本例将清出来的槽号都给6381 redis cli a 123456 cluster reshard 192.168.111.175:6381 检查集群情况第二次 redis cli a 123456 cluster check 192.168.111.175:6381 4096个槽位都指给6381，它变成了8192个槽位，相当于全部都给6381了，不然要输入三次 source node 将6387删除 redis cli a 123456 cluster del node 192.168.111.174:6387 307a5f6617a6eeb4949f3cb9124ed04c6962c348 检查集群情况第三次 6387/6388被彻底删除 redis cli a 123456 cluster check 192.168.111.174:6381"}, {"sid": "chapter-9-section-8", "ch": "10.Redis集群(cluster)", "sec": "9.集群常用操作命令和CRC16算法分析", "t": "集群常用操作命令和crc16算法分析 不在同一个slot槽位下的多键操作支持不好，通识占位符登场 不在同一个slot槽位下的键值无法使用mset、mget等多键操作 可以通过{}来定义同一个组的概念，使key中{}内相同内容的键值对放到一个slot槽位去，对照下图类似k1k2k3都映射为x，自然槽位一样 redis集群有16384个哈希槽，每个key通过crc16校验后对16384取模来决定放置哪个槽。集群的每个节点负责一部分hash槽。 crc16源码浅谈 cluster.c源码分析一下 常用命令 集群是否完整才能对外提供服务 | 默认yes，现在集群架构是3主3从的redis cluster由3个master平分16384个slot，每个master的小集群负责1/3的slot，对应一部分数据。cluster require full coverage:默认值yes，即需要集群完整性，方可对外提供服务通常情况，如果这3个小集群中，任何一个(1主1从）挂了，你这个集群对外可提供的数据只有2/3了，整个集群是不完整的， redis默认在这种情况下，是不会对外提供服务的。 | | | | 如果你的诉求是，集群不完整的话也需要对外提供服务，需要将该参数设置为no，这样的话你挂了的那个小集群是不行了，但是其他的小集群仍然可以对外提供服务。 | cluster require full coverage cluster countkeysinslot 槽位数字编号 cluster countkeysinslot 12706 返回结果： ​ 1 该槽位被占用 ​ 0 该槽位没有被占用 cluster keyslot 键名称 cluster keyslot k1 返回对应key的槽位数据，key不存在则返回0"}, {"sid": "chapter-10-section-0", "ch": "11.SpringBoot集成Redis", "sec": "1.SpringBoot集成Redis简介", "t": "springboot集成redis简介 总体概述 jedis lettuce redistemplate三者的联系 本地java连接redis常见问题，小白注意 1. bind配置请注释掉 2. 保护模式设置为no 3. linux系统的防火墙设置 4. redis服务器的ip地址和密码是否正确 5. 忘记写访问redis的服务端口号和auth密码 集成jedis 是什么：jedis client是redis官网推荐的一个面向java客户端，库文件实现了对各类api进行封装调用 步骤： 1. 建module 2. 改pom pom <?xml version=\"1.0\" encoding=\"utf 8\"? <project xmlns=\"http://maven.apache.org/pom/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/xmlschema instance\" xsi:schemalocation=\"http://maven.apache.org/pom/4.0.0 https://maven.apache.org/xsd/maven 4.0.0.xsd\" <modelversion 4.0.0</modelversion <parent <groupid org.springframework.boot</groupid <artifactid spring boot starter parent</artifactid <version 2.7.11</version <relativepath/ <! lookup parent from repository </parent <groupid com.luojia</groupid <artifactid redis7 study</artifactid <version 0.0.1 snapshot</version <name redis7 study</name <description demo project for spring boot</description <properties <project.build.sourceencoding utf 8</project.build.sourceencoding <maven.compiler.source 1.8</maven.compiler.source <maven.compiler.target 1.8</maven.compiler.target <junit.version 4.12</junit.version <log4j.version 1.2.17</log4j.version <lombok.version 1.16.18</lombok.version </properties <dependencies <! springboot 通用依赖模块 <dependency <groupid org.springframework.boot</groupid <artifactid spring boot starter web</artifactid </dependency <! jedis <dependency <groupid redis.clients</groupid <artifactid jedis</artifactid <version 4.3.1</version </dependency <! 通用基础配置 <dependency <groupid junit</groupid <artifactid junit</artifactid <version ${junit.version}</version </dependency <dependency <groupid log4j</groupid <artifactid log4j</artifactid <version ${log4j.version}</version </dependency <dependency <groupid org.projectlombok</groupid <artifactid lombok</artifactid <version ${lombok.version}</version </dependency <dependency <groupid org.springframework.boot</groupid <artifactid spring boot starter test</artifactid <scope test</scope </dependency </dependencies "}, {"sid": "chapter-10-section-1", "ch": "11.SpringBoot集成Redis", "sec": "2.RedisTemplate", "t": "redistemplate 推荐使用 连接单机 boot整合redis基础演示 建module 改pom xml <! springboot 与redis整合依赖 <dependency <groupid org.springframework.boot</groupid <artifactid spring boot starter data redis</artifactid </dependency <dependency <groupid org.apache.commons</groupid <artifactid commons pool2</artifactid </dependency <! swagger2 <dependency <groupid io.springfox</groupid <artifactid springfox swagger2</artifactid <version 2.9.2</version </dependency <dependency <groupid io.springfox</groupid <artifactid springfox swagger ui</artifactid <version 2.9.2</version </dependency 写yml yam server.port=7777 spring.application.name=redis7 study ===========================logging=========================== logging.level.root=info logging.1evel.com.luojia.redis7 study.redis7=info 1ogging.pattern.console=%d{yyyy mm dd hh:m:ss.sss} [%thread] % 5level %1ogger %msg%n 1ogging.file.name=f:\\workspace\\数据结构和算法\\learning in practice\\redis\\redis7 study 1ogging.pattern.fi1e=%d{yyyy mm dd hh:mm:ss.sss} [%thread] % 5level %logger %msg%n ===========================swagge=========================== spring.swagger2.enabled=true 在springboot2.6.x结合swagger2.9.x会提示documentationpluginsbootstrapper空指针异常， 原因是在springboot2.6.x中将springmvc默认路径匹配策略mantpathmatcher更改为athpatternparser, 导致出错，解决办法是matching strategy 切换回之前ant path matcher spring.mvc.pathmatch.matching strategy=ant path matcher ===========================redis单机=========================== spring.redis.database=0 修改为自己真实ip spring.redis.host=127.0.0.1 spring.redis.port=6379 spring.redis.password=123456 spring.redis.lettuce.pool.max active=8 spring.redis.1ettuce.pool.max wait= 1ms spring.redis.1ettuce.pool.max idle=8 spring.redis.lettuce.pool.min idle=0 主启动 业务类 配置类 java package com.luojia.redis7 study.config; import org.springframework.context.annotation.bean; import org.springframework.context.annotation.configuration; import org.springframework.data.redis.connection.lettuce.lettuceconnectionfactory; import org.springframework.data.redis.core.redistemplate; import "}, {"sid": "chapter-10-section-2", "ch": "11.SpringBoot集成Redis", "sec": "3.RedisTemplate连接集群", "t": "redistemplate连接集群 启动redis集群6台实例 第一次改写yml yaml ===========================redis集群=========================== spring.redis.password=123456 获取失败 最大重定向次数 spring.redis.cluster.max redirects=3 spring.redis.lettuce.pool.max active=8 spring.redis.1ettuce.pool.max wait= 1ms spring.redis.1ettuce.pool.max idle=8 spring.redis.lettuce.pool.min idle=0 spring.redis.cluster.nodes=192.168.111.175:6381,192.168.111.175:6382,192.168.111.176:6383,192.168.111.176:6384 直接通过微服务访问redis集群 一切正常 （http://localhost:7777/swagger ui.html） 问题来了 1. 人为模拟，master 6381机器意外宕机，手动shutdown 2. 先对redis集群用命令的方式，手动验证各种读写命令，看看6384是否上位 3. redis cluster集群能自动感知并自动完成主备切换，对应的slave6384会被选举为新的master节点 4. 通过redis客户端连接6384可以正常进行读写操作 5. 微服务客户端再次读写访问试试 故障现象 springboot客户端没有动态感知rediscluster的最新集群信息 金典故障 【故障演练】 redis cluster集群部署采用了3主3从拓扑结构，数据读写访问master节点，slave节点负责备份。当master宕机主从切换成功，redis手动ok，but 2个经典故障 导致原因 springboot 2.x版本，redis默认的连接池采用lettuce，当redis集群节点发生变化后，letture默认是不会刷新节点拓扑 解决方案 1. 排除lettuce采用jedis（不推荐） 2. 重写连接工厂实例（极度不推荐） 3. 刷新节点集群拓扑动态感应 解决方法： 调用 redisclusterclient.reloadpartitions 后台基于时间间隔的周期刷新 后台基于持续的 断开 和 移动 、 重定向 的自适应更新 ​ ​"}, {"sid": "chapter-11-section-0", "ch": "12.Redis高阶篇", "sec": "1.Redis单线程 VS 多线程(基础篇)/1.面试题", "t": "面试题 redis到底是单线程还是多线程？ io多路复用听说过吗？ redis为什么这么快？"}, {"sid": "chapter-11-section-1", "ch": "12.Redis高阶篇", "sec": "1.Redis单线程 VS 多线程(基础篇)/2.Redis为什么选择单线程", "t": "redis为什么选择单线程 是什么？ 这种问法其实并不严谨，为啥这么说呢？ tex redis的版本很多3.x、4.x、6.x，版本不同架构也是不同的，不限定版本问是否单线程也不太严谨。 1 版本3.x ，最早版本，也就是大家口口相传的redis是单线程。 2 版本4.x，严格意义来说也不是单线程，而是负责处理客户端请求的线程是单线程，但是开始加了点多线程的东西(异步删除)。 貌似 3 2020年5月版本的6.0.x后及2022年出的7.0版本后，告别了大家印象中的单线程，用一种全新的多线程来解决问题。 实锤 有几个里程碑式的重要版本 5.0版本是直接升级到6.0版本，对于这个激进的升级，redis之父antirez表现得很有信心和兴奋，所以第一时间发文来阐述6.0的一些重大功能”redis 6.0.0 ga is out!” 当然，redis7.0后版本更加厉害 why，为什么之前选择单线程 理清一个事实，通常说，redis是单线程究竟何意？ redis是单线程主要是指redis的网络io和键值对读写是由一个线程来完成的，redis在处理客户端的请求时包括获取(socket 读)、解析、执行、内容返回(socket 写) 等都由一个顺序串行的主线程处理，这就是所谓的“单线程”。这也是redis对外提供键值存储服务的主要流程。 但redis的其他功能，比如持久化rdb、aof、异步删除、集群数据同步等等，其实是由额外的线程执行的。redis \\\\命令工作线程是单线程的，但是，整个redis来说，是多线程的； 请说说演进变化情况 q：redis3.x单线程时代但是性能依旧很快的主要原因？ a： 基于内存操作: redis 的所有数据都存在内存中，因此所有的运算都是内存级别的，所以他的性能比较高； 数据结构简单:redis 的数据结构是专门设计的，而这些简单的数据结构的查找和操作的时间大部分复杂度都是 0(1)，因此性能比较高； 多路复用和非阻塞 i/o: redis使用 i/o多路复用功能来监听多个 socket连接客户端，这样就可以使用一个线程连接来处理多个请求，减少线程切换带来的开销，同时也避免了 i/o 阻塞操作； 避免上下文切换:因为是单线程模型，因此就避免了不必要的上下文切换和多线程竞争，这就省去了多线程切换带来的时间和性能上的消耗，而且单线程不会导致死锁问题的发生 作者原话使用单线程原因，官网证据 官网：https://redis.io/docs/getting started/faq/ 旧版本redis官网说明，说redis就是单线程 redis是单线程的。如何利用多个cpu /内核? cpu并不是您使用redis的瓶颈，因为通常redis要么受内存限制，要么受网络限制。例如，使用在平均linux系统上运行的流水线redis每秒可以发送一百万个请求，因此，如果您的应用程序主要使用o(n)或o(log(n) )命令，则几乎不会使用过多的cpu。 但是，为了最大程度地利用cpu，您可以在同一框中启动多个redis实例，并将它们视为不同的服务器。在某个时候，单个盒子可能还不够，因此，如果您要使用多个cpu，则可以开始考虑更早地进行分片的某种方法。您可以在“分区”页面中找到有关使用多个redis实例的更多信息。 但是，在redis 4.0中，我们开始使redis具有更多线程，目前，这仅限于在后台删除对象，以及阻正通过redis模块实现的命令。对于将来的版本，计划是使redis越来越线程化。 他的大体意思是说 redis 是基于内存操作的，因此他的瓶颈可能是机器的内存或者网络带宽而并非 cpu，既然 cpu 不是瓶颈，那么自然就采用单线程的解决方案了，况且使用多线程比较麻烦。但是在 redis 4.0 中开始支持多线程了，例如后台删除、备份等功能。 新版本redis官网原话，去掉了单线程的 redis4.0之前一直采用单线程的主要原因有以下三个 1. 使用单线程模型是 redis 的开发和维护更简单，因为单线程模型方便开发和调试; 2. 即使使用单线程模型也并发的处理多客户端的请求，主要使用的是io多路复用和非阻塞io； 3. 对于redis系统来说，主要的性能瓶颈是内存或者网络带宽而并非 cpu。"}, {"sid": "chapter-11-section-2", "ch": "12.Redis高阶篇", "sec": "1.Redis单线程 VS 多线程(基础篇)/3.为什么逐渐加入多线程特性", "t": "为什么逐渐加入多线程特性 单线程也有苦恼，举个例子 正常情况下使用 del 指令可以很快的删除数据，而当被删除的 key 是一个非常大的对象时，例如key包含了成千上万个元素的 hash 集合时，那么 del 指令就会造成 redis 主线程卡顿。 这就是redis3.x单线程时代最经典的故障，大key删除的头疼问题，由于redis是单线程的，del bigkey ..... 等待很久这个线程才会释放，类似加了一个synchronized锁，你可以想象高并发下，程序堵成什么样子? 如何解决 使用惰性删除可以有效的解决性能问题 案例 比如当我(redis)需要删除一个很大的数据时，因为是单线程原子命令操作，这就会导致 redis 服务卡顿，于是在 redis 4.0 中就新增了多线程的模块，当然此版本中的多线程主要是为了解决删除数据效率比较低的问题的。 | unlink key | | | | flushdb async | | flushall async | | 把删除工作交给了后台的子线程异步删除数据了 | 因为redis是单个主线程处理，redis之父antirez一直强调\"lazy redis is better redis\"。 而lazy free的本质就是把某些cost(主要时间复杂度，占用主线程cpu时间片)较高删除操作，从redis主线程剥离让bio子线程来处理，极大地减少主线阻塞时间。从而减少删除导致性能和稳定性问题。 在redis4.0就引入了多个线程来实现数据的异步惰性删除等功能但是其处理读写请求的仍然只有一个线程，所以仍然算是狭义上的单线程。"}, {"sid": "chapter-11-section-3", "ch": "12.Redis高阶篇", "sec": "1.Redis单线程 VS 多线程(基础篇)/4.redis6、7的多线程特性和IO多路复用入门", "t": "redis6/7的多线程特性和io多路复用入门 对于redis主要的性能瓶颈是内存或者网络带宽而并非 cpu。 所以redis的瓶颈可以初步定为：网络io redis6/7，真正的多线程登场 在redis6/7中，非常受关注的第一个新特性就是多线程。 这是因为，redis一直被大家熟知的就是它的单线程架构，虽然有些命令操作可以用后台线程或子进程执行(比如数据删除、快照生成、aof重写)但是，从网络io处理到实际的读写命令处理，都是由单个线程完成的。 随着网络硬件的性能提升，redis的性能瓶颈有时会出现在网络io的处理上，也就是说，单个主线程处理网络请求的速度跟不上底层网络硬件的速度 为了应对这个问题: 采用多个io线程来处理网络请求，提高网络请求处理的并行度，redis6/7就是采用的这种方法。 但是，redis的多io线程只是用来处理网络请求的， 对于读写操作命今redis仍然使用单线程来处理 。这是因为，redis处理请求时，网络处理经常是瓶颈，通过多个io线程并行处理网络操作，可以提升实例的整体处理性能。而继续使用单线程执行命今换作，就不用为了保证lua脚本、事各的原子性，额外开发多线程互斥加锁机制了(不管加锁操作处理)，这样一来，redis线程模型实现就简单了 主线程和io线程怎么协作完成请求处理的 <font color = red 精讲版</font 四个阶段： unix网络编程中的五种io模型 blocking io 阻塞io noneblocking io 非阻塞io <font color = red io multiplexing io 多路复用 </font linux世界一切皆是文件 文件描述符，简称fd，句柄 filedescriptor：文件描述符 (file descriptor)是计算机科学中的一个术语，是一个用于表述指向文件的引用的抽象化概念。文件描述符在形式上是一个非负整数。实际上，它是一个索引值，指向内核为每一个进程所维护的该进程打开文件的记录表。当程序打开一个现有文件或者创建一个新文件时，内核向进程返回一个文件描述符。在程序设计中，文件描述符这一概念往往只适用于unix、linux这样的操作系统。 <font color = red 首次浅谈io多路复用</font ，io多路复用是什么 一种同步的io模型，实现<font color = red 一个线程</font 监视<font color = green 多个文件句柄,一旦某个文件句柄就绪</font 就能够通知到对应应用程序进行相应的读写操作，<font color = red 没有文件句柄就绪时</font 就会阻塞应用程序从而释放cpu资源 概念： l/o：网络i/o，尤其在操作系统层面指数据在内核态和用户态之间的读写操作 多路：多个客户端连接(连接就是套接字描述符，即 socket 或者 channel) 复用：复用一个或几个线程 lo多路复用：也就是说一个或一组线程处理多个tcp连接，使用单进程就能够实现同时处理多个客户端的连接，<font color = red 无需创建或者维护过多的进程/线程</font 一句话：一个服务端进程可以同时处理多个套接字描述符。 实现io多路复用的模型有3种: 可以分select poll epoll三个阶段来描述。​ signal driven io 信号驱动io asynchronous io 异步io <font color = red 场景体验，说人话引出epoll</font 场景解析 模拟一个tcp服务器处理30个客户socket。 假设你是一个监考老师，让30个学生解答一道竞赛考题，然后负责验收学生答卷，你有下面几个选择: <font color = blue 第一种选择(轮询)</font ：按顺序逐个验收，先验收a，然后是b，之后是c、d。。。这中间如果有一个学生卡住，全班都会被耽误,你用循环挨个处理socket，根本不具有并发能力。 <font color = blue 第二种选择(来一个new一个，1对1服)</font ：你创律30个分身线程，每个分身线程检查一个学生的答案是否正确。这种类似于为每一个用户创建一个进程或者线程处理连接。 <font color = blue 第三种选择(响应式处理，1对多服务)</font ：你站在讲台上等，谁解答完谁举手。这时c、d举手，表示他们解答问题完毕，你下去依次检查c、d的答案然后继续回到讲台上等] 此时e、a又举手，然后去处理e和a。。。这种就是io复用模型。 linux下的select、poll和epoll就是干这个的。 io多路复用模型，简单明了版理解 将用户socket对应的文件描述符(filedescripto"}, {"sid": "chapter-11-section-4", "ch": "12.Redis高阶篇", "sec": "1.Redis单线程 VS 多线程(基础篇)/5.Redis7多线程", "t": "redis7是否开启了多线程 如果你在实际应用中，发现redis实例的<font color = red cpu开销不大但吞吐量却没有提升</font ，可以考虑使用redis7的多线程机制，加速网络处理，进而提升实例的吞吐量 text redis7将所有数据放在内存中，内存的响应时长大约为100纳秒，对于小数据包，redis服务器可以处理8w到10w的qps。 这也是redis处理的极限了，对于80%的公司来说，单线程的redis已经足够使用了。 1. 设置io thread do reads配置项为yes，表示启动多线程。 2. 设置线程个数。关于线程数的设置，官方的建议是如果为4核的cpu，建议线程数设置为2或3，如果为8核cpu建议线程数设置为6，安程数一定要小于机器核数，线程数并不是越大越好。 总结： redis自身出道就是优秀，基于内存操作、数据结构简单、多路复用和非阻塞i/o、避免了不必要的线程上下文切换等特性，在单线程的环境下依然很快； 但对于大数据的 key删除还是卡顿厉害，因此在redis 4.0引入了多线程unlink key/flushall async等命令，主要用于redis 数捷的异步删除； 而在redis6/7中引入了i/0多线程的读写，这样就可以更加高效的处理更多的任务了，<font color = blue redis只是将i/o读写变成了多线程，而命令的执行依旧是由主线程串行执行的</font ，因此在多线程下操作 redis不会出现线程安全的问题。 <font color = red redis无论是当初的单线程设计，还是如今与当初设计相背的多线程，目的只有一个:让 redis变得越来越快。</font"}, {"sid": "chapter-11-section-5", "ch": "12.Redis高阶篇", "sec": "2.BigKey/1.面试题", "t": "面试题 阿里广告平台，海量数据里查询某一个固定前缀的key 小红书，你如何生产上限制 keys /flushdb/flushall等危险命令以防止阻塞或误删数据？ 美团，memory usage命令你用过吗？ bigkey问题，多大算big？你如何发现？如何删除？如何处理？ bigkey你做过调优吗？惰性释放lazyfree了解过吗？ morekey问题，生产上redis数据库有1000w记录，你如何遍历数据？ keys 可以吗？"}, {"sid": "chapter-11-section-6", "ch": "12.Redis高阶篇", "sec": "2.BigKey/2.MoreKey案例", "t": "morekey案例 大批量往redis里面插入2000w测试数据key linux bash下面执行，插入100w数据 ​ 生成100w条redis批量设置kv的语句(key=kn,value=vn)写入到/tmp目录下的redistest.txt文件中 shell for((i=1;i<=100 10000;i++)); do echo \"set ksi v$i\" /tmp/redistest.txt ;done; ​ 通过redis提供的管道 pipe命令插入100w大批量数据 shell cat /tmp/redistest.txt | /opt/redis 7.0.0/src/redis cli h 127.0.0.1 p 6379 a 111111 pipe 某快递巨头真实生产案例新闻 新闻 keys 试试100w花费多少秒遍历查询 <font color = blue keys 这个指令有致命的弊端，在实际环境中最好不要使用</font tex 这个指令没有offset、limit 参数，是要一次性吐出所有满足条件的key，由于redis,是单线程的，其所有操作都是原子的，而keys算法是遍历算法，复杂度是o(n)，如果实例中有千万级以上的 key，这个指令就会导致redis服务卡顿，所有读写redis 的其它的指令都会被延后甚至会超时报错，可能会引起缓存雪崩甚至数据库宕机。 <font color = red 生产上限制 keys /flushdb/flushall等危险命令以防止误删误用？</font 通过配置设置禁用这些命令，redis.conf在security这一项中 不用keys 避免卡顿，那该用什么 scan命令登场 https://redis.io/commands/scan/ https://redis.com.cn/commands/scan.html 一句话，类似mysql limit， 但是不完全相同 scan命令用于迭代数据库中的数据库键 语法 特点 scan命令是一个基于游标的迭代器，每次被调用之后，都会向用户返回一个新的游标，<font color = red 用户在下次迭代时需要使用这个新游标作为scan命令的游标参数</font ，以此来延续之前的迭代过程。 scan返回一个包含<font color = blue 两个元素的数组</font ， 第一个元素是用于进行下一次迭代的新游标， 第二个元素则是一个数组，这个数组中包含了所有被迭代的元素。<font color = red 如果新游标返回零表示迭代已结束。</font scan的遍历顺序 <font color = red 非常特别，它不是从第一维数组的第零位一直遍历到末尾，而是采用了高位进位加法来遍历。之所以使用这样特殊的方式进行遍历，是考虑到字典的扩容和缩容时避免槽位的遍历重复和遗漏。</font 使用"}, {"sid": "chapter-11-section-7", "ch": "12.Redis高阶篇", "sec": "2.BigKey/3.BigKey之多大算Big", "t": "多大算bigkey 通常我们说的bigkey，不是在值的key很大，而是指的key对应的value很大 参考《阿里云redis开发规范》 string和二级结构 string是value，最大512mb但是≥10kb就是bigkey list、hash、set和zset，value个数超过5000就是bigkey list：一个列表最多可以包含2^32 1个元素(4294967295，每个列表超过40亿个元素)。 hash：redis中每个hash可以存储2^32 1个键值对(40多亿) set：集合中最大的成员数为2^32 1(4294967295，每个集合可存储40多亿个成员)"}, {"sid": "chapter-11-section-8", "ch": "12.Redis高阶篇", "sec": "2.BigKey/4.Bigkey危害、产生与发现", "t": "bigkey危害、产生与发现 bigkey的危害 内存不均，集群迁移困难 超时删除，大key删除作梗 网络流量阻塞 如何产生 社交类 明星粉丝列表，典型案例粉丝逐步递增 汇总统计 某个报表，日月年经年累计 如何发现 redis cli bigkey <font color = blue 好处，见最下面总结</font 给出每种数据结构top 1 bigkey。同时给出每种数据类型的键值个数＋平均大小 <font color = blue 不足</font 想查询大于10kb的所有key， bigkeys参数就无能为力了，<font color = red 需要用到memory usage来计算每个键值的字节数</font <font color = red redis cli bigkeys a 111111</font <font color = red redis cli h 127.0.0.1 p 6379 a 111111 bigkeys</font java 加上 i 参数，每隔100 条 scan指令就会休眠0.1s.ops就不会剧烈抬升，但是扫描的时间会变长 redis cli h 127.0.0.1 p 7001 bigkeys i 0.1 memory usage 键 英文官网：https://redis.io/commands/memory usage/ 中文官网：https://redis.io/commands/memory usage/ 计算每个键值的字节数"}, {"sid": "chapter-11-section-9", "ch": "12.Redis高阶篇", "sec": "2.BigKey/5.BigKey如何删除", "t": "大key如何删除 参考《阿里云redis开发规范》 scan官网说明 https://redis.io/commands/scan/ https://redis.com.cn/commands/scan.html 普通命令 string 一般用del，如果过于庞大使用unlink key 删除 hash 使用hscan每次获取少量field value，再使用hdel删除每个field 命令 阿里手册 list 使用ltrim渐进式逐步删除，直到全部删除完成 命令 阿里手册 set 使用sscan每次获取部分元素，在使用srem命令删除每个元素 命令 阿里手册 zset 使用zscan每次获取部分元素，在使用zremrangebyrank命令删除每个元素 命令 阿里手册"}, {"sid": "chapter-11-section-10", "ch": "12.Redis高阶篇", "sec": "2.BigKey/6.BigKey生产调优", "t": "bigkey生产调优 1. redis.conf配置文件 lazy freeing相关说明 2. 阻塞和非阻塞删除命令 3. 优化配置"}, {"sid": "chapter-11-section-11", "ch": "12.Redis高阶篇", "sec": "3.缓存双写一致性更新策略探讨/1.面试题", "t": "面试题 你只要用缓存，就可能涉及到redis缓存与数据库双存储双写，你只要是双写，就一定会有数据一致性的问题，那么你如何解决一致性问题？ 双写一致性，你先动缓存redis还是数据库mysql哪一个？why？ <font color = red 延时删除</font 你做过吗？会有哪些问题？ 有这么一种情况，微服务查询redis无 mysql有，为保证数据双写一致性回写redis你需要注意什么？<font color = red 双检加锁</font 策略你了解过吗？如何尽量避免缓存击穿？ redis和mysql双写100%会出纰漏，做不到强一致性，你如何保证<font color = red 最终一致性？</font"}, {"sid": "chapter-11-section-12", "ch": "12.Redis高阶篇", "sec": "3.缓存双写一致性更新策略探讨/2.缓存双写一致性的理解", "t": "缓存双写一致性的理解 如果redis中<font color = 'red' 有数据</font ​ 需要和数据库中的值相同 如果redis中<font color = 'red' 无数据</font ​ 数据库中的值要是最新值，且准备回写redis 缓存按照操作来分，细分2种 只读缓存 读写缓存 同步直写策略 写数据库之后也同步写redis缓存，缓存和数据库中的数据一致； 对于读写缓存来说，要想保证缓存和数据库中的数据一致，就要采用同步直写策略 异步缓写策略 正常业务中，mysql数据变了，但是可以在业务上容许出现一定时间后才作用于redis，比如仓库、物流系统 异常情况出现了， 不得不将失败的动作重新修补，有可能需要借助kafka或者rabbitmq等消息中间件，实现重试重写 <font color = red 采用双检加锁策略</font 多个线程同时去查询数据库的这条数据，那么我们可以在第一个查询数据的请求上使用一个互斥锁来锁住它。其他的线程走到这一步拿不到锁就等着，等第一个线程查询到了数据，然后做缓存。 后面的线程进来发现已经有缓存了，就直接走缓存。"}, {"sid": "chapter-11-section-13", "ch": "12.Redis高阶篇", "sec": "3.缓存双写一致性更新策略探讨/3.数据库和缓存一致性的几种更新策略", "t": "数据库和缓存一致性的几种更新策略 目的：总之，我们要达到最终一致性 <font color = blue 给缓存设置过期时间，定期清理缓存并回写，是保证最终一致性的解决方案。</font 我们可以对存入缓存的数据设置过期时间，所有的<font color = gree 写操作以数据库为准</font ，对缓存操作只是尽最大努力即可。也就是说如果数据库写成功，缓存更新失败，那么只要到达过期时间，则后面的读请求自然会从数据库中读取新值然后回填缓存，达到一致性，<font color = gree 切记，要以mysql的数据库写入库为准</font 。 上述方案和后续落地案例是调研后的主流＋成熟的做法，但是考虑到各个公司业务系统的差距，<font color = red 不是100%绝对正确，不保证绝对适配全部情况</font ，需要自己酌情选择打法，合适自己的最好。 <font color = green 可以停机的情况</font 挂牌报错，凌晨升级，温馨提示，服务降级 单线程，这样重量级的数据操作最好不要多线程 <font color = green 我们讨论4种更新策略</font 1. <font color = red size = 6 × </font 先更新数据库，在更新缓存 异常问题1 text 1 先更新mysql的某商品的库存，当前商品的库存是100，更新为99个。 2 先更新mysql修改为99成功，然后更新redis。 3 此时假设异常出现，更新redis失败了，这导致mysql里面的库存是99而redis里面的还是100。 4 上述发生，会让数据库里面和缓存redis里面数据不一致，读到redis脏数据 异常问题2 text 【先更新数据库，再更新缓存】﹐a、b两个线程发起调用 【正常逻辑】 1 a update mysql 100 2 a update redis 100 3 b update mysql 80 4 b update redis 80 ============================= 【异常逻辑】 多线程环境下，a、b两个线程有快有慢，有前有后有并行 1 a update mysql 100 3 b update mysql 80 4 b update redis 80 2 a update redis 100 ============================= 最终结果，mysql和lredis数据不一致，o(t t)o， mysql80,redis100 2. <font color = red size = 6 × </font 先更新缓存，再更新数据库 <font color = red size = 6 × </font 不推荐，业务上一般把mysql作为<font color = red 底单数据库 </font ，保证最后解释 text [先更新缓存，再更新数据库]，a、b两个线程发起调用 [正常逻辑] 1 a update redis 100 2 a update mysql 100 3 b update redis 80 4 b update mysql 80 ==================================== [异常逻辑]多线程环境下，a. b两个线程有快有慢有并行 a update redis 100 b update redis 80 b update mysq| 80 a update mysql 100 mysql100,redis80 3. <font color = red size = 6 × </font 先删除缓存，在更新数据库 异常问题： 步骤分析，先删除缓存，再更新数据库 text 1 a线程先成功删除了redis里面的数据，然后去更新mysql,此时mysql正在更新中，还没有结束。(比如网络延时) b突然出现要来读取缓存数据。 2 此时redis里面的数据是空的，b线程来读取，先去读redis里数据(已经被a线程delete掉了)，此处出来2个问题: 2.1 b从mysq|获得了旧值 b线程发现redis里没有(缓存缺失)马上去mysql里面读取，从数据库里面读取来的是旧值。 2.2 b会把获得的旧值写回redis 获得旧值数据后返回前台并回写进redis(刚被a线程删除的旧数据有极大可能早被写回了)。 3 a线程更新完mysql,发现redis里面的缓存是脏数据，a线程直接懵逼了，o(t .τ)o 两个并发操作，一个是更新操作，另一个是查询操作，a删除缓存后，b查询操作没有命中缓存，b先把老数据读出来后放到缓存中，然后a更新操作更新了数据库。 于是，在缓存中的数据还是老的数据，导致缓存中的数据是脏的，"}, {"sid": "chapter-11-section-14", "ch": "12.Redis高阶篇", "sec": "4.Redis和MySQL数据双写工程落地/1.canal介绍", "t": "复习+面试 canal介绍 是什么 官网地址：https://github.com/alibaba/canal/wiki canal [ka'nael]，中文翻译为水道/管道/沟渠/运河，主要用途是于mysql数据库增量日志数据的订阅、消费和解析，是阿里巴巴开发并开源的，采用java语言开发; 历史背景是早期阿里巴巴因为杭州和美国双机房部署，存在跨机房数据同步的业务需求，实现方式主要是基于业务trigger (触发器)获取增量变更。从2010年开始，阿里巴巴逐步尝试采用解析数据库日志获取增量变更进行同步，由此衍生出了canal项目; 能干嘛 基于日志增量订阅和消费的业务包括 数据库镜像 数据库实时备份 索引构建和实时维护(拆分异构索引、倒排索引等) 业务 cache 刷新 带业务逻辑的增量数据处理 去哪下 下载地址：https://github.com/alibaba/canal/releases/tag/canal 1.1.6"}, {"sid": "chapter-11-section-15", "ch": "12.Redis高阶篇", "sec": "4.Redis和MySQL数据双写工程落地/2.canal工作原理", "t": "工作原理，面试回答 传统的mysql主从复制工作原理 mysql的主从复制将经过如下步骤: 1、当master主服务器上的数据发生改变时，则将其改变写入二进制事件日志文件中； 2、salve 从服务器会在一定时间间隔内对master主服务器上的二进制日志进行探测，探测其是否发生过改变； 如果探测到master主服务器的二进制事件日志发生了改变,则开始一个i/o thread请求master二进制事件日志； 3、同时master主服务器为每个i/0 thread启动一个dump thread, 用于向其发送二进制事件日志； 4、slave 从服务器将接收到的二进制事件日志保存至自己本地的中继日志文件中； 5、salve 从服务器将启动sql thread从中继日志中读取二进制日志，在本地重放，使得其数据和主服务器保持一致； 6、后i/o thread和sql thread将进入睡眠状态，等待下一次被唤醒。 canal工作原理 工作原理 canal 模拟mysql slave的交互协议，伪装自己为mysql slave，向mysql master发送dump协议 mysql master收到dump请求，开始推送binary log给slave (即canal )canal 解析binary log对象(原始为byte流)"}, {"sid": "chapter-11-section-16", "ch": "12.Redis高阶篇", "sec": "4.Redis和MySQL数据双写工程落地/3.双写一致性coding-MySQL", "t": "双写一致性 mysql java案例，来源出处 https://github.com/alibaba/canal/wiki/clientexample 查看mysql版本 select version(); // 5.7.17 当前的主机二进制日志 show master status; 查看 show variables like 'log bin'; 默认未开启 开启mysql的binlog写入功能 修改配置文件，win环境下修改my.ini文件 ini log bin=mysql bin binlog format=row server id=1 重启mysql 再次查看 show variables like 'log bin'; 授权canal链接mysql账号 mysql默认的用户在mysql库的user表里面 默认没有canal账户，此处新建+授权 sql drop user if exists 'canal'@'%' ; create user 'canal'@'%' identified by 'canal' ; grant all privileges on . to 'canal'@'%' identified by 'canal' ; flush privileges; select from mysql .user;"}, {"sid": "chapter-11-section-17", "ch": "12.Redis高阶篇", "sec": "4.Redis和MySQL数据双写工程落地/4.双写一致性coding-canal服务端", "t": "canal服务端 下载 官网地址：https://github.com/alibaba/canal/releases/tag/canal 1.1.6 解压 解压后整体放入到/mycanal路径下 配置 修改 /mycanal/conf/example路径下instance.properties文件 <font color = 'red' 换成自己的mysql主机master的ip地址</font 换成自己的在mysql新建的canal账户 启动 在/mycanal/bin路径下执行 ./startup.sh 查看 判断canal是否启动成功 查看server日志 查看样例 example的日志"}, {"sid": "chapter-11-section-18", "ch": "12.Redis高阶篇", "sec": "4.Redis和MySQL数据双写工程落地/5.双写一致性 coding-canal客户端", "t": "双写一致性 coding canal客户端(java编写业务程序) sql脚本 选中一个库，执行下面建表语句 sql create table t user ( id bigint(20)not null auto increment, username varchar(100)not null, primary key ( id ) )engine=innodb auto increment=10 default charset=utf8mb4 建module 改pom xml <?xml version=\"1.0\" encoding=\"utf 8\"? <project xmlns=\"http://maven.apache.org/pom/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/xmlschema instance\" xsi:schemalocation=\"http://maven.apache.org/pom/4.0.0 https://maven.apache.org/xsd/maven 4.0.0.xsd\" <modelversion 4.0.0</modelversion <parent <groupid org.springframework.boot</groupid <artifactid spring boot starter parent</artifactid <version 2.5.14</version <relativepath/ <! lookup parent from repository </parent <groupid com.luojia</groupid <artifactid canaldemo</artifactid <version 0.0.1 snapshot</version <name canaldemo</name <description demo project for spring boot</description <properties <project.build.sourceencoding utf 8</project.build.sourceencoding <maven.compiler.source 1.8</maven.compiler.source <maven.compiler.target 1.8</maven.compiler.target <junit.version 4.12</junit.version <log4j.version 1.2.17</log4j.version <lombok.version 1.16.18</lombok.version <mysql.version 5.1.47</mysql.version <druid.version 1.1.16</druid.version <mapper.version 4.1.5</mapper.version <mybatis.spring.boot.version 1.3.0</mybatis.spring.boot.version </properties <dependencies <! canal <dependency <groupid com.alibaba.otter</groupid <artifactid canal.client</artifactid <version 1.1.0</version </dependency <! springboot 通用依赖模块 <dependency <groupid org.springframework.boot</groupid <artifactid spring boot starter web</artifactid </dependency <dependency <groupid org.springframework.boot</groupid <artifactid spring boot starter actuator</artifactid </dependency <dependency <groupid org.springframework.boot</groupid <artifactid spring boot starter data redis</artifactid </dependency <dependency <groupid org.apache.commons</groupid <artifactid commons pool2</artifactid </dependency <! springboot 与 ao"}, {"sid": "chapter-11-section-19", "ch": "12.Redis高阶篇", "sec": "5.案例落地实战bitmap、hyperloglog、GEO/1.面试题", "t": "面试题 1. 抖音电商直播，主播介绍的商品有评论，1个商品对应了一系列的评论，排序+展现+取前10条记录 2. 用户在手机app上的签到打卡信息：1天对应一系列用户的签到记录，新浪微博、钉钉打卡签到，来没来如何统计 3. 应用网站上的网页访问信息：一个网页对应一系列的访问点击，淘宝网首页，每天有多少人浏览首页 4. 公司系统上线后，说一下uv、pv、dau分别是多少？ <font color = 'red' 记录对集合中的数据进行统计</font 在移动应用中，需要统计每天的新增用户数和第2天的留存用户数； 在电商网站的商品评论中，需要统计评论列表中的最新评论； 在签到打卡中，需要统计一个月内连续打卡的用户数； <font color = 'blue' 在网页访问记录中，需要统计独立访客（unique visitor. uv）量。</font 痛点： 类似今日头条、抖音、淘宝这样的额用户访问级别都是亿级的，请问如何处理? <font color = 'red' 需求痛点</font 亿级数据的收集+清洗+统计+展现 一句话：存的进+去得快+多维度展现 真正有价值的是统计"}, {"sid": "chapter-11-section-20", "ch": "12.Redis高阶篇", "sec": "5.案例落地实战bitmap、hyperloglog、GEO/2.统计的类型有哪些", "t": "统计的类型 亿级系统中，常见的四种统计 聚合统计 统计多个集合元素的聚合结果，就是前面讲解过的<font color='red' 交差并等集合统计</font 复习命令 交差并集和聚合函数的应用 排序统计 抖音短视频最新评论留言的场景，请你设计一个展现列表。（考察数据结构和设计思路） 设计案例和回答思路： <font color='blue' 以抖音vcr最新的留言评价为案例，所有评论需要两个功能，按照时间排序(正序、反序)+分页显示能够排序+分页显示的redis数据结构是什么合适?</font zset 在面对需要展示最新列表、排行榜等场景时，如果数据更新频繁或者需要分页显示，建议使用zset 二值统计 集合元素的取值就只有0和1两种。在钉钉上签到打卡的场景中，我们只用记录有签到(1)或没有签单(0) 见bitmap 基数统计 指统计一个集合中<font color='red' 不重复的元素个数</font 见hyperloglog"}, {"sid": "chapter-11-section-21", "ch": "12.Redis高阶篇", "sec": "5.案例落地实战bitmap、hyperloglog、GEO/3.HyperLogLog", "t": "hyperloglog 名词、行话谈资 什么是uv unique visitor，独立访客，一般理解为客户端ip <font color='red' 需要去重考虑</font 什么是pv page view，页面浏览量 不用去重 什么是dau daily active user，日活跃量用户，<font color='red' 登录或者使用了某个产品的用户数（去重复登录的用户）</font 常用于反映网站、互联网应用或者网络游戏的运营情况 什么是mau monthly active user，月活跃用户量 <font color='red' 看需求</font 很多计数类场景，比如每日注册ip数、每日访问ip数、页面实时访问数pv、访问用户数uv等。 因为主要的目标高效、巨量地进行计数，所以对存储的数据的内容并不太关心。也就是说它只能用于统计巨量数量，不太涉及具体的统计对象的内容和精准性。 统计单日一个页面的访问量(pv)，单次访问就算一次。 统计单日一个页面的用户访问量(uv)，即按照用户为维度计算，单个用户一天内多次访问也只算一次。 多个key的合并统计，某个门户网站的所有模块的pv聚合统计就是整个网站的总pv。 是什么(基础篇写过) 基数：是一种数据集，去重复后的真实个数 案例 取重复统计功能的基数估算算法 就是hyperloglog 基数统计 用于统计一个集合中不重复的元素个数，就是对集合去重复后剩余元素的计算 一句话：脱水后的真实数据 hyperloglog如何做的，如何演化出来的？ 基数统计就是hyperloglog 去重复统计你先会想到哪些方式？ hashset bitmap 如果数据是较大亿级统计,使用bitmaps同样会有这个问题。 bitmap是通过用位bit数组来表示各元素是否出现，每个元素对应一位，所需的总内存为n个bit。 基数计数则将每一个元素对应到bit数组中的其中一位，比如bit数组010010101(按照从零开始下标，有的就是1、4、6、8)。新进入的元素只需要将已经有的bit数组和新加入的元素进行按位或计算就行。这个方式能大大减少内存占用且位操作迅速。 but，假设一个样本案例就是一亿个基数位值数据，一个样本就是一亿 如果要统计1亿个数据的基数位值，<font color='red' 大约需要内存100000000/8/1024/1024约等于12m,内存减少占用的效果显著。这样得到统计一个对象样本的基数值需要12m</font 。 如果统计1000个对象样本(1w个亿级),就需要117.1875g将近120g，可见使用bitmaps还是不适用大数据量下(亿级)的基数计数场景，<font color='red' 但是bitmaps方法是精确计算的。</font 结论 样本元素越多内存消耗急剧增大，难以管控+各种慢，对于亿级统计不太合适，量变引起质变 办法 概率算法： <font color='red' 通过牺牲准确率来换取空间</font ，对于不要求<font color='blue' 绝对准确率</font 的场景下可以使用，因为<font color='red' 概率算法不直接存储数据本身</font ，通过一定的概率统计方法预估基数值，同时保证误差在一定范围内，由于又不储存数据故此可以大大节约内存. <font color='red' hyperloglog就是一种概率算法的实现。</font 原理说明 <font color='red' 只是进行不重复的基数统计，不是集合也不保存数据，只记录数量而不是具体内容</font 有误差 hyperloglog提供不精确的去重计数方案 <font color='red' 只牺牲准确率来换取空间，误差仅仅只是0.81%左右</font 这个误差率如何来的？ http://antirez.com/news/75 redis之父安特雷兹回答："}, {"sid": "chapter-11-section-22", "ch": "12.Redis高阶篇", "sec": "5.案例落地实战bitmap、hyperloglog、GEO/4.首页亿级UV的Redis设计方案", "t": "首页亿级uv的redis设计方案 需求 uv的统计需要去重，一个用户一天内的多次访问只能算作一次 淘宝、天猫首页的uv，平均每天是1~1.5个亿 每天存1.5个亿的ip，访问者来了后先去查是否存在，不存在就加入 方案讨论 用mysql，一个亿的数据，扛不住啊。。。高并发下，3000万的数据就需要分库分表了 用redis的hash结构存储 redis——hash = <keyday,<ip,1 按照ipv4的结构来说明，每个ipv4的地址最多是15个字节(ip = \"192.168.111.1\"，最多xxx.xxx.xxx.xxx) 某一天的1.5亿 15个字节=2g，一个月60g， redis死定了。太占内存了 hyperloglog"}, {"sid": "chapter-11-section-23", "ch": "12.Redis高阶篇", "sec": "5.案例落地实战bitmap、hyperloglog、GEO/5.GEO", "t": "geo redis之geo 面试题简介 命令复习 geoadd 添加经纬度
