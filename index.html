坐标 geopos返回经纬度 geohash返回坐标的geohash表示 geohash算法生成的base32编码值，3维变2维变1维 geodist两个位置之间的距离 georadius 以半径为中心，查找附近的xxx georadiusbymembe"}, {"sid": "chapter-11-section-24", "ch": "12.Redis高阶篇", "sec": "5.案例落地实战bitmap、hyperloglog、GEO/6.附近酒店推送设计", "t": "附近酒店的推送 需求分析 推送当前位置，指定范围内的酒店信息 架构设计 redis的新类型geo http://www.redis.cn/commands/geoadd.html 编码实现 关键点：georadius，以给定的经纬度为中心，找出某一半径内的元素 java public string geoadd() { map<string，point map = new hashmap< (); map.put(\"天安门\", new point( x: 116.403963, y: 39.915119)); map.put(\"故宫\", new point( x: 116.403414, y: 39.924091)); map.put(\"长城\", new point( x: 116.024067, y: 40.362639)); redistemplate.opsforgeo().add(city,map); return map.tostring(); } public point position(string member){ // 获取经纬度坐标,这里的member可以有多个，返回的list也可以有多个 list<point list = redistemplate.opsforgeo().position(city, member); return list.get(0); } public string hash(string member) { //geohash算法生成的base32编码值,这里的member可以有多个，返回的list也可以有多个 list<string list = redistemplate.opsforgeo().hash(city,member); return list.get(o); } public distance distance( string member1，string member2) { //获取两个给定位置之间的距离 distance distance = redistemplate.opsforgeo().distance(city,member1,member2,redisgeocommands.distanceunit.kilometers); return distance; } public georesults radiusbyxy() { //通过经度，纬度查找附近的，北京王府井位置116.418017, 39.914402 circle circle = new circle(116. 418017, 39 .914402, metrics . kilometers . getmultiplier()); //返@50条: redisgeocommands.georadiuscommandargs args = redisgeocommands.georadiuscommandargs.newgeoradiusargs().includedistance().includecoordinates().sortascending().limit(50); georesults<redisgeocommands.geolocation<string georesults= this.redistemplate.opsforgeo().radius(city, circle, args); return georesults; } public georesults radiusbymember() { //通过地方查找附近 string member=\"天安门\"; //返回50条 redisgeocommands.georadiuscommandargs args = redisgeocommands.georadiuscommandargs.newgeoradiusargs().includedistance().includecoordinates( ).sortascending().limit(5e) ; //半径10公里内 distance distance=new distance(10，metrics.kilometers); georesults<redisbeocommands.geolocation<string georesults= this.redistemplate.opsforbeol().radius(city,member,distance,angs); return georesults; }"}, {"sid": "chapter-11-section-25", "ch": "12.Redis高阶篇", "sec": "5.案例落地实战bitmap、hyperloglog、GEO/7.Bitmap", "t": "bitmap 大厂真实案例 日活统计 连续签到打卡 最近一周的活跃用户 统计指定用户一年之中的登录天数 某用户按照一年365天，哪几天登陆过，哪几天没有登录？ 是什么 由0和1状态表现的二进制位的bit数组 能干嘛 用于状态统计，y、n类似atomicboolean <font color='red' 看需求：</font 用户是否登录过y、n，比如京东每日签到送京豆 电影、广告是否被点击播放过 钉钉打卡上下班，签到统计 京东签到领取京豆 需求说明 tex 签到日历仅展示当月签到数据 签到日历需展示最近连续签到天数 假设当前日期是20210618，且20210616未签到 若20210617已签到且0618未签到，则连续签到天数为1 若20210617已签到且0618已签到，则连续签到天数为2 连续签到天数越多，奖励越大 所有用户均可签到 截至2020年3月31日的12个月，京东年度活跃用户数3.87亿，同比增长24.8%，环比增长超2500万，此外，2020年3月移动端日均活跃用户数同比增长46%假设10%左右的用户参与签到，签到用户也高达3千万。。。 小厂方法，传统mysql方式 建表语句 sql create table user sign keyid bigint not null primary key auto increment, user key varchar(200), 京东用户id sign date datetime, 签到日期(20220618) sign count int 连续签到天数 insert into user sign(user key,sign date,sign count) values ('28216618 xxxx xxxx xxxx xxxxxxxxxxxx','2022 06 18 15:11:12',1); select sign count from user sign where user key =20216618 xxxx xxxx xxxx xxxxxxxxxxxx and sign date between '2020 06 17 00:00:00' and '2020 06 18 23:59:59' order by sign date desc limit 1; 困难和解决思路 方法正确但是难以落地实现。 签到用户量较小时这么设计能行，但京东这个体量的用户(估算3000w签到用户，一天一条数据，一个月就是9亿数据)对于京东这样的体量，如果一条签到记录对应着当日签到记录，那会很恐怖...... <font color='red' 如何解决这个痛点?</font 1. 一条签到记录对应一条记录，会占据越来越大的空间。 2. 一个月最多31天，刚好我们的int类型是32位，那这样一个int类型就可以搞定一个月，32位大于31天，当天来了就是1没来就是0。 3. 一条数据直接存储一个月的签到记录，不再是存储一天的签到记录。 大厂方法，基于redis的bitmap实现签到日历 建表 按位 redis bitmap 在签到统计时，每个用户一天的签到用1个bit位就能表示 一个月(假设是31天)的签到情况用31个bit位就可以，一年的签到也只需要用365个bit位，根本不用太复杂的集合类型 命令复习 具体使用见基础篇 案例结合bitmap类型签到+结合布隆过滤器实现"}, {"sid": "chapter-11-section-26", "ch": "12.Redis高阶篇", "sec": "6.布隆过滤器BloomFilter/1.面试题", "t": "面试总结 现有50亿个电话号码，给你10万个电话号码，如何要快速准确的判断这些电话号码是否已经存在？ 判断是否存在，布隆过滤器了解过吗？ 安全连接网址，全球数10亿的网址判断 黑名单校验，识别垃圾邮件 白名单校验，识别出合法用户进行后续处理"}, {"sid": "chapter-11-section-27", "ch": "12.Redis高阶篇", "sec": "6.布隆过滤器BloomFilter/2.布隆过滤器介绍", "t": "布隆过滤器基本介绍 是什么 由一个初值都为零的bit数组和多个哈希函数构成，用来快速判断集合中是否存在某个元素 设计思想 text 目的：减少内存占用； 方式：不保存数据信息，只是在内存中做一个是否存在的标记flag 本质就是判断具体数据是否存在于一个大的集合中 备注： 布隆过滤器是一种<font color = 'red' 类似set的</font 数据结构，只是统计结果在<font color = 'green' 巨量数据下有点小瑕疵，不够完美</font text 布隆过滤器(英语: bloom filter) 是 1970 年由布隆提出的。 它实际上是一个很长的二进制数组(00000000)+一系列随机hash算法映射函数，主要用于判断一个元素是否在集合中。 通常我们会遇到很多要判断一个元素是否在某个集合中的业条场景，一般想到的是将集合中所有元素保存起来，然后通过比较确定。链表、树、哈希表等等数据结构都是这种思路。但是随着集合中元素的增加，我们需要的存储空间也会呈现线性增长，最终达到瓶颈。同时检索速度也越来越慢，上述三种结构的检索时间复杂度分别为o(n),0(logn),0(1)。这个时候隆过滤器 (bloom filter)就应运而生 能干嘛 特点考点 高效地插入和查询，占用空间少，返回的结果是不确定性+不够完美 重点：<font color = 'red' 一个元素如果判断结果：存在时，元素不一定存在，但是判断结果为不存在时，则一定不存在。</font 布隆过滤器可以添加元素，但是<font color = 'red' 不能删除元素，</font 由于涉及hashcode判断依据，删除元素会导致误判率增加。 小总结：有，是可能有；无，是肯定无；（可以保证的是，如果布隆过滤器判断一个元素不在一个集合中，那这个元素一定不会在集合中）"}, {"sid": "chapter-11-section-28", "ch": "12.Redis高阶篇", "sec": "6.布隆过滤器BloomFilter/3.布隆过滤器原理", "t": "布隆过滤器原理 布隆过滤器实现原理和数据结构 原理 布隆过滤器(bloom filter) 是一种专门用来解决去重问题的高级数据结构。 实质就是<font color = 'red' 一个大型位数组和几个不同的无偏hash函数</font (无偏表示分布均匀)。由一个初值都为零的bit数组和多个哈希函数构成，用来快速判断某个数据是否存在。但是跟 hyperloglog 一样，它也一样有那么一点点不精确，也存在一定的误判概率 添加key、查询key <font color = 'blue' 添加key时</font 使用多个hash函数对key进行hash运算得到一个整数索引值，对位数组长度进行取模运算得到一个位置，每个hash函数都会得到一个不同的位置，将这几个位置都置1就完成了add操作。 <font color = 'blue' 查询key时</font 只要有其中一位是零就表示这个key不存在，但如果都是1，则不一定存在对应的<font color = 'red' key.结论:有，是可能有无，是肯定无</font hash冲突导致数据不精准 当有变量被加入集合时，通过n个映射函数将这个变量映射成位图中的n个点,把它们置为 1(假定有两个变量都通过 3 个映射函数)。 查询某个变量的时候我们只要看看这些点是不是都是 1，就可以大概率知道集合中有没有它了 如果这些点，<font color = 'red' 有任何一个为零则被查询变量一定不在，</font 如果都是 1，则被查询变量很<font color = 'red' 可能存在</font ， <font color = 'red' 为什么说是可能存在，而不是一定存在呢?那是因为映射函数本身就是散列函数，散列函数是会有碰撞的。 (见上图3号坑两个对象都1)</font text 正是基于布隆过滤器的快速检测特性，我们可以在把数据写入数据库时，使用布隆过滤器做个标记。当缓布缺失后，应用查询数据库时，可以通过查询布隆过滤器快速判断数据是否存在。如果不存在，就不用再去据库中查询了。这样一来，即使发生缓存穿透了，大量请求只会查询redis和布隆过滤器，而不会积压到数据库，也就不会影响数据库的正常运行。布隆过滤器可以使用redis实现，本身就能承担较大的并发访问压力 hash冲突导致数据不精准2 哈希函数 哈希函数的概念是：将任意大小的输入数据转换成特定大小的输出数据的函数，转换后的数据称为哈希值或哈希编码，也叫散列值 如果两个散列值是不相同的(根据同一函数)那么这两个散列值的原始输入也是不相同的。这个特性是散列函数具有确定性的结果，具有这种性质的散列函数称为单向散列函数。 散列函数的输入和输出不是唯一对应关系的，<font color = 'red' 如果两个散列值相同，两个输入值很可能是相同的，但也可能不同，</font 这种情况称为“散列碰撞 (collision)”。 用 hash表存储大数据量时，空间效率还是很低，当只有一个 hash 函数时，还很容易发生哈希碰撞。 java中hash冲突java案例 java public static void main(string[] args) { system.out.println(\"aa\".hashcode()); system.out.println(\"bb\".hashcode()); system.out.println(\"柳柴\".hashcode()); system.out.println(\"柴柕\".hashcode()); set<integer sets = new hashset< (); int hashcode; for(int i = 0; i < 200000; i++) { hashcode = new object().hashcode(); if(sets.contains(hashcode)) { system.out.println(\"运行到第:\"+i+\"次出现hash冲突,hashcode: \" + hashcode); continue; } sets.add(hashcode); } } / 2112 2112 851553 851553 运行到第: 103993 次出现hash冲突,hashcode: 213440190 运行到第: 109440 次出现hash冲突,nashcode: 651156501 运行到第: 143624 次出现hash冲突,hashcode: 2038112324 运行到第: 144557 次出现hash冲突,hashcode: 1164664992 运行到第: 150537 次出现hash冲突,hashcode: 273791087 运行到第: 179"}, {"sid": "chapter-11-section-29", "ch": "12.Redis高阶篇", "sec": "6.布隆过滤器BloomFilter/4.手写布隆过滤器", "t": "手写布隆过滤器 布隆过滤器的使用场景 1. <font color = 'red' 解决缓存穿透的问题，和redis结合bitmap使用</font <font color = 'blue' 缓存穿透是什么</font 一般情况下，先查询缓存redis是否有该条数据，缓存中没有时，再查询数据库。当数据库也不存在该条数据时，每次查询都要访问数据库，这就是缓存穿透。 缓存穿透带来的问题是，当有大量请求查询数据库不存在的数据时，就会给数据库带来压力，甚至会拖垮数据库。 <font color = 'blue' 可以使用布隆过滤器解决缓存穿透的问题</font 把已存在数据的key存在布隆过滤器中，相当于redis前面挡着一个布隆过滤器。 当有新的请求时，先到布隆过滤器中查询是否存在: 如果布隆过滤器中不存在该条数据则直接返回; 如果布隆过滤器中已存在，才去查询缓存redis，如果redis里没查询到则再查询mysql数据库 2. 黑名单校验，识别垃圾邮件 发现存在黑名单中的，就执行特定操作。比如:识别垃圾邮件，只要是邮箱在黑名单中的邮件，就识别为垃圾邮件。 假设黑名单的数量是数以亿计的，存放起来就是非常耗费存储空间的，布隆过滤器则是一个较好的解决方案。 把所有黑名单都放在布隆过滤器中，在收到邮件时，判断邮件地址是否在布隆过滤器中即可。 手写布隆过滤器 <font color = 'red' 结合bitmap类型手写一个简单的布隆过滤器，体会设计思想</font 整体架构 步骤设计 redis的setbit/getbit setbit的构建过程 @postconstruct初始化白名单数据 计算元素的hash值 通过上一步hash值算出对应的二进制数据的坑位 将对应坑位的值修改为数字1，表示存在 getbit查询是否存在 计算元素的hash值 通过上一步hash值算出对应的二进制数组的坑位 返回对应坑位的值，零表示无，1表示存在 springboot+redis+mybatis案例基础与一键编码环境整合 mybatis通用mapper4 mybatis generator ： http://mybatis.org/generator/ mybatis通用mapper4官网 ： https://github.com/abel533/mapper 一键生成 t customer用户表sql sql create table t customer ( id int(20) not null auto increment, cname varchar(50) not null, age int(10) not null, phone varchar(20) not null, sex tinyint(4) not null, birth timestamp not null default current timestamp on update current timestamp, primary key ( id ), key idx cname ( cname ) ) engine=innodb auto increment=10 default charset=utf8mb4; 建springboot的module mybatis generator 改pom xml <?xml version=\"1.0\" encoding=\"utf 8\"? <project xmlns=\"http://maven.apache.org/pom/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/xmlschema instance\" xsi:schemalocation=\"http://maven.apache.org/pom/4.0.0 https://maven.apache.org/xsd/maven 4.0.0.xsd\" <modelversion 4.0.0</modelversion <parent <groupid org.springframework.boot</groupid <artifactid spring boot starter parent</artifactid <version 2.6.10</version <relativepath/ <! lookup parent from repository </parent <groupid com.luojia</groupid <artifactid mybatis generator</artifactid <version 0.0.1 snapshot</version <name mybatis generator</name "}, {"sid": "chapter-11-section-30", "ch": "12.Redis高阶篇", "sec": "6.布隆过滤器BloomFilter/5.布隆过滤器优缺点", "t": "布隆过滤器优缺点 优点 高效地插入和查询，内存中占用bit空间小 缺点 不能删除元素。因为删除元素会导致误判率增加，因为hash冲突同一个位置可能存的东西是多个共有的，你删除一个的同事可能也把其他的删除了 存在误判，不能精准过滤；有，是很有可能有；无，是肯定无 布谷鸟过滤器（了解） 为了解决布隆过滤器不能删除元素的问题，布谷鸟过滤器横空出世。 https://www.cs.cmu.edu/~binfan/papers/conext14 cuckoofilter.pdf"}, {"sid": "chapter-11-section-31", "ch": "12.Redis高阶篇", "sec": "7.Redis缓存预热雪崩击穿穿透/1.面试总结", "t": "面试总结 缓存预热、雪崩、穿透、击穿分别是什么？遇到过哪几种情况？ 缓存预热是怎么做的？ 如何避免或者减少缓存雪崩？ 穿透和击穿有什么区别？他俩是一个意思还是截然不同？ 穿透和击穿你有什么解决方案？如何避免？ 加入出现了缓存不一致，你有哪些修补方案？"}, {"sid": "chapter-11-section-32", "ch": "12.Redis高阶篇", "sec": "7.Redis缓存预热雪崩击穿穿透/2.缓存预热", "t": "缓存预热 将热点数据提前加载到redis缓存中，可以通过@postconstruct提前运行某个程序，将其加载到redis中"}, {"sid": "chapter-11-section-33", "ch": "12.Redis高阶篇", "sec": "7.Redis缓存预热雪崩击穿穿透/3.缓存雪崩", "t": "缓存雪崩 发生 redis主机挂了，redis全盘崩溃，偏硬件运维 redis中有大量key同时过期大面积失效，偏软件开发 预防 + 解决 redis中key设置为永不过期或者过期时间为指定时间+随机时间，错开同时过期的概率 redis缓存集群实现高可用 主从+哨兵 redis cluster 开启redis持久化机制aof/rdb，尽快恢复缓存集群 多缓存结合预防雪崩 ehcache本地缓存 + redis缓存 服务降级 hystrix或者阿里sentinel限流&降级 人民币玩家 阿里云 云数据库redis版：https://www.aliyun.com/product/kvstore?spm=5176.54432.j 3207526240.15.2a3818a5ig191e"}, {"sid": "chapter-11-section-34", "ch": "12.Redis高阶篇", "sec": "7.Redis缓存预热雪崩击穿穿透/4.缓存穿透", "t": "缓存穿透 是什么 请求去查询一条记录，先查redis无，后查mysql无，都查询不到该条记录但是请求每次都会打到数据库上面去，导致后台数据库压力暴增，这种现象我们称为缓存穿透，这个redis变成了一个摆设。 简单说就是本来无一物，两库都没有，既不在redis缓存库，也不在mysql，数据库存在被多次暴击风险 解决 缓存穿透 恶意攻击 可以空对象缓存或者使用布隆过滤器 方案1：空对象缓存或者缺省值 一般情况都是ok的 text 第一种解决方案，回写增强 如果发生了缓存穿透，我们可以针对要查询的数据，在redis里存一个和业务部门商量后确定的缺省值(比如,零、负数、defaultnull等) 比如，键uid;abcdxxx，值defaultnull作为案例的key和value 先去redis查键uid:abcdxxx没有，再去mysql查没有获得，这就发生了一次穿透现象。 but，可以增强回写机制 mysql也查不到的话也让redis存入刚刚查不到的key并保护mysql。 第一次来查询uid:abcdxxx，redis和mysql都没有，返回nul给调用者，但是增强回写后第二次来查uid:abcdxxx，此时redis就有值了。 可以直接从redis中读取default缺省值返回给业务应用程序，避免了把大量请求发送给mysql处理，打爆mysql。 但是，此方法架不住黑客的恶意攻击，有缺陷......，只能解决key相同的情况 但是会有黑客或者恶意攻击 黑客会对你的系统进行攻击，拿一个不存在的id去查询数据，会产生大量的请求到数据库去查询。可能会导致你的数据库由于压力过大而宕掉 key相同打你系统 第一次打到mysql，空对象缓存后第二次就返回defaultnull缺省值，避免mysql被攻击，不用再到数据库中去走一圈了 <font color ='red' key不同打你系统</font 由于存在空对象缓存和缓存回写(看自己业务不限死)，redis中的无关紧要的key也会越写越多<font color ='red' (记得设置redis过期时间)</font 方案2：google布隆过滤器guava解决缓存穿透 guava中布隆过滤器的实现算是比较权威的，所以实际项目中我们可以直接使用guava布隆过滤器 guava's bloomfilter 源码出处：https://github.com/google/guava/blob/master/guava/src/com/google/common/hash/bloomfilter.java 案例：白名单过滤器 白名单架构说明 误判问题，但是概率小可以接受，不能从布隆过滤器删除 全部合法的key都需要放入guava版布隆过滤器+redis里面，不然数据就是返回null 代码编写 建model 还是使用redis7 study 改pom xml <! guava google 开源的 guava 中带的布隆过德器 <dependency <groupid com.google.guava</groupid <artifactid guava</artifactid <version 23.0</version </dependency 写yml 无变化 主启动 无变化 业务类 ​ 新建入门测试案例 java @test public void testguava() { // 1 创建guava 版本布隆过滤器 bloomfilter<integer bloomfilter = bloomfilter.create(funnels.integerfunnel(), 100); // 2 判断指定的元素是否存在 system.out.println(bloomfilter.mightcontain(1));// false system.out.println(bloomfilter.mightcontain(2));// false system.out.println(); // 3 将元素新增进入布隆过滤器 bloomfilter.put(1); bloomfilter.put(2); system.out.println(bloomfilter.mightcontain(1));// true system.out.println(bloomfilter.mightcontain(2));// true } ​ 新建guava案例 guavabloomfiltercontroller java package com.luojia.redis7 study.controller; import com.luojia.redis7 study.service.guavabloo"}, {"sid": "chapter-11-section-35", "ch": "12.Redis高阶篇", "sec": "7.Redis缓存预热雪崩击穿穿透/5.缓存击穿", "t": "缓存击穿 是什么 大量请求同时查询一个key时，此时这个key正好失效了，就会导致大量的请求都打到数据库，<font color = 'red' 简单点就是热点key突然失效了，暴打mysql</font <font color = 'gren' 缓存穿透和缓存击穿是完全不同的东西</font 危害 会造成某一时刻数据库请求量过大，压力剧增；一般技术部门需要知道热点key是哪些，做到心里有数防止击穿。 解决 缓存击穿 热点key失效 今天互斥更新、随机退避、差异失效时间 热点key失效：时间到了自然清除但还是被访问到，delete掉的key，刚好又被访问到 方案一：差异失效时间，对于访问频繁的热点key，干脆就不设置过期时间 <font color = 'red' 方案二：互斥更新，采用双检加锁策略</font 多个线程同时去查询数据库的这条数据，那么我们可以在第一个查询数据的请求上使用一个互斥锁来锁住它。其他的线程走到这一步拿不到锁就等着，等第一个线程查询到了数据，然后做缓存。后面的线程进来发现已经有缓存了，就直接走缓存 案例 模拟高并发的天猫聚划算案例code 分析过程 | 步骤 | 说明 | | | | | 1 | 100%高并发，绝对不可以用mysql实现 | | 2 | 先把mysql里面参加活动的数据抽取进redis，一般采用定时器扫描来决定上线活动还是下线取消。 | | 3 | 支持分页功能，一页20条数据 | | | 思考：什么样的数据类型支持上述功能？ | <font color = 'red' 高并发+定时任务+分页显示</font redis数据类型选型 springboot+redis实现高并发的聚划算业务 创建entity对象 java package com.luojia.redis7 study.entities; import io.swagger.annotations.apimodel; import lombok.allargsconstructor; import lombok.data; import lombok.noargsconstructor; @data @allargsconstructor @noargsconstructor @apimodel(value=\"聚划算活动product信息\") public class product { // 产品id private long id; // 产品名称 private string name; // 产品价格 private integer price; // 产品详情 private string detail; } jhstaskservice：采用定时器将参与聚划算活动的特价商品新增进入redis中 java package com.luojia.redis7 study.service; import com.luojia.redis7 study.entities.product; import lombok.extern.slf4j.slf4j; import org.springframework.beans.factory.annotation.autowired; import org.springframework.data.redis.core.redistemplate; import org.springframework.stereotype.service; import javax.annotation.postconstruct; import java.util.arraylist; import java.util.list; import java.util.random; @service @slf4j public class jhstaskservice { public static final string jhs key = \"jhs\"; public static final string jhs key a = \"jhs:a\"; public static final string jhs key b = \"jhs:b\"; @autowired private redistemplate redistemplate; / 假设此处是从数据库读取，然后加载到redis @return / private list<product getproductsfrommysql() { arraylist<product list = new arraylist< (); for (int i = 0; i < 20; i++) { random random = new r"}, {"sid": "chapter-11-section-36", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/1.面试总结", "t": "redis除了拿来做缓存，还有基于redis的其他用法吗 数据共享，分布式session 分布式锁 全局id 计算器、点赞 位统计 购物车 轻量级消息队列 list stream 抽奖 点赞、签到、打卡 交集差集并集，用户关注，可能认识的人 热点新闻、热搜排行 redis做分布式的时候需要注意什么问题？ 你们公司自己实现的分布式锁是否用的setnx命令实现?这个是最合适的吗?你如何考虑分布式锁的可重入问题? 如果redis是单点部署的，会带来什么问题？准备怎么解决单点问题呢？ redis集群模式下，比如主从模式下，cap方面有没有什么问题？ redis集群是ap，高可用；redis单机是c，数据一致性 86592695 简单介绍一下redlock，谈谈redisson redis分布式锁如何续期，看门狗是什么？"}, {"sid": "chapter-11-section-37", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/2.分布式锁需具备的条件和刚需", "t": "锁的种类 <font color='red' 单机版同一个虚拟机内，</font synchronized或者lock接口。 <font color='red' 分布式多个不同jvm虚拟机，</font 单机的线程锁机制不再起作用，资源类在不同的服务器之间共享了。 一个靠谱的分布式锁需要具备的条件和刚需 独占性 任何时刻有且只能有一个线程持有 高可用 若为redis集群环境下，不能因为某一个节点挂了而出现获取锁和释放锁失败的情况 高并发请求下，依旧性能ok好使 防死锁 杜绝死锁，必须有超时控制机制或者撤销操作，有个兜底终止跳出方案 不乱抢 防止张冠李戴，不能私底下unlock别人的锁，只能自己加锁自己释放 重入性 同一个节点的同一个线程如果获得锁之后，它也可以再次获取这个锁"}, {"sid": "chapter-11-section-38", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/3.分布式锁案例", "t": "分布式锁 setnx key value <font color ='red' setnx+expire不安全，两条命令为非原子性命令</font set key value[ex seconds] \\[px milliseconds] \\[nx|xx] 重点 juc中aqs锁的规范落地参考+可重入锁+lua脚本+redis命令一步步实现分布式锁 base案例(boot+redis) 使用场景：多个服务间保证同一时间段内同一用户只能有一个请求（防止关键业务出现并发攻击） 建module ​ redis distributed lock2 ​ redis distributed lock3 写pom xml <?xml version=\"1.0\" encoding=\"utf 8\"? <project xmlns=\"http://maven.apache.org/pom/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/xmlschema instance\" xsi:schemalocation=\"http://maven.apache.org/pom/4.0.0 https://maven.apache.org/xsd/maven 4.0.0.xsd\" <modelversion 4.0.0</modelversion <parent <groupid org.springframework.boot</groupid <artifactid spring boot starter parent</artifactid <version 2.7.11</version <relativepath/ <! lookup parent from repository </parent <groupid com.luojia</groupid <artifactid redis distributed lock2</artifactid <version 0.0.1 snapshot</version <name redis distributed lock2</name <description demo project for spring boot</description <properties <project.build.sourceencoding utf 8</project.build.sourceencoding <java.version 1.8</java.version <maven.compiler.source 1.8</maven.compiler.source <maven.compiler.target 1.8</maven.compiler.target <lombok.version 1.16.18</lombok.version </properties <dependencies <! springboot 通用依赖模块 <dependency <groupid org.springframework.boot</groupid <artifactid spring boot starter web</artifactid </dependency <! springboot 与redis整合依赖 <dependency <groupid org.springframework.boot</groupid <artifactid spring boot starter data redis</artifactid </dependency <dependency <groupid org.apache.commons</groupid <artifactid commons pool2</artifactid </dependency <! swagger2 <dependency <groupid io.springfox</groupid <artifactid springfox swagger2</artifactid <version 2.9.2</version </dependency <dependency <groupid io.springfox</groupid <artifactid springfox swagger ui</artifactid <version 2.9.2</version </dependency <dependency <groupid cn.hutool</groupid <artifactid hutool all</artifactid <version 5.2.3</version </dependen"}, {"sid": "chapter-11-section-39", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/4.手写分布式锁思路", "t": "手写分布式锁思路分析2023 <font color = 'red' 上述笔记代码的不足 </font 1. 初始化版本简单添加 业务类，将上面7777的业务逻辑代码原样拷贝到8888，加上synchronized或者lock 2. nginx分布式微服务架构 v2.0版本代码分布式部署后，单机锁还是出现超卖现象，需要分布式锁 nginx配置负载均衡 命令地址+配置地址 命令地址：/usr/local/nginx/sbin 配置地址：/usr/local/nginx/conf 启动 /usr/local/nginx/sbin 执行./nginx 启动nginx并测试通过，浏览器看到nginx欢迎welcome页面 /usr/local/nginx/conf目录下修改配置文件nginx.conf新增反向代理和负载均衡配置 关闭 /usr/local/nginx/sbin 执行./nginx s stop 指定配置启动 在/usr/local/nginx/sbin 路径下执行命令 ./nginx c nginx.conf全路径 重启 在/usr/local/nginx/sbin 执行./nginx s reload v2.0版本代码修改+启动两个微服务 ​ 通过nginx访问，自己linux服务器ip地址，反向代理+负载均衡 ​ 可以点击查看效果，可以看到一边一个，通过配置的权重来轮询 ​ http://1270.0.1/inventory/sale 上面纯手工点击验证ok，下面高并发模拟 使用jmeter进行压测 创建线程组redis 创建一个http请求 jmeter压测 查看报告 执行绿色执行按钮，开始并发请求程序 发现商品出现超卖 bug？why？ synchronized和reentrantlock是单机锁，只能管住当前自己的jvm。 在<font color='red' 单机环境</font 下，可以使用synchronized或lock来实现 但是在分布式系统中，因为竞争的线程可能不在同一个节点上(同一个jvm中)，所以需要一个让所有进程都能访问到的锁来实现<font color='red' (比如redis或者zookeeper来构建)</font 不同进程ivm层面的锁就不管用了，那么可以利用第三方的一个组件，来获取锁，未获取到锁，则阻塞当前想要运行的线程 分布式锁出现 跨进程+跨服务 解决超卖 防止缓存击穿 3. 解决 上redis分布式锁setnx；redis具有极高的性能,且其命令对分布式锁支持友好,借助set 命令即可实现加锁处理。"}, {"sid": "chapter-11-section-40", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/5.redis分布式锁", "t": "代码改造为3.1版 java public string sale() { string resmessgae = \"\"; string key = \"luojiaredislocak\"; string uuidvalue = idutil.simpleuuid() + \":\" + thread.currentthread().getid(); boolean flag = stringredistemplate.opsforvalue().setifabsent(key, uuidvalue); // 抢不到的线程继续重试 if (!flag) { // 线程休眠20毫秒，进行递归重试 try { timeunit.milliseconds.sleep(20); } catch (interruptedexception e) { e.printstacktrace(); } sale(); } else { try { // 1 抢锁成功，查询库存信息 string result = stringredistemplate.opsforvalue().get(\"inventory01\"); // 2 判断库存书否足够 integer inventorynum = result == null ? 0 : integer.parseint(result); // 3 扣减库存，每次减少一个库存 if (inventorynum 0) { stringredistemplate.opsforvalue().set(\"inventory01\", string.valueof( inventorynum)); resmessgae = \"成功卖出一个商品，库存剩余：\" + inventorynum + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } else { resmessgae = \"商品已售罄。\" + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } } finally { stringredistemplate.delete(key); } } return resmessgae; } 通过递归的方式来完成重试，不断获取锁 <font color ='red' 但是依旧有问题：手工设置5000个线程来抢占锁，压测ok，但是容易导致stackoverflowerror，不推荐，需要进一步完善</font 修改为3.2版 多线程判断想想juc里面说过的虚假唤醒，用while替代if，用自旋锁代替递归重试 java public string sale() { string resmessgae = \"\"; string key = \"luojiaredislocak\"; string uuidvalue = idutil.simpleuuid() + \":\" + thread.currentthread().getid(); // 不用递归了，高并发容易出错，我们用自旋代替递归方法重试调用；也不用if，用while代替 while (!stringredistemplate.opsforvalue().setifabsent(key, uuidvalue)) { // 线程休眠20毫秒，进行递归重试 try {timeunit.milliseconds.sleep(20);} catch (interruptedexception e) {e.printstacktrace();} } try { // 1 抢锁成功，查询库存信息 string result = stringredistemplate.opsforvalue().get(\"inventory01\"); // 2 判断库存书否足够 integer inventorynum = result == null ? 0 : integer.parseint(result); // 3 扣减库存，每次减少一个库存 if (inventorynum 0) { stringredistemplate.opsforvalue().set(\"inventory01\", string.valueof( inventorynum)); resmessgae = \"成功卖出一个商品，库存剩余：\" + inventorynum + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } else { resmessgae = \"商品已售罄。\" + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } }"}, {"sid": "chapter-11-section-41", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/6.宕机防止死锁", "t": "需要防止服务器突然宕机导致程序死锁 v3.2代码存在的问题 部署了微服务的java程序机器挂了，代码层面根本没有走到finally这块，没办法保证解锁(无过期时间该key一直存在)，这个key没有被删除，需要加入一个过期时间限定key 解决 修改代码为v4.1版 java while (!stringredistemplate.opsforvalue().setifabsent(key, uuidvalue)) { // 线程休眠20毫秒，进行递归重试 try {timeunit.milliseconds.sleep(20);} catch (interruptedexception e) {e.printstacktrace();} } // 设置过期时间 stringredistemplate.expire(key, 30l, timeunit.seconds); 4.1版本结论 不可行，设置的key+过期时间分开了，必须要合并成一行使其具备原子性 修改为4.2版 java while (!stringredistemplate.opsforvalue().setifabsent(key, uuidvalue, 30l, timeunit.seconds)) { // 线程休眠20毫秒，进行递归重试 try {timeunit.milliseconds.sleep(20);} catch (interruptedexception e) {e.printstacktrace();} } 4.2版本结论 加锁和过期时间设置必须同一行，保证原子性"}, {"sid": "chapter-11-section-42", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/7.防止误删key问题", "t": "v4.2版本代码问题 实际业务中，如果处理时间超过了设置的key的过期时间，那删除key的时候岂不是<font color='blue' 张冠李戴，删除了别人的锁</font 解决 只能自己删除自己的，不允许删除别人的说，修改代码为5.0版本 java // v5.0 版本 public string sale() { string resmessgae = \"\"; string key = \"luojiaredislocak\"; string uuidvalue = idutil.simpleuuid() + \":\" + thread.currentthread().getid(); // 不用递归了，高并发容易出错，我们用自旋代替递归方法重试调用；也不用if，用while代替 while (!stringredistemplate.opsforvalue().setifabsent(key, uuidvalue, 30l, timeunit.seconds)) { // 线程休眠20毫秒，进行递归重试 try {timeunit.milliseconds.sleep(20);} catch (interruptedexception e) {e.printstacktrace();} } try { // 1 抢锁成功，查询库存信息 string result = stringredistemplate.opsforvalue().get(\"inventory01\"); // 2 判断库存书否足够 integer inventorynum = result == null ? 0 : integer.parseint(result); // 3 扣减库存，每次减少一个库存 if (inventorynum 0) { stringredistemplate.opsforvalue().set(\"inventory01\", string.valueof( inventorynum)); resmessgae = \"成功卖出一个商品，库存剩余：\" + inventorynum + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } else { resmessgae = \"商品已售罄。\" + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } } finally { // v5.0 改进点，判断加锁与解锁是不同客户端，自己只能删除自己的锁，不误删别人的锁 if (stringredistemplate.opsforvalue().get(key).equalsignorecase(uuidvalue)) { stringredistemplate.delete(key); } } return resmessgae; }"}, {"sid": "chapter-11-section-43", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/8.Lua保证原子性", "t": "v5.0依旧存在问题 finally代码块的判断+del删除不是原子性的 <font color='red' 启用lua脚本编写redis分布式锁判断+删除判断代码</font lua脚本 官网解释：https://redis.io/docs/manual/patterns/distributed locks/ lua脚本浅谈 lua脚本初识 redis调用lua脚本通过eval命令保证代码执行的原子性，直接用return返回脚本执行后的结果值 eval luascript numkeys [key [key ...]] [arg [arg ...]] lua脚本进一步 redis分布式锁lua脚本官网练习 lua eval \"if redis.call('get',keys[1]) == argv[1] then return redis.call('del',keys[1]) else return 0 end\" 1 luojiaredislock 1111 条件语法判断 条件判断案例 lua if keys[1] keys[2] then return argv[1] elseif keys[1] < keys[2] then return argv[2] else return argv[3] end 通过lua脚本解决v5.0版本bug java public string sale() { string resmessgae = \"\"; string key = \"luojiaredislocak\"; string uuidvalue = idutil.simpleuuid() + \":\" + thread.currentthread().getid(); // 不用递归了，高并发容易出错，我们用自旋代替递归方法重试调用；也不用if，用while代替 while (!stringredistemplate.opsforvalue().setifabsent(key, uuidvalue, 30l, timeunit.seconds)) { // 线程休眠20毫秒，进行递归重试 try {timeunit.milliseconds.sleep(20);} catch (interruptedexception e) {e.printstacktrace();} } try { // 1 抢锁成功，查询库存信息 string result = stringredistemplate.opsforvalue().get(\"inventory01\"); // 2 判断库存书否足够 integer inventorynum = result == null ? 0 : integer.parseint(result); // 3 扣减库存，每次减少一个库存 if (inventorynum 0) { stringredistemplate.opsforvalue().set(\"inventory01\", string.valueof( inventorynum)); resmessgae = \"成功卖出一个商品，库存剩余：\" + inventorynum + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } else { resmessgae = \"商品已售罄。\" + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } } finally { // 改进点，修改为lua脚本的redis分布式锁调用，必须保证原子性，参考官网脚本案例 string luascript = \"if redis.call('get',keys[1]) == argv[1] then \" + \"return redis.call('del',keys[1]) \" + \"else \" + \"return 0 \" + \"end\"; stringredistemplate.execute(new defaultredisscript(luascript, boolean.class), arrays.aslist(key), uuidvalue); } return resmessgae; }"}, {"sid": "chapter-11-section-44", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/9.可重入锁", "t": "可重入锁又名递归锁 说明： text 可重入锁又名递归锁 是指在同一个线程在外层方法获取锁的时候，再进入该线程的内层方法会自动获取锁(前提，锁对象得是同一个对象)，不会因为之前已经获取过还没释放而阻塞。 如果是1个有synchronized修饰的递归调用方法，程序第2次进入被自己阻塞了岂不是天大的笑话，出现了作茧自缚。 所以java中reentrantlock和synchronized都是可重入锁，可重入锁的一个优点是可以一定程度避免死锁。 可重入锁这四个字分开来解释： 可：可以 重：再次 入：进入 锁：同步锁 进入什么：进入同步域（即同步代码块/方法或显示锁锁定的代码） 一句话：一个线程中的多个流程可以获取同一把锁，持有这把同步锁可以再次进入。自己可以获取自己的内部锁 可重入锁种类 隐式锁(即synchronized关键字使用的锁) 默认是可重入锁 text 指的是可重复可递归调用的锁，在外层使用锁之后。在内层仍然可以使用，并目不发生死锁，这样的锁就叫做可重入锁。简单的来说就是:在一个synchronied修饰的方法或代码块的内部调用本类的其他synchronized修饰的方法或代码块时，是永远可以得到锁的。 与可重入锁相反，不可重入锁不可递归调用，递归调用就发生死锁。 synchronized的重入的实现机理 java 每个锁对象拥有一个锁计数器和一个指向持有该锁的线程的指针。 当执行monitorenter时，如果目标锁对象的计数器为零，那么说明它没有被其他线程所持有，java虚拟机会将该锁对象的持有线程设置为当前线程，并且将其计数器加1。 在目标锁对象的计数器不为零的情况下，如果锁对象的持有线程是当前线程，那么 java 虚拟机可以将其计数器加1，否则需要等待直至持有线程释放该锁。 当执行monitorexit时，java虚拟机则需将锁对象的计数器减1。计数器为零代表锁已被释放。 显式锁(即lock)也有reentrantlock这样的可重入锁 text 一个synchronized修饰的方法或代码块的内部调用本类的其他synchronized修饰的方法或代码块时，是永远可以得到锁 lock/unlock配合可重入锁进行aqs源码分析讲解 切记，一般而言，你lock了几次就要unlock几次； 可以分析new reentrantlock();查看"}, {"sid": "chapter-11-section-45", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/10.可重入锁的Redis替代", "t": "上述可重入锁的计数问题，redis中哪个数据类型可以替代 k k v 数据结构 java hset luojiaredislock 0c90d37cb6ec42268861b3d739f8b3a8:1 11 type luojiaredislock hash map<string, map<object, object 小总结 setnx只能解决有无的问题，够用但是不完美 hset，不但解决有无，还能解决可重入问题 <font color='red' 设计重点（一横一纵）</font 目前两个分支，目的是保证同一个时候只能有一个线程持有锁进去redis做扣减库存动作 一个分支保证加锁/解锁，lock/unlock; 另一个分支扣减库存，redis命令的原子性"}, {"sid": "chapter-11-section-46", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/11.Lua脚本", "t": "加锁lua脚本lock 先判断redis分布式锁这个key是否存在 exists key： ​ 返回零说明不存在，hset新建当前线程属于自己的锁，field key格式为uuid:threadid，value为加锁次数； ​ 返回壹说明已经有锁，需进一步判断是不是当前线程自己的 ​ hexists key uuid:threadid：返回0说明不是自己的锁；返回1说明是自己的锁，自增1次表示重入 ​ hincrby key uuid:threadid 1 上述设计修改为lua脚本 v1版本 lua // 加锁的lua脚本，对标我们的lock方法 if redis.call('exists', 'key') == 0 then redis.call('hset', 'key', 'uuid:threadid', 1) redis.call('expire', 'key', 50) return 1 elseif redis.call('hexists', 'key', 'uuid:threadid') == 1 then redis.call('hincrby', 'key', 'uuid:threadid', 1) redis.call('expire', 'key', 50) return 1 else return 0 end v2版本 当key不存在的时候，hincrby可以自动创建这个key并且自增 lua // v2 合并相同的代码，用hincrby替代hset，精简代码 if redis.call('exists', 'key') == 0 or redis.call('hexists', 'key', 'uuid:threadid') == 1 then redis.call('hincrby', 'key', 'uuid:threadid', 1) redis.call('expire', 'key', 50) return 1 else return 0 end v3版本 lua // v3 脚本ok，换上参数来替代写死的key，value if redis.call('exists', keys[1]) == 0 or redis.call('hexists', keys[1], argv[1]) == 1 then redis.call('hincrby', keys[1], argv[1], 1) redis.call('expire', keys[1], argv[2]) return 1 else return 0 end 测试 lua 已完成验证 if redis.call('exists', keys[1]) == 0 or redis.call('hexists', keys[1], argv[1]) == 1 then redis.call('hincrby', keys[1], argv[1], 1) redis.call('expire', keys[1], argv[2]) return 1 else return 0 end eval \"if redis.call('exists', keys[1]) == 0 or redis.call('hexists', keys[1], argv[1]) == 1 then redis.call('hincrby', keys[1], argv[1], 1) redis.call('expire', keys[1], argv[2]) return 1 else return 0 end\" 1 luojiaredislock 001122:1 50 解锁lua脚本unlock 设计思路：有锁且还是自己的锁 hexists key uuid:threadid 返回零，说明根本没有锁，程序块返回nil 不是零，说明有锁且是自己的锁，<font color='red' 直接调用hincrby负一</font ，表示每次减一，解锁一次直到它变成零表示可以删除该锁key，del锁 上述设计修改为lua脚本 v1版本 lua // 解锁的lua脚本，对标我们的lock方法 if redis.call('hexists', 'key', uuid:threadid) == 0 then return nil elseif redis.call('hincrby', key, uuid:threadid, 1) == 0 then return redis.call('del', key) else return 0 end v2版本 lua if redis.call('hexists', keys[1], argv[1]) == 0 then retu"}, {"sid": "chapter-11-section-47", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/12.LUA整合JAVA程序", "t": "步骤一：<font color='gree' 复原程序为初识无锁版本</font java public string sale() { string resmessgae = \"\"; try { // 1 抢锁成功，查询库存信息 string result = stringredistemplate.opsforvalue().get(\"inventory01\"); // 2 判断库存书否足够 integer inventorynum = result == null ? 0 : integer.parseint(result); // 3 扣减库存，每次减少一个库存 if (inventorynum 0) { stringredistemplate.opsforvalue().set(\"inventory01\", string.valueof( inventorynum)); resmessgae = \"成功卖出一个商品，库存剩余：\" + inventorynum + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } else { resmessgae = \"商品已售罄。\" + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } } finally { } return resmessgae; } 步骤二：新建redisdistributedlock类实现juc里面的lock接口 步骤三：满足juc里面aqs对lock锁的接口规范定义来进行实现落地代码 步骤四：结合设计模式开发属于自己的redis分布式锁工具类 lua脚本加锁 lua if redis.call('exists', keys[1]) == 0 or redis.call('hexists', keys[1], argv[1]) == 1 then redis.call('hincrby', keys[1], argv[1], 1) redis.call('expire', keys[1], argv[2]) return 1 else return 0 end lua脚本解锁 lua if redis.call('hexists', keys[1], argv[1]) == 0 then return nil elseif redis.call('hincrby', keys[1], argv[1], 1) == 0 then return redis.call('del', keys[1]) else return 0 end 工厂设计模式引入 通过实现juc里面的lock接口，实现redis分布式锁redisdistributedlock java package com.luojia.redislock.mylock; import cn.hutool.core.util.idutil; import org.springframework.data.redis.core.stringredistemplate; import org.springframework.data.redis.core.script.defaultredisscript; import java.util.arrays; import java.util.concurrent.timeunit; import java.util.concurrent.locks.condition; import java.util.concurrent.locks.lock; / 自研的分布式锁，实现了lock接口 / public class redisdistributedlock implements lock { private stringredistemplate stringredistemplate; private string lockname; // keys[1] private string uuidvalule; // argv[1] private long expiretime; // argv[2] public redisdistributedlock(stringredistemplate stringredistemplate, string lockname) { this.stringredistemplate = stringredistemplate; this.lockname = lockname; this.uuidvalule = idutil.simpleuuid() + \":\" + thread.currentthread().get"}, {"sid": "chapter-11-section-48", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/13.可重入性测试+设计模式", "t": "可重入测试 inventoryservice类新增可重入测试方法 java // v7.1 使用工厂类创建锁 @autowired private distributedlockfactory distributedlockfactory; public string sale() { string resmessgae = \"\"; lock redislock = distributedlockfactory.getdistributedlock(\"redis\", \"luojiaredislock\"); redislock.lock(); try { // 1 抢锁成功，查询库存信息 string result = stringredistemplate.opsforvalue().get(\"inventory01\"); // 2 判断库存书否足够 integer inventorynum = result == null ? 0 : integer.parseint(result); // 3 扣减库存，每次减少一个库存 if (inventorynum 0) { stringredistemplate.opsforvalue().set(\"inventory01\", string.valueof( inventorynum)); resmessgae = \"成功卖出一个商品，库存剩余：\" + inventorynum + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); testreentry(); } else { resmessgae = \"商品已售罄。\" + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } } finally { redislock.unlock(); } return resmessgae; } private void testreentry() { lock redislock = distributedlockfactory.getdistributedlock(\"redis\", \"luojiaredislock\"); redislock.lock(); try { log.info(\"=================测试可重入锁=================\"); } finally { redislock.unlock(); } } 结果：无法重入 testreentry方法中，会创建一个新的锁key，因为threadid一致了，但是uuid不ok 引入工厂模式改造7.2版本code distributedlockfactory 新增一个无参构造函数 java package com.luojia.redislock.mylock; import cn.hutool.core.util.idutil; import org.springframework.beans.factory.annotation.autowired; import org.springframework.data.redis.core.stringredistemplate; import org.springframework.stereotype.component; import java.util.concurrent.locks.lock; @component public class distributedlockfactory { @autowired private stringredistemplate stringredistemplate; private string uuid; public distributedlockfactory() { this.uuid = idutil.simpleuuid(); } public lock getdistributedlock(string locktype, string lockname) { if (locktype == null) { return null; } if (\"redis\".equalsignorecase(locktype)) { return new redisdistributedlock(stringredistemplate, lockname, uuid); } else if (\"zookeeper\".equalsignorecase(locktype)) { // 后面存在就返回对应的分布式锁 } else if (\"mysql\".equalsignorecase(locktype)) { // 后面"}, {"sid": "chapter-11-section-49", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/14.自动续期", "t": "确保redislock过期时间大于业务执行时间的问题 时间到了，业务没有执行完需要自动续期 cap redis集群是ap <font color='red' redis异步复制造成的锁丢失</font ，比如：主节点没来的及把刚刚set进来的这条数据给从节点，master就挂了，从机上位但是从机上无数据 zookeeper集群是cp 故障： eureka集群是ap nacos集群是ap 自动续期的lua脚本 lua // 自动续期的lua脚本 if redis.call('hexists', keys[1], argv[1]) == 1 then return redis.call('expire', keys[1], argv[2]) else return 0 end 测试验证 lua if redis.call('hexists', keys[1], argv[1]) == 1 then return redis.call('expire', keys[1], argv[2]) else return 0 end hset luojiaredislock test 001 expire luojiaredislock 30 eval \"if redis.call('hexists', keys[1], argv[1]) == 1 then return redis.call('expire', keys[1], argv[2]) else return 0 end\" 1 luojiaredislock test 1 <font color='gree' 8.0新增自动续期功能</font java @override public boolean trylock(long time, timeunit unit) throws interruptedexception { if ( 1 == time) { string script = \"if redis.call('exists', keys[1]) == 0 or redis.call('hexists', keys[1], argv[1]) == 1 then \" + \"redis.call('hincrby', keys[1], argv[1], 1) \" + \"redis.call('expire', keys[1], argv[2]) \" + \"return 1 \" + \"else \" + \"return 0 \" + \"end\"; system.out.println(\"lock() lockname:\" + lockname + \"\\t\" + \"uuidvalue:\" + uuidvalule); // 加锁失败需要自旋一直获取锁 while (!stringredistemplate.execute( new defaultredisscript< (script, boolean.class), arrays.aslist(lockname), uuidvalule, string.valueof(expiretime))) { // 休眠60毫秒再来重试 try {timeunit.milliseconds.sleep(60);} catch (interruptedexception e) {e.printstacktrace();} } // 新建一个后台扫描程序，来检查key目前的ttl，是否到我们规定的剩余时间来实现锁续期 resetexpire(); return true; } return false; } // 自动续期 private void resetexpire() { string script = \"if redis.call('hexists', keys[1], argv[1]) == 1 then \" + \"return redis.call('expire', keys[1], argv[2]) \" + \"else \" + \"return 0 \" + \"end\"; new timer().schedule(new timertask() { @override public void run() { if (stringredistemplate.execute( new defaultredisscript< (script, boolean.class), arrays.aslist(lockname), uuidvalule, string.valueof(expiretime))) { // 续期成功，继续监听 system.out.println(\"resetexpire() lockname:\" + "}, {"sid": "chapter-11-section-50", "ch": "12.Redis高阶篇", "sec": "8.Redis分布式锁/15.总结", "t": "总结 synchronized单机版ok； v1.0 nginx分布式微服务，轮询多台服务器，单机锁不行； v2.0 取消单机锁，上redis分布式锁setnx，中小企业使用没问题； v3.1 ​ 只是加锁了，没有释放锁，出异常的话，可能无法释放锁，必须要在代码层面finally释放锁 v3.2 ​ 如果服务宕机，部署了微服务代码层面根本就没有走到finally这块，没办法保证解锁，这个key没有被删除，需要对锁设置过期时间 v3.2 ​ 为redis的分布式锁key增加过期时间，还必须要保证setnx+过期时间在同一行，保证原子性 v4.1 ​ 程序由于执行超过锁的过期时间，所以在finally中必须规定只能自己删除自己的锁，不能把别人的锁删除了，防止张冠李戴 v5.0 将lock、unlock变成lua脚本保证原子性； v6.0 保证锁的可重入性，hset替代setnx+lock变成lua脚本，保障可重入性； v7.0 锁的自动续期 v8.0"}, {"sid": "chapter-11-section-51", "ch": "12.Redis高阶篇", "sec": "9.Redlock算法和底层源码分析/1.代码接8.0版本", "t": "<font color='red' 自研一把分布式锁，面试回答的主要考点</font 1. 按照juc里面java.util.concurrent.locks.lock接口规范编写 2. lock()加锁关键逻辑 加锁：加锁实际上就是在redis中，给key设置一个值，为了避免死锁，并给定一个过期时间 可重入：加锁的lua脚本，通过redis里面的hash数据模型，加锁和可重入性都要保证 自旋：加锁不成，需要while进行重试并自旋，aqs 续期：在过期时间内，一定时间内业务还未完成，自动给锁续期 3. unlock()解锁关键逻辑 将redis的key删除，但是也不能乱删，不能说客户端1的请求将客户端2的锁给删除掉了，只能自己删自己的锁 考虑可重入性的递减，加锁几次就需要删除几次 最后到零了，直接del删除 上面自研的redis锁对于一般中小公司，不是特别高并发场景足够用了，单机redis小业务也撑得住"}, {"sid": "chapter-11-section-52", "ch": "12.Redis高阶篇", "sec": "9.Redlock算法和底层源码分析/2.Redlock红锁算法", "t": "redis分布式锁 redlock红锁算法 distributed locks with redis 官网说明 https://redis.io/docs/manual/patterns/distributed locks/ 主页说明 为什么学习这个？怎么产生的？ <font color = 'red' 之前手写的分布式锁有什么缺点：</font 官网说明： 翻译： 有时在特殊情况下，例如在故障期间，多个客户端可以同时持有锁是完全没问题的。如果是这种情况，您可以使用基于复制的解决方案。否则，我们建议实施本文档中描述的解决方案。 线程1首先获取锁成功，将键值对写入redis 的 master节点，在 redis将该键值对同步到slave 节点之前，master发生了故障； redis触发故障转移，其中一个slave升级为新的 master，此时新上位的master并不包含线程1写入的键值对，因此线程⒉尝试获取锁也可以成功拿到锁，<font color = 'red' 此时相当于有两个线程获取到了锁，可能会导致各种预期之外的情况发生，例如最常见的脏数据。</font 我们加的是排它独占锁，同一时间只能有一个建redis锁成功并持有锁，严禁出现2个以上的请求线程拿到锁。 redlock算法设计理念 redis之父提出了redlock算法解决上面这个一锁被多建的问题 redis 也提供了 redlock 算法，用来实现<font color = 'red' 基于多个实例的</font 分布式锁。 锁变量由多个实例维护，即使有实例发生了故障，锁变量仍然是存在的，客户端还是可以完成锁操作。redlock算法是实现高可靠分布式锁的一种有效解决方案，可以在实际开发中使用。 redlock算法官网： 翻译： 设计理念 该方案也是基于(set加锁、lua脚本解锁）进行改良的，所以redis之父antirez只描述了差异的地方，大致方案如下：假设我们有n个redis主节点，例如n= 5这些节点是完全独立的，我们不使用复制或任何其他隐式协调系统，为了取到锁客户端执行以下操作： 1. 获取当前时间，以毫秒为单位; 2. 依次尝试从5个实例，使用相同的 key和随机值（例如 uuid）获取锁。当向redis 请求获取锁时，客户端应该设置一个超时时间，这个超时时间应该小于锁的失效时间。例如你的锁自动失效时间为10秒，则超时时间应该在5 50毫秒之间。这样可以防止客户端在试图与一个宕机的 redis 节点对话时长时间处于阻塞状态。如果一个实例不可用，客户端应该尽快尝试去另外一个redis实例请求获取锁; 3. 客户端通过当前时间减去步骤1记录的时间来计算获取锁使用的时间。当且仅当从大多数(n/2+1，这里是3个节点)的redis节点都取到锁，并且获取锁使用的时间小于锁失效时间时，锁才算获取成功; 4. 如果取到了锁，其真正有效时间等于初始有效时间减去获取锁所使用的时间（步骤3计算的结果）。 5. 如果由于某些原因未能获得锁（无法在至少n/2＋1个redis实例获取锁、或获取锁的时间超过了有效时间)，客户端应该在所有的redis 实例上进行解锁（即便某些redis实例根本就没有加锁成功，防止某些节点获取到锁但是客户端没有得到响应而导致接下来的一段时间不能被重新获取锁）。 该方案为了解决数据不一致的问题，<font color = 'red' 直接舍弃了异步复制只使用master节点</font ，同时由于舍弃了slave，为了保证可用性，引入了n个节点 <font color = 'blue' 客户端只有在满足下面的这两个条件时，才能认为是加锁成功。</font <font color = 'blue' 条件1:客户端从超过半数（大于等于n/2+1）的redis实例上成功获取到了锁;</font <font color = 'blue' 条件2:客户端获取锁的总耗时没有超过锁的有效时间。</font 解决方案 为什么是奇数：n = 2x + 1 （n是最终部署机器数，x是容错机器数） redisson实现 redisson是java的redis客户端之一，提供了一些api方便操作redis redisson之官网：https://redisson.org redisson之github：https://github.com/redisson/redisson/wiki redisson之解决分布式锁：https://github.com/redisson/redisson/wiki/8. distributed locks and synchronizers"}, {"sid": "chapter-11-section-53", "ch": "12.Redis高阶篇", "sec": "9.Redlock算法和底层源码分析/3.使用Redisson进行编码改造V9.0", "t": "v9.0版本修改 改pom：加上redisson相关代码 xml <! redisson <dependency <groupid org.redisson</groupid <artifactid redisson</artifactid <version 3.13.4</version </dependency 配置类：redisconfig java @bean public redisson redisson() { config config = new config(); config.usesingleserver() .setaddress(\"redis://127.0.0.1:6379\") .setdatabase(0) .setpassword(\"123456\"); return (redisson) redisson.create(config); } 修改服务方法：inventoryservice java // v9.0, 引入redisson对应的官网推荐redlock算法实现类 @autowired private redisson redisson; public string salebyredisson() { string resmessgae = \"\"; rlock redissonlock = redisson.getlock(\"luojiaredislock\"); redissonlock.lock(); try { // 1 抢锁成功，查询库存信息 string result = stringredistemplate.opsforvalue().get(\"inventory01\"); // 2 判断库存书否足够 integer inventorynum = result == null ? 0 : integer.parseint(result); // 3 扣减库存，每次减少一个库存 if (inventorynum 0) { stringredistemplate.opsforvalue().set(\"inventory01\", string.valueof( inventorynum)); resmessgae = \"成功卖出一个商品，库存剩余：\" + inventorynum + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } else { resmessgae = \"商品已售罄。\" + \"\\t\" + \"，服务端口号：\" + port; log.info(resmessgae); } } finally { redissonlock.unlock(); } return resmessgae; } 测试 jmeter压测 发现bug 解决 业务代码修改为v9.1版本，保证删除时候，删除的是自己，修改删除代码的finally部分即可 java finally { // 改进点，只能删除属于自己的key，不能删除别人的 if(redissonlock.islocked() && redissonlock.isheldbycurrentthread()) { redissonlock.unlock(); } }"}, {"sid": "chapter-11-section-54", "ch": "12.Redis高阶篇", "sec": "9.Redlock算法和底层源码分析/4.Redisson源码解析", "t": "加锁、可重入、续命、解锁 分析步骤 redis分布式锁过期了，但是业务逻辑还没有处理完怎么办 需要给对应的key续期 守护线程“续命” <font color = 'red' 额外起一个线程，定期检查线程是否还持有锁，如果有则延长过期时间</font ； redisson里面就实现了这个方案，使用“看门狗”定期检查（每1/3的锁时间检查1次），如果线程还持有锁，则刷新过期时间。 在获取锁成功后，给锁加一个watchdog，watchdog会起一个定时任务，在锁没有被释放且快要过期的时候会续期 上述源码分析1 通过redisson新建出来的锁key，默认是30秒 上述源码分析2：lock tryacquire tryacquireasync scheduleexpirationrenewal 缓存续期 上述源码分析3：lock tryacquire tryacquireasync，锁的可重入性 通过exists判断，如果锁不存在，则设置值和过期时间，加锁成功 通过hexists判断，如果锁已存在，并且锁的是当前线程，则证明是重入锁，加锁成功 如果锁已存在，但锁的不是当前线程，则证明有其他线程持有锁。返回当前锁的过期时间(代表了锁key的剩余生存时间)，加锁失败 上述源码分析4 watch dog自动延期机制： 源码中初始化了一个定时器，dely的时间是 internallockleasetime / 3。 在redisson中，internallockleasetime 是获取配置的看门狗的时间，默认是30s，也就是每隔10s续期一次，每次重新设置过期时间为30s。 redisson看门狗续期源码： java private void renewexpiration() { expirationentry ee = expiration renewal map.get(getentryname()); if (ee == null) { return; } timeout task = commandexecutor.getconnectionmanager().newtimeout(new timertask() { @override public void run(timeout timeout) throws exception { expirationentry ent = expiration renewal map.get(getentryname()); if (ent == null) { return; } long threadid = ent.getfirstthreadid(); if (threadid == null) { return; } rfuture<boolean future = renewexpirationasync(threadid); future.oncomplete((res, e) { if (e != null) { log.error(\"can't update lock \" + getname() + \" expiration\", e); return; } if (res) { // reschedule itself renewexpiration(); } }); } }, internallockleasetime / 3, timeunit.milliseconds); ee.settimeout(task); } 如果直接调用lock方法，客户端a加锁成功，就会启动一个watch dog看门狗，他是一个后台线程，默认是每隔10s检查一下，如果客户端a还持有锁，就会不断的延长锁的时间。当然，如果不想使用看门狗，可以使用其他的lock带参数方法，有锁过期时间，不会有看门狗续期 自动续期lua脚本源码： java protected rfuture<boolean renewexpirationasync(long threadid) { return evalwriteasync(getname(), longcodec.instance, rediscommands.eval boolean, \"if (redis.call('hexists', keys[1], argv[2]) == 1) then \" + \"redis.call('pexpire', keys[1], argv[1]); \" + \"return 1; \" + \"end; \" + \"return 0;\", collections.singletonlist(getname()), internallockleasetime, getlockname(threadid)); } 解锁"}, {"sid": "chapter-11-section-55", "ch": "12.Redis高阶篇", "sec": "9.Redlock算法和底层源码分析/5.多机案例", "t": "理论参考来源 redis之父提出了redlock算法解决这个问题 这个锁的算法实现了多redis实例的情况，相对于单redis节点来说，<font color='red' 优点在于防止了单节点故障造成整个服务停止运行</font 的情况且在多节点中锁的设计，及多节点同时崩溃等各种意处情况有自己独特的设计方法。 redisson 分布式锁支持 multilock 机制可以将多个锁合并为一个大锁，对一个大锁进行统一的申请加锁以及释放锁。 <font color='gren' 最低保证分布式锁的有效性及安全性的要求如下:</font 1.互斥：任何时刻只能有一个client获取锁 2.释放死锁：即使锁定资源的服务崩溃或者分区，仍然能释放锁 3.容错性：只要多数redis节点(一半以上) 在使用，client就可以获取和释放锁 <font color='gren' 网上讲的基于故障转移实现的redis主从无法真正实现redlock：</font 因为redis在进行主从复制时是异步完成的，比如在clienta获取锁后，主redis复制数据到从redis过程中崩溃了，导致没有复制到从redis中，然后从redis选举出一个升级为主redis，造成新的主redis没有clienta 设置的锁，这时clientb尝试获取锁，并且能够成功获取锁，导致互斥失效； 代码参考来源 https://github.com/redisson/redisson/wiki/8. distributed locks and synchronizers 最新推荐使用multilock多重锁，详见官网案例 使用redisson分布式锁，需要单独的redis master多节点，不能是哨兵模式的master或者集群模式的master； 加入现在有三台redis 服务器，并且是master： java rlock lock1 = redisson1.getlock(\"lock1\"); rlock lock2 = redisson2.getlock(\"lock2\"); rlock lock3 = redisson3.getlock(\"lock3\"); rlock multilock = anyredisson.getmultilock(lock1, lock2, lock3); // traditional lock method multilock.lock(); 这样三台redis都会有加锁信息，当其中某一台宕机后，不会影响整个加锁信息，其他客户端过来依旧会拿到锁信息，不能成功获取到锁(可重入锁除外)，次数如果宕机服务器重新上线，它会自动同步其他redis上的锁信息，并且同步锁过期时间"}, {"sid": "chapter-11-section-56", "ch": "12.Redis高阶篇", "sec": "10.Redis的缓存过期淘汰策略/1.面试总结", "t": "总结 生产上你们redis内存设置多少 如何配置、修改redis的内存大小 如果内存满了怎么办 redis清理内存的方式？定期删除和惰性删除了解过吗？ redis缓存淘汰策略有哪些？分别是什么？用过那个？ redis的lru了解过吗？请手写lru lru和lfu算法的区别是什么？ lru means least recently used 最近最少使用 lfu means least frequently used 最不常用"}, {"sid": "chapter-11-section-57", "ch": "12.Redis高阶篇", "sec": "10.Redis的缓存过期淘汰策略/2.redis内存满了怎么办", "t": "redis默认内存是多少？在哪查看？如何设置修改？ 查看redis最大占用内存 打开redis配置文件，设置maxmemory参数，maxmemory是bytes字节类型，注意类型转换。 通过命令查看默认的内存大小 默认内存大小为0吗？那我们之前的数据是怎么保存进去的？ redis默认内存多少可用？ 如果不设置最大内存或者设置最大内存大小为0，<font color = 'red' 在64位操作系统下不限制内存大小</font ，在32位操作系统下最多使用3gb内存 注意：在64bit系统下，maxmemory设置为0表示不限制redis内存使用 一般生产上你如何配置 一般推荐redis设置内存为最大物理内存的3/4 如何修改redis内存设置 通过修改文件配置 通过命令修改，但是redis重启后会失效 什么命令查看redis内存使用情况 info memory config get maxmemory 内存打满了，超出了设置的最大值会怎么样？ 结论 设置了maxmemory的选项，假如redis内存使用达到了上限，没有加上过期时间就会导致数据写满maxmemory，为了避免类似情况，需要使用内存淘汰策略"}, {"sid": "chapter-11-section-58", "ch": "12.Redis高阶篇", "sec": "10.Redis的缓存过期淘汰策略/3.Redis是如何删除数据的", "t": "redis过期键的删除策略 如果一个键是过期的，那它到了过期时间之后是不是马上就从内存中被删除了呢？ 如果不是，那过期后到底什么时候被删除呢？是什么操作？ redis三种删除策略 1. 立即删除/定时删除 立即删除能保证内存中数据的最大新鲜度，因为它保证过期键值会在过期后马上被删除，其所占用的内存也会随之释放。但是立即删除对cpu是最不友好的。因为删除操作会占用cpu的时间，如果刚好碰上了cpu很忙的时候，比如正在做交集或排序等计算的时候，就会给cpu造成额外的压力，让cpu心累，时时需要删除，忙死。 <font color = 'red' 这会产生大量的性能消耗，同时也会影响数据的读取操作</font 总结： 对cpu不友好，用处理器性能换取存储空间（拿时间换空间） 2. 惰性删除 数据到达过期时间，不做处理。等下次访问该数据时，如果未过期，返回数据 ;发现已过期，删除，返回不存在。 <font color = 'red' 惰性删除策略的缺点是，它对内存是最不友好的。</font 如果一个键已经过期，而这个键又仍然保留在redis中，那么只要这个过期键不被访问，它所占用的内存就不会释放。在使用惰性删除策略时，如果数据库中有非常多的过期键，而这些过期键又恰好没有被访问到的话，那么它们也许永远也不会被删除(除非用户手动执行flushdb)，我们甚至可以将这种情况看作是一种内存泄漏 无用的垃圾数据占用了大量的内存。而服务器却不会自己去释放它们，这对于运行状态非常依赖于内存的redis服务器来说,肯定不是一个好消息 总结： 对内存不友好，用存储空间换取处理器性能（拿空间换时间），开启惰性删除淘汰，lazyfree lazy eviction=yes 3. 上面两种方案都走极端 <font color = 'red' 定期删除 策略是前两种策略的折中：</font 定期删除策略<font color = 'red' 每隔一段时间执行一次删除过期键操作</font 并通过限制删除操作执行时长和频率来减少删除操作对cpu时间的影响。 周期性轮询redis库中的时效性数据，采用随机抽取的策略，利用过期数据占比的方式控制删除频度 特点1：cpu性能占用设置有峰值，检测频度可自定义设置 特点2：内存压力不是很大，长期占用内存的冷数据会被持续清理 总结：周期性抽查存储空间 (随机抽查，重点抽查) 举例: redis默认每隔100ms检查是否有过期的key，有过期key则删除。注意: redis不是每隔100ms将所有的key检查一次而是随机抽取进行检查<font color = 'red' (如果每隔100ms.全部key进行检查，redis直接进去icu)</font 。因此，如果只采用定期删除策略，会导致很多key到时间没有删除。 定期删除策略的难点是确定删除操作执行的时长和频率：如果删除操作执行得太频繁或者执行的时间太长，定期删除策略就会退化成立即删除策略，以至于将cpu时间过多地消耗在删除过期键上面。如果删除操作执行得太少，或者执行的时间太短，定期删除策略又会和惰性删除束略一样，出现浪费内存的情况。因此，如果采用定期删除策略的话，服务器必须根据情况，合理地设置删除操作的执行时长和执行频率。 上述步骤都过堂了，还有漏洞吗？ 1 定期删除时，从来没有被抽查到 2 惰性删除时，也从来没有被点中使用过 上述两个步骤 ====== 大量过期的key堆积在内存中，导致redis内存空间紧张或者很快耗尽 <font color = 'blue' 必须要有一个更好的兜底方案......</font"}, {"sid": "chapter-11-section-59", "ch": "12.Redis高阶篇", "sec": "10.Redis的缓存过期淘汰策略/4.缓存淘汰策略", "t": "redis配置文件 在memory management中 lru和lfu算法的区别是什么 lru：最近<font color = 'red' 最少使用</font 页面置换算法，淘汰最长时间未被使用的页面，看页面最后一次被使用到发生调度的时间长短，首先淘汰最长时间未被使用的页面。 lfu：最近<font color = 'red' 最不常用</font 页面置换算法，淘汰一定时期内被访问次数最少的页面，看一定时间段内页面被使用的频率，淘汰一定时期内被访问次数最少的页 <font color = 'blue' 举个栗子</font 某次时期time为10分钟，如果每分钟进行一次调页，主存块为3（即只能保存3个页面），若所需页面走向为2 1 2 1 2 3 4，假设到页面4时会发生缺页中断（装不下导致的缓存淘汰） 若按lru算法，应换页面1(1页面最久未被使用)，但按lfu算法应换页面3(十分钟内,页面3只使用了一次) 可见lru关键是看页面最后一次被使用到发生调度的时间长短，而lfu关键是看一定时间段内页面被使用的频率 淘汰策略有哪些(redis7版本) 1. noeviction：不会驱逐任何key，表示即使内存达到上限也不进行置换，所有能引起内存增加的命令都会返回error 2. allkeys lru：对所有key使用lru算法进行删除，优先删除掉最近最不经常使用的key，用以保存新数据 3. volatile lru：对所有设置了过期时间的key使用lru算法进行删除 4. allkeys random：对所有key随机删除 5. volatile random：对所有设置了过期时间的key随机删除 6. volatile ttl：删除马山要过期的key 7. allkeys lfu：对所有key使用lfu算法进行删除 8. volatile lfu：对所有设置了过期时间的key使用lfu算法进行删除 <font color = 'red' 对上面淘汰策略的总结</font 2个维度：过期键中筛选；所有键中筛选 4个方面：lru lfu random ttl 8个选项 淘汰策略怎么选 如何配置？如何修改？ 直接使用config命令 直接redis.conf配置文件 redis缓存淘汰策略配置性能建议 避免存储bigkey 开启惰性删除，lazyfree lazy eviction=yes"}, {"sid": "chapter-11-section-60", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/1.面试总结", "t": "redis数据类型的底层数据结构 sds动态字符串 双向链表 压缩列表ziplist 哈希表hashtable 跳表skiplist 整数集合intset 快速列表quicklist 紧凑列表listpack 本章节意义 90%是没有太大意义的，更多的是为了面试 但是如果是大厂，会内部重构redis，比如阿里云redis，美团tair，滴滴kedis等"}, {"sid": "chapter-11-section-61", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/2.源码简介", "t": "src源码包下面该如何看？ 源码在哪 \\redis 7.0.5\\src https://github.com/redis/redis/tree/7.0/src 源码分析思路 工作和面试中需要什么，就看什么 redis基本的数据结构(骨架) github官网说明 redis对象object.c 字符串t string.c 列表t list.c 字典t hash.c 集合及有序集合t set.c和t zset.c 数据流t stream.c：streams的底层实现结构listpack.c和rax.c；了解即可 简单动态字符串sds.c 整数集合intset.c 压缩列表ziplist.c 快速链表quicklist.c listpack 字典dict.c redis数据库的实现 数据库的底层实现db.c 持久化rdb.c和aof.c redis服务端和客户端实现 事件驱动ae.c和ae epoll.c 网络连接anet.c和networking.c 服务端程序server.c 客户端程序redis cli.c 其他 主从复制replication.c 哨兵sentinel.c 集群cluster.c 其他数据结构，如hyperloglog.c、geo.c等 其他功能，如pub/sub、lua脚本"}, {"sid": "chapter-11-section-62", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/3.字典数据库KV键值对到底是什么", "t": "如何实现键值对（key value）数据库的 redis 是 key value 存储系统，其中key类型一般为字符串，value 类型则为redis对象(redisobject) 图说 10大类型说明（粗分） <font color = 'red' 传统的5大类型</font string list hash set zset 新介绍的5大类型 bitmap 实质string hyperloglog 实质string geo 实质zset stream 实质stream bitfield 看具体key <font color = 'red' 上帝视角：</font redis定义了redisobject结构体来表示string、hash、list、set、zset等数据类型 c语言struct结构体语法简介 redis中每个对象都是一个redisobject结构 字典、kv是什么（重点） <font color = 'red' 每个键值对都会有一个dictentry：</font <font color = 'red' 源码位置：dict.h</font <font color = 'red' 重点：从dictentry到redisobject</font redisobject +redis数据类型+redis 所有编码方式(底层实现)三者之间的关系"}, {"sid": "chapter-11-section-63", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/4.数据类型和结构总纲", "t": "重点：redis数据类型与数据结构总纲图 1. <font color = 'orange' 源码分析总体数据结构大纲</font sds动态字符串 双向链表 压缩列表ziplist 哈希表hashtable 跳表skiplist 整数集合intset 快速列表quicklist 紧凑列表listpack 2. redis6.0.5 string = sds set = intset + hashtable zset = skiplist + ziplist list = quicklist + ziplist hash = hashtable + ziplist 3. 2021.11.29之后，redis7 string = sds set = intset + hashtable zset = skiplist + listpack紧凑列表 list = quicklist hash = hashtable + listpack"}, {"sid": "chapter-11-section-64", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/5.源码分析", "t": "从set hello world说起 每个键值对都会有一个dictentry set hello word为例，因为redis是kv键值对的数据库，<font color='red' 每个键值对都会有一个dictentry(源码位置:dict.h)</font ，里面指向了key和value的指针,next 指向下一个dictentry。 key是字符串，但是 redis没有直接使用c的字符数组，而是存储在redis自定义的sds中。 <font color='red' value 既不是直接作为字符串存储，也不是直接存储在 sds中，而是存储在redisobject中。</font 实际上五种常用的数据类型的任何一种，都是通过 redisobject来存储的。 看看类型：type 键 看看编码：object encoding hello redisobject结构的作用 为了便于操作，redis采用redisobjec结构来统一五种不同的数据类型，这样所有的数据类型就都可以以相同的形式在函数间传递而不用使用特定的类型结构。同时，为了识别不同的数据类型，redisobjec中定义了type和encoding字段对不同的数据类型加以区别。简单地说，<font color='red' redisobjec就是string、hash、list、set、zset的父类</font ，可以在函数间传递时隐藏具体的类型信息，所以作者抽象了redisobjec结构来到达同样的目的。 redisobject各字段的含义 1 4位的type表示具体的数据类型 2 4位的encoding表示该类型的物理编码方式见下表，同一种数据类型可能有不同的编码方式。(比如string就提供了3种:int embstr raw) 3 lru字段表示当内存超限时采用lru算法清除内存中的对象。 4 refcount表示对象的引用计数。 <font color='red' 5 ptr指针指向真正的底层数据结构的指针。</font 案例 set age 17 | type | leixing | | | | | encoding | 编码，本案例是数值类型 | | lru | 最近被访问的时间 | | refcount | 等于1，表示当前对象引用的次数 | | ptr | value值是多少，当前就是17 |"}, {"sid": "chapter-11-section-65", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/6.Debug命令使用", "t": "各个类型的数据结构的编码映射和定义 debug object key 命令：debug object key 开启前： 开启后： value at：内存地址 refcount：引用次数 encoding：物理编码类型 serializedlength：序列化后的长度（注意这里的长度是序列化后的长度，保存为rdb文件时使用了该算法，不是真正存储在内存的大小)，会对字串做一些可能的压缩以便底层优化 lru：记录最近使用时间戳 lru seconds idle：空闲时间（每get一次，最近使用时间戳和空闲时间都会刷新）"}, {"sid": "chapter-11-section-66", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/7.String数据结构介绍", "t": "3大物理编码格式 redisobject内部对应三大物理编码 1. 整数 int 保存long 型（长整型）的64位（8个字节）有符号整数 上面数字最多19位 <font color = 'blue' 只有整数才会使用int，如果是浮点数，redis内部其实先将浮点数转化为字符串值，然后再保存。</font 2. 嵌入式 embstr 代表embstr格式的sds(simple dynamic string简单动态字符串)，保存长度小于44字节的字符串 embstr顾名思义即：embedded string，表示嵌入式的string 3. 未加工数据 raw 保存长度大于44字节的字符串 3大物理编码案例 案例演示 c语言中字符串的展现 <font color = 'blue' redis没有直接复用c语言的字符串</font ，<font color = 'red' 而是新建了属于自己的结构 sds</font <font color = 'red' 在redis数据库里，包含字符串值的键值对都是由sds实现的(redis中所有的键都是由字符串对象实现的即底层是由sds实现，redis中所有的值对象中包含的字符串对象底层也是由sds实现)</font 。 <font color = 'red' sds简单动态字符串</font sds.h源码分析 说明 redis中字符串的实现,sds有多种结构( sds.h) : sdshdr5、(2^5=32byte)，但是不会使用，是redis团队内部测试使用 sdshdr8、(2^8=256byte) sdshdr16、(2^16=65536byte=64kb) sdshdr32、(2 ^32byte=4gb) sdshdr64，2的64次方byte=17179869184g用于存储不同的长度的字符串。 len表示sds的长度，使我们在获取字符串长度的时候可以在o(1)情况下拿到，而不是像c那样需要遍历一遍字符串。 alloc可以用来计算 free就是字符串已经分配的未使用的空间，有了这个值就可以引入预分配空间的算法了，而不用去考虑内存分配的问题。 buf表示字符串数组，真实存数据的。 官网 <font color = 'red' redis为什么要重新设计一个sds数据结构？</font | | c语言 | sds | | | | | | 字符串长度处理 | 需要从头开始遍历,直到遇到'\\o'为止，时间复杂度o(n) | 记录当前字符串的长度，直接读取即可，时间复杂度o(1) | | 内存重新分配 | 分配内存空间超过后，会导致数组下标越级或者内存分配溢出 | <font color = 'blue' 空间预分配</font <br/ sds修改后，len长度小于1m，那么将会额外分配与 len相同长度的未使用空间。如果修改后长度大于1m，那么将分配1m的使用空间。<br/ <font color = 'blue' 惰性空间释放</font <br/ 有空间分配对应的就有空间释放。sds缩短时并不会回收多余的内存空间,而是使用free字段将多出来的空间记录下来。如果后续有变更操作，直接使用free中记录的空间，减少了内存的分配。 | | 二进制安全 | 二进制数据并不是规则的字符串格式，可能会包含一些特殊的字符，比如 '\\0'等。前面提到过，c中字符串遇到'\\0'会结束,那'\\0'之后的数据就读取不上了 | 根据len长度来判断字符串结束的，二进制安全的问题就解决了 | 源码分析 用户api set k1 v1 底层发生了什么？调用关系？ 3大物理编码方式 int编码格式 命令示例: set k1 123 当字符串键值的内容可以用一个64位有符号整形来表示时，redis会将键值转化为long型来进行存储，此时即对应 ob encoding int 编码类型。内部的内存结构表示如下: embstr编码格式 对于长度小于 44的字符串，redis 对键值采用obj encoding embstr 方式，embstr 顾名思义即: embedded string，表示嵌入式的string。从内存结构上来讲 即字符串 sds结构体与其对应的 redisobject 对象分配在同一块连续的内存空间，字符串sds嵌入在redisobiect对象之中一样。 raw编码格式 当字符串的键值为长度大于44的超长字符串时，redis 则会将键值的内部编码方式改为obj encoding raw格式，这与obj encoding embstr编码方式的不同之处在于，此时动态字符sds的内存<font color = 'red' 与其依赖的redisobiect的内存不再连续了</font 明明没有超过阈"}, {"sid": "chapter-11-section-67", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/8.Hash数据结构介绍", "t": "hash的两种编码格式 redis6以前：ziplist、hashtable redis7：listpack、hashtable redis6 hash max ziplist entries：使用压缩列表保存时哈希集合中的最大元素个数。 hash max ziplist value：使用压缩列表保存时哈希集合中单个元素的最人长度。 hash类型键的字段个数 <font color = 'red' 小于 </font hash max ziplist entries 并且每个字段名和字段值的长度 <font color = 'red' 小于 </font hash max ziplist value 时，redis才会使用 obj encoding ziplist来存该键，前述条件任意一个不满足则会转换为 obj encoding ht的编码方式 .png) .png) 结论 1. 哈希对象保存的键值对数量小于 512个； 2. 所有的键值对的健和值的字符串长度都小于等于 64byte (一个英文字母一个字节)时用ziplist，反之用hashtable； 3. ziplist升级到hashtable可以，反过来降级不可以；即一旦从压缩列表转为了哈希表，hash类型就会一直用哈希表进行保存而不会再转回压缩列表了。在节省内存空间方面哈希表就没有压缩列表高效了。 redis7 hash max listpack entries：使用压缩列表保存时哈希集合中的最大元素个数。 hash max listpack value：使用压缩列表保存时哈希集合中单个元素的最人长度。 hash类型键的字段个数 <font color = 'red' 小于 </font hash max listpack entries且每个字段名和字段值的长度 <font color = 'red' 小于 </font hash max listpack value 时，redis才会使用obj encoding listpack来存储该键，前述条件任意一个不满足则会转换为 obi encoding ht的编码方式 .png) .png) .png) 结论 1. 哈希对象保存的键值对数量小于 512个； 2. 所有的键值对的健和值的字符串长度都小于等于 64byte (一个英文字母一个字节时用listpack，反之用hashtable 3. listpack升级到hashtable可以，反过来降级不可以"}, {"sid": "chapter-11-section-68", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/9.List数据结构介绍", "t": "redis6 <font color = 'blue' (1) ziplist压缩配置: list compress depth 0</font 表示一个quicklist两端不被压缩的节点个数。这里的节点是指quicklist双向链表的节点，而不是指ziplist里面的数据项个数参数list compress depth的取值含义如下: <font color = 'red' 0：是个特殊值，表示都不压缩。这是redis的默认值。</font 1：表示quicklist两端各有1个节点不压缩，中间的节点压缩 2：表示quicklist两端各有2个节点不压缩，中间的节点压缩 以此类推... ... <font color = 'blue' (2) ziplist中entry配置：list max ziplist size 2</font 当取正值的时候，表示按照数据项个数来限定每个quicklist节点上的ziplist长度。比如，当这个参数配置成5的时候，表示每个quicklist节点的ziplist最多包含5个数据项。当取负值的时候，表示按照占用字节数来限定每个quicklist节点上的ziplist长度。这时，它只能取 1到 5这五个值，每个值含义如下： 5：每个quicklist节点上的zlplist大小不能超过64 kb。(注;：1kb = 1024 bytes) 4：每个quicklist节点上的ziplist大小不能超过32 kb。 3：每个qulcklist节点上的zlplist大小不能超过16 kb。 <font color = 'red' 2：每个quicklist节点上的ziplist大小不能超过8 kb。( 2是redis给出的默认值)</font 1：每个quicklist节点上的ziplist大小不能超过4 kb。 quicklist 实际上是 ziplist 和 linkedlist 的混合体，它将 linkedlist按段切分，每一段使用 ziplist 来紧凑存储，多个 ziplist 之间使用双向指针串接起来。 redis7 .png) listpack紧凑列表 是用来替代 ziplist 的新数据结构，在 7.0 版本已经没有 ziplist 的配置了(6.0版本仅部分数据类型作为过渡阶段在使用)"}, {"sid": "chapter-11-section-69", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/10.Set数据结构介绍", "t": "set的两种编码格式 intset hashtable redis用intset或hashtable存储set。如果元素都是整数类型，就用intset存储。 如果不是整数类型，就用hashtable(数组+链表的存来储结构)。key就是元素的值，value为null。"}, {"sid": "chapter-11-section-70", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/11.ZSet数据结构介绍", "t": "redis6 ziplist skiplist 当有序集合中包含的元素数量超过服务器属性 server.zset max ziplist entries 的值(默认值为 128 )，或者有序集合中新添加元素的 member 的长度大于服务器属性 server.zset max ziplist value 的值(默认值为 64 )时，redis会使用跳跃表作为有序集合的底层实现。 否则会使用ziplist作为有序集合的底层实现 1.png) 2.png) redis7 listpack skiplist 1.png)"}, {"sid": "chapter-11-section-71", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/12.小总结", "t": "redis6数据类型对应的底层数据结构 1.字符串 int:8个字节的长整型。 embstr:小于等于44个字节的字符串。 raw:大于44个字节的字符串。 redis会根据当前值的类型和长度决定使用哪种内部编码实现。 2.哈希 ziplist(压缩列表):当哈希类型元素个数小于hash max ziplist entries 配置(默认512)、同时所有值都小于hash max ziplist value配置(默认64 字节)时，redis会使用ziplist作为哈希的内部实现，ziplist使用更加紧凑的 结构实现多个元素的连续存储，所以在节省内存方面比hashtable更加优秀。 hashtable(哈希表):当哈希类型无法满足 ziplist的条件时，redis会 用hashtable为哈希的内部实现。因为此时ziplist的读写效率会下降，而hashtahe的读写时间复度为o(1)。 3.列表 ziplist(压列表):当列表的元素个数小于list max ziplist entries配置 默认512)，同时列表中每元素的值都小于list max ziplist value配置时(默认64字节)redis会选用ziplist来作为列表的内部实现来减少内存的使用。 inkedlist(链表):当列表类型无法满足ziplist的条件时，redis会使用 linkedlist作为列表的内部实现。quicklist ziplist和linkedlist的结合以ziplist为节点的链表。 4.集合 intset(需数集合):当集合中的元素都是整数且元素个数小于set max ntset entries置(默认512)时，redis会用intset来为集合的内部实现，从而减少内存的使用hashtable(哈希表):当集合类型无法满足intset的条件时，redis会使用hashtable作为集合的内部实现。 5.有序集合 ziplist(压缩列表):当有序集合的元素个数小于zset max ziplist entres配置(默认128)，同时每元素的值都小于et max ziplist value配 置(默认64字节)时redis会用ziplist来作为有序集合的内部实现，ziplist 可以有效减少内存的使用。skiplist(跳跃表):当ziplist条件不满足时，有序集合会使用skiplist作 为内部实现，因为此时ziplist的读写效率会下降。 redis6数据类型以及数据结构的关系 redis7数据类型以及数据结构的关系 redis数据类型以及数据结构的时间复杂度"}, {"sid": "chapter-11-section-72", "ch": "12.Redis高阶篇", "sec": "11.Redis经典五大类型源码及底层实现/13.skiplist跳表面试", "t": "为什么引出跳表 先从一个单链表来说 对于一个单链表来讲，<font color = 'blue' 即便链表中存储的数据是有序的</font ，如果我们要想在其中查找某个数据，也只能从头到尾遍历链表。这样查找效率就会很低，时间复杂度会很高o(n) 痛点 解决方法：升维，也即空间换时间 优化 案例：画一个包含64个节点的链表，按前面思路，建立五级索引 是什么 跳表是可以实现二分查找的有序链表 <font color = 'red' skiplist是一种以空间换取时间的结构</font 。由于链表，无法进行二分查找，因此借鉴数据库索引的思想，提取出链表中关键节点(索引)，先在关键节点上查找，再进入下层链表查找，提取多层关键节点，就形成了跳跃表。 但是，<font color = 'red' 由于索引也要占据一定空间的，所以，索引添加的越多，空间占用的越多</font 总结来说，跳表=链表+多级索引 <font color = 'red' 跳表时间和空间复杂度介绍</font 1. 跳表的时间复杂度，o(logn) <font color = 'blue' 跳表查询的时间复杂度分析，如果链表里有n个结点，会有多少级索引呢？</font 按照我们前面笔记，两两取首。每两个结点会抽出一个结点作为上一级索引的结点，以此估算: 第一级索引的结点个数大约就是n/2 第二级索引的结点个数大约就是n/4. 第三级索引的结点个数大约就是n/8，依次类推...... 也就是说，第k级索引的结点个数是第k 1级索引的结点个数的1/2，那第k级索引结点的个数就是n/(2^k) 假设索引有h级，最高级的索引有2个结点。通过上面的公式， 我们可以得到n/(2^h)=2，从而求得h=log2n 1(log以2为底，n的对数) 如果包含原始链表这一层，整个跳表的高度就是log2n(log以2为底，n的对数) 2. 跳表空间复杂度 <font color = 'blue' 跳表查询的空间复杂度分析</font 比起单纯的单链表，跳表需要存储多级索引，肯定要消耗更多的存储空间。那到底需要消耗多少额外的存储空间呢? 我们来分析一下跳表的空间复杂度。 <font color = 'red' 第一步：</font 首先原始链表长度为n， <font color = 'red' 第二步：</font 两两取首，每层索引的结点数: n/2,n/4,n/8 ...,8,4,2 每上升一级就减少一半，直到剩下2个结点,以此类推，如果我们把每层索引的结点数写出来，就是一个等比数列。 这几级索引的结点总和就是n/2+n/4+/8.+8+4+2=n 2。所以，跳表的空间复杂度是o(n)。也就是说，如果将包含n个结点的单链表构造成跳表，我们需要额外再用接近n个结点的存储空间。 优缺点 <font color = 'blue' 优点：</font 跳表是一个最典型的空间换时间解决方案，而且只有在<font color = 'red' 数据量较大的情况下</font 才能体现出来优势。而且应该是<font color = 'red' 读多写少的情况下</font 才能使用，所以它的适用范围应该还是比较有限的 <font color = 'blue' 缺点：</font 维护成本相对要高， 在单链表中，一旦定位好要插入的位置，插入结点的时间复杂度是很低的，就是o(1)but 新增或者删除时需要把所有索引都更新一遍，为了保证原始链表中数据的有序性，我们需要先找到要动作的位置，这个查找操作就会比较耗时最后在新增和删除的过程中的更新，时间复杂度也是o(log n)"}, {"sid": "chapter-11-section-73", "ch": "12.Redis高阶篇", "sec": "12.epoll和IO多路复用/1.多路复用解决的问题", "t": "多路复用要解决的问题 <font color = 'blue' 并发多客户端连接</font ，在多路复用之前最简单和典型的方案：<font color = 'red' 同步阻塞网络io模型</font 这种模式的特点就是<font color = 'red' 用一个进程来处理一个网络连接(一个用户请求)</font ，比如一段典型的示例代码如下：直接调用 recv 函数从一个 socket 上读取数据。 int main(){ ... recv(sock, ...) // <font color = 'blue' 从用户角度来看非常简单，一个recv一用，要接收的数据就到我们手里了。</font } 我们来总结一下这种方式: 优点就是这种方式非常容易让人理解，写起代码来非常的自然，符合人的直线型思维。 <font color = 'red' 缺点就是性能差，每个用户请求到来都得占用一个进程来处理，来一个请求就要分配一个进程跟进处理</font ，类似一个学生配一个老师，一位忠者配一个医生，可能吗? 进程是一个很笨重的东西。一台服务器上创建不了多少个进程。 结论 进程在 linux 上是一个开销不小的家伙，先不说创建，光是上下文切换一次就得几个微秒。所以为了高效地对海量用户提供服务，<font color = 'red' 必须要让一个进程能同时处理很多个 tcp 连接才行</font 。现在假设一个进程保持了 10000 条连接，那么如何发现哪条连接上有数据可读了哪条连接可写了 ? 我们当然可以采用循环遍历的方式来发现 io 事件，但这种方式太低级了。 我们希望有一种更高效的机制，在很多连接中的某条上有 io 事件发生的时候直接快速把它找出来。 其实这个事情 linux 操作系统已经替我们都做好了，它就是我们所熟知的 io 多路复用机制。<font color = 'red' 这里的复用指的就是对进程的复用。</font"}, {"sid": "chapter-11-section-74", "ch": "12.Redis高阶篇", "sec": "12.epoll和IO多路复用/2.IO多路复用", "t": "是什么 i/o：网络io 多路：多个客户端连接(连接就是套接字描述符，即 socket 或者 channel)，指的是多条tcp连接 复用：用一个进程来处理多条的连接，使用单进程就能够实现同时处理多个客户端的连接 一句话： 实现了用一个进程来处理大量的用户连接，io多路复用类似一个规范和接口，落地实现，可以分select poll epoll 三个阶段来描述 redis单线程如何处理那么多并发客户端连接，为什么单线程，为什么快 redis的io多路复用 redis利用epoll来实现io多路复用，<font color = 'blue' 将连接信息和事件放到队列中</font ，一次放到文件事件<font color = 'blue' 分派器</font ，事件分派器将事件分发给事件处理器。 redis 是跑在单线程中的，所有的操作都是按照顺序线性执行的，但是<font color = 'red' 由于读写操作等待用户输入或输出都是阻塞的</font ，所以i/o操作在一股情况下往往不能直接返回，这会导致某一文件的i/o阻塞导致整个进程无法对其它客户提供服务，而 i/o 多路复用就是为了解决这个问题而出现 所谓 i/o 多路复用机制，就是说通过一种机制，可以监视多个描述符，一旦某个描述符就绪(一般是读就绪或写就绪)，能够通知程序进行相应的读写操作。这种机制的使用需要 select、poll 、epoll 来配合。<font color = 'red' 多个连接共用一个阻塞对象，应用程序只需要在一个阻塞对象上等待，无需阻塞等待所有连接。当某条连接有新的数据可以处理时，操作系统通知应用程序，线程从阻塞状态返回，开始进行业务处理。</font redis 服务采用 reactor 的方式来实现文件事件处理器(每一个网络连接其实都对应一个文件描述符) redis基于reactor模式开发了网络事件处理器，这个处理器被称为文件事件处理器。它的组成结构为4部分: 多个套接字、 io多路复用程序. 文件事件分派器、 事件处理器。 <font color = 'red' 因为文件事件分派器队列的消费是单线程的，所以redis才叫单线程模型</font 《redis设计与实现》 从redis6开始，将网络数据读写、请求协议解析通过多个io线程的来处理，对于真正的命令执行来说，仍然使用单线程操作，一举两得，便宜占尽!!! unix网络编程中的五种io模型 1. blocking io 阻塞io 2. noneblocking io 非阻塞io 3. io multiplexing io多路复用 4. signal driven io 信号驱动io 5. asynchronous io 异步io 同步：调用者要一直等待调用结果的通知后才能进行后续的执行现在就要，我可以等，等出结果为止 异步：指被调用方先返回应答让调用者先回去然后再计算调用结果，计算完最终结果后再通知并返回给调用方。异步调用想要获得结果一般通过回调 <font color = 'red' 同步和异步的理解</font ：同步、异步的讨论对象是被调用者(服务提供者)，重点在于获得调用结果的消息通知方式上 阻塞：调用方一直在等待而且别的事情什么都不做，当前进/线程会被挂起，啥都不干 非阻塞：调用在发出去后，调用方先去忙别的事情，不会阻塞当前进/线程，而会立即返回 <font color = 'red' 阻塞和非阻塞的理解</font ：阻塞、非阻塞的讨论对象是调用者(服务请求者)，重点在于等消息时候的行为，调用者是否能干其它事 4种组合方式 同步阻塞：服务员说快到你了，先别离开我后台看一眼马上通知你。客户在海底捞火锅前台干等着，啥都不干。 同步非阻塞：服务员说快到你了，先别离开客户在海底捞火锅前台边刷抖音边等着叫号。 异步阻塞：服务员说还要再等等，你先去逛逛，一会儿通知你。客户怕过号在海底捞火锅前台拿着排号小票啥都不干，一直等着店员通知 异步非阻塞：服务员说还要再等等，你先去逛逛，一会儿通知你。拿着排号小票+刷着抖音，等着店员通知"}, {"sid": "chapter-11-section-75", "ch": "12.Redis高阶篇", "sec": "12.epoll和IO多路复用/3.BIO", "t": "当用户进程调用了recvfrom这个系统调用，kernel就开始了io的第一个阶段：准备数据(对于网络io来说，很多时候数据在一开始还没有到达。比如，还没有收到一个完整的udp包。这个时候kernel就要等待足够的数据到来)。这个过程需要等待，也就是说数据被拷贝到操作系统内核的缓冲区中是需要一个过程的。而在用户进程这边，整个进程会被阻塞(当然，是进程自己选择的阻塞)。当kernel一直等到数据准备好了，它就会将数据从kernel中拷贝到用户内存，然后kermel返回结果，用户进程才解除block的状态，重新运行起来。所以，<font color = 'red' bio的特点就是在io执的两个阶段都被block了。</font 先演示accept accept监听是典型的阻塞式监听 java package com.luojia.redislock.iomultiplex.bio.accept; import cn.hutool.core.util.idutil; import java.io.ioexception; import java.net.serversocket; import java.net.socket; public class redisserver { public static void main(string[] args) throws ioexception { serversocket serversocket = new serversocket(6379); while (true) { system.out.println(\"模拟redisserver启动 111 等待连接\"); // 没有监听到数据的情况下，会一直卡在这里 socket accept = serversocket.accept(); system.out.println(\" 111 连接成功： \" + idutil.simpleuuid()); system.out.println(); } } } java package com.luojia.redislock.iomultiplex.bio.accept; import java.io.ioexception; import java.net.socket; public class redisclient01 { public static void main(string[] args) throws ioexception { system.out.println(\" redisclient01 start\"); socket socket = new socket(\"127.0.0.1\", 6379); system.out.println(\" redisclient01 over\"); } } java package com.luojia.redislock.iomultiplex.bio.accept; import java.io.ioexception; import java.net.socket; public class redisclient02 { public static void main(string[] args) throws ioexception { system.out.println(\" redisclient02 start\"); socket socket = new socket(\"127.0.0.1\", 6379); system.out.println(\" redisclient02 over\"); } } 再演示 read读取 java package com.luojia.redis7 study.iomultiplex.accept; import cn.hutool.core.util.idutil; import java.io.ioexception; import java.io.inputstream; import java.net.serversocket; import java.net.socket; public class redisserverbio { public static void main(string[] args) throws ioexception { serversocket serversocket = new serversocket(6379); while (true) { system.out.println(\" 111 等待连接\"); // 阻塞1，等待客户端连接 socket socket = serversocket.accept(); "}, {"sid": "chapter-11-section-76", "ch": "12.Redis高阶篇", "sec": "12.epoll和IO多路复用/4.NIO", "t": "当用户进程发出read操作时，如果kernel中的数据还没有准备好，那么它并不会block用户进程，而是立刻返回一个error。从用户进程角度讲，它发起一个read操作后，并不需要等待，而是马上就得到了一个结果。用户进程判断结果是一个error时，它就知道数据还没有准备好，于是它可以再次发送read操作。一旦kernel中的数据准备好了，并且又再次收到了用户进程的system call，那么它马上就将数据拷贝到了用户内存，然后返回。<font color = 'red' 所以，nio特点是用户进程需要不断的主动询问内核数据准备好了吗?一句话，用轮询替代阻塞!</font 面试回答 <font color = 'red' 在nio模式中，一切都是非阻塞的：</font accept()方法是<font color = 'blue' 非阻塞的</font ，如果没有客户端连接，就返回无连接标识 read()方法是<font color = 'blue' 非阻塞的</font ，如果read()方法读取不到数据就返回空闲中标识，如果读取到数据时只阻塞read()方法读数据的那段时间 在nio模式中，只有一个线程： 当一个客户端与服务端进行连接，这个socket就会加入到一个数组中，隔一段时间遍历一次，看这个socket的read()方法能否读到数据，<font color = 'red' 这样一个线程就能处理多个客户端的连接和读取了</font java package com.luojia.redis7 study.iomultiplex.nio; import java.io.ioexception; import java.net.inetsocketaddress; import java.nio.bytebuffer; import java.nio.channels.serversocketchannel; import java.nio.channels.socketchannel; import java.util.arraylist; import java.util.concurrent.timeunit; public class redisservernio { static arraylist<socketchannel socketlist = new arraylist< (); static bytebuffer bytebuffer = bytebuffer.allocate(1024); public static void main(string[] args) throws ioexception { system.out.println(\" redisservernio 启动中......\"); serversocketchannel serversocket = serversocketchannel.open(); serversocket.bind(new inetsocketaddress(\"127.0.0.1\", 6379)); // 设置为非阻塞模式 serversocket.configureblocking(false); while (true) { for (socketchannel element : socketlist) { int read = element.read(bytebuffer); if (read 0) { system.out.println(\" 读取数据：\" + read); bytebuffer.flip(); byte[] bytes = new byte[read]; bytebuffer.get(bytes); system.out.println(new string(bytes)); bytebuffer.clear(); } // try { timeunit.seconds.sleep(1); } catch (interruptedexception e) { e.printstacktrace(); } } socketchannel socketchannel = serversocket.accept(); if (socketchannel != null) { system.out.println(\" 成功连接：\"); socketchannel.configureblocking(false);// 设置为非阻塞模式 socketlist.add(socketchannel); system.out.println(\" socketlist size: \" + socketlist.size()); } } } "}, {"sid": "chapter-11-section-77", "ch": "12.Redis高阶篇", "sec": "12.epoll和IO多路复用/5.IO Multiplexing", "t": "io多路复用是什么 i/o多路复用在英文中其实叫i/o multiplexing i/o multiplexing 这里面的 multiplexing 指的其实是在单个线程通过记录跟踪每一个sock(i/0流)的状态来同时管理多个i/0流，目的是尽量多的提高服务器的吞吐能力。 大家都用过nginx，nginx使用epoll接收请求，ngnix会有很多链接进来，epoll会把他们都监视起来，然后像拨开关一样，谁有数据就拨向谁，然后调用相应的代码处理。redis类似同理 io多路复用 io multiplexing就是我们说的select，poll，epoll，有些技术书籍也称这种io方式为event driven io事件驱动io。就是通过一种机制，一个进程可以监视多个描述符，一旦某个描述符就绪（一般是读就绪或者写就绪），能够通知程序进行相应的读写操作。可以基于一个阻塞对象并同时在多个描述符上等待就绪，而不是使用多个线程(每个文件描述符一个线程，每次new一个线程)，这样可以大大节省系统资源。所以，i/o 多路复用的特点是<font color = 'red' 通过一种机制一个进程能同时等待多个文件描述符而这些文件描述符（套接字描述符）其中的任意一个进入读就绪状态，</font select， poll，epoll等函数就可以返回。 说人话 模拟一个tcp服务器处理30个客户socket,一个监考老师监考多个学生，谁举手就应答谁。 假设你是一个监考老师，让30个学生解答一道竞赛考题，然后负责验收学生答卷，你有下面几个选择: <font color = 'blue' 第一种选择</font ：按顺序逐个验收，先验收a，然后是b，之后是c、d。。。这中间如果有一个学生卡住，全班都会被耽误,你用循环挨个处理socket.根本不具有并发能力。 <font color = 'blue' 第二种选择</font ：你创建30个分身线程，每个分身线程检查一个学生的答案是否正确。 这种类似于为每一个用户创建一个进程或者线程处理连接。 <font color = 'blue' 第三种选择</font ：你站在讲台上等，谁解答完谁举手。这时c、d举手，表示他们解答问题完毕，你下去依次检查c、d的答案，然后继续回到讲台上等。 此时e、a又举手，然后去处理e和a。。。这种就是io复用模型。linux下的select、poll和epoll就是干这个的。 将用户socket对应的fd注册进epol，然后epol都帮你监听哪些socket上有消息到达，这样就避了大量的无用换作。此时的socket应该采用非阻塞模式。这样，整个过程只在调用select、poll、epoll这些调用的时候才会阻塞，收发客户消息是不会阻塞的，整个进程或者线程就被充分利用起来，这就是事件驱动，所谓的reactor反应模式。 能干嘛 redis单线程如何处理那么多并发客户端连接，为什么单线程，为什么快 redis利用epoll来实现io多路复用，<font color = 'blue' 将连接信息和事件放到队列中</font ，依次放到事件<font color = 'blue' 分派器</font ，事件分派器将事件分发给事件处理器。 redis 服务采用 reactor 的方式来实现文件事件处理器(每一个网络连接其实都对应一个文件描述符)谓 i/0 多路复用机制，就是说通过一种机制，可以监视多个描述符，一旦某个描述符就绪(一般是读就绪或写就绪)，能够通知程序进行相应读写操作。这种机制的使用需要 select 、 poll 、 epoll 来配合。多个连接共用一个阻塞对象，应用程序只需要在一个阻塞对象上等待，无需阻塞等待所有连接。当某条连接有新的数据可以处理时，操作系统通知应用程序，线程从阻塞状态返回，开始进行业务处理。 所谓 i/o 多路复用机制，就是说通过一种考试监考机制，1个老师可以监视多个考生，一旦某个考生举手想要交卷了，能够通知监考老师进行相应的收卷子或批改检查操作。所以这种机制需要调用班主任(select/poll/epoll)来配合。多个考生被同一个班主任监考，收完一个考试的卷子再处理其它人，无需等待所有考生，谁先举手就先响应谁，当又有考生举手要交卷，监考老师看到后从进台走到考生位置，开始进行收卷处理 reactor设计模式 基于 i/o 复用模型，<font color = 'red' 多个连接共用一个阻塞对象</font ，应用程序只需要在一个阻塞对象上等待，无需阻塞等待所有连接。当某条连接有新的数据可以处理时，操作系统通知应用程序，线程从阻塞状态返回，开始进行业务处理。 reactor 模式，是指通过一个或多个输入同时传递给服务处理器的服务请求的事件驱动处理模式。"}, {"sid": "chapter-11-section-78", "ch": "12.Redis高阶篇", "sec": "12.epoll和IO多路复用/6.IO多路复用的具体实现", "t": "select，poll，epoll都是i/o多路复用的具体实现 select方法 select函数监视的文件描述符分3类，分别是readfds、writefds和exceptfds，将用户传入的数组拷贝到内核空间，<font color = 'red' 调用后select函数会阻塞，直到有描述符就绪</font （有数据可读、可写、或者有except)或超时(timeout指定等待时间，如果立即返回设为null即可)，函数返回。 当select函数返回后，可以通过遍历fdset，来找到就绪的描述符。 优点 select其实就是把nio中用户态要遍历的fd数组(我们的每一个socket链接，安装进arraylist里面的那个)拷贝到了内核态，让内核态来遍历，因为用户态判断socket是否有数据还是要调用内核态的，所有拷贝到内核态后，这样遍历判断的时候就不用一直用户态和内核态频繁切换了。 从代码中可以看出，select系统调用后，返回了一个置位后的&rset，这样用户态只需进行很简单的二进制比较，就能很快知道哪些socket需要read数据，有效提高了效率 缺点 select函数的缺点 1. bitmap默认大小为1024，虽然可以调整但还是有限度的 2. rset每次循环都必须重新置位为0，不可重复使用 3. 尽管将rset从用户态拷贝到内核态由内核态判断是否有数据，但是还是有拷贝的开销 4. 当有数据时select就会返回，但是select函数并不知道哪个文件描述符有数据了，后面还需要再次对文件描述符数组进行遍历。效率比较低 1、bitmap最大1024位，一个进程最多只能处理1024个客户端 2、&rset不可重用，每次socket有数据就相应的位会被置位 3、文件描述符数组拷贝到了内核态(只不过无系统调用切换上下文的开销。(内核层可优化为异步事件通知))，仍然有开销。select调用需要传入fd数组，需要拷贝一份到内核，高并发场景下这样的拷贝消耗的资源是惊人的。(可优化为不复制) 4、select并没有通知用户态哪一个socket有数据，仍然需要o(n)的遍历。select仅仅返回可读文件描述符的个数，具体哪个可读还是要用户自己遍历。(可优化为只返回给用户就绪的文件描述符，无需用户做无效的遍历) select小总结 select方式，既做到了一个线程处理多个客户端连接(文件描述符），又减少了系统调用的开销(多个文件描述符只有一次select的系统调用＋n次就绪状态的文件描述符的read系统调用 poll方法 优点 1、poll使用pollfd数组来代替select中的bitmap，数组没有1024的限制，可以一次管理更多的client。它和 select的主要区别就是，去掉了select只能监听1024个文件描述符的限制。 2、当pollfds数组中有事件发生，相应的revents置位为1，遍历的时候又置位回零，实现了pollfd数组的重用 问题 poll解决了select缺点中的前两条，其本质原理还是select的方法，还存在select中原来的问题 1、pollfds数组拷贝到了内核态，仍然有开销 2、poll并没有通知用户态哪一个socket有数据，仍然需要o(n)的遍历 epoll方法 结论 多路复用快的原因在于，操作系统提供了这样的系统调用，使得原来的while循环里多次系统调用，<font color = 'red' 变成了一次系统调用＋内核层遍历这些文件描述符。</font epoll是现在最先进的io多路复用器，redis、nginx，linux中的java nio都使用的是epoll。 <font color = 'red' 这里“多路”指的是多个网络连接，“复用”指的是复用同一个线程。</font 1、一个socket的生命周期中只有一次从用户态拷贝到内核态的过程，开销小 2、使用event事件通知机制，每次socket中有数据会主动通知内核，并加入到就绪链表中，不需要遍历所有的socket 在多路复用io模型中，会有一个内核线程不断地去轮询多个socket的状态，只有当真正读写事件发送时，才真正调用实际的io读写操作。因为在多路复用io模型中，只需要使用一个线程就可以管理多个socket，系统不需要建立新的进程或者线程，也不必维护这些线程和进程，并且只有真正有读写事件进行时，才会使用io资源，所以它大大减少了资源占用。<font color = 'blue' 多路i/o复用模型是利用select、poll、epoll可以同时监察多个流的i/0事件的能力，在空闲的时候，会把当前线程阻塞掉，当有一个或多个流有i/o事件时，就从阻塞态中唤醒，于是程序就会轮询一遍所有的流</font <font color "}, {"sid": "chapter-11-section-79", "ch": "12.Redis高阶篇", "sec": "12.epoll和IO多路复用/7.IO多路复用模型总结", "t": "多路复用快的原因在于，操作系统提供了这样的系统调用，使得原来的 while循环里多次系统调用,变成了一次系统调用＋内核层遍历这些文件描述符。 所谓iо多路复用机制，就是说通过一种机制，可以监视多个描述符，一旦某个描述符就绪（一般是读就绪或写就绪），能够通知程序进行相应的读写操作。这种机制的使用需要select 、 poll 、 epoll来配合。多个连接共用一个阻塞对象，应用程序只需要在一个阻塞对象上等待，无需阻塞等待所有连接。当某条连接有新的数据可以处理时，操作系统通知应用程序，线程从阻塞状态返回，开始进行业务处理;"}, {"sid": "chapter-11-section-80", "ch": "12.Redis高阶篇", "sec": "12.epoll和IO多路复用/8.迷你版微信抢红包", "t": "需求分析 1. 各种节假日，发红包+抢红包，不说了，100%高并发业务要求，不能用mysql来做 2. 一个总的大红包，会有可能拆分成多个小红包，总金额 = 分金额1+分金额2+分金额3......分金额n 3. 每个人只能抢一次，你需要有记录，比如100块钱，被拆分成10个红包发出去，总计有10个红包，抢一个少一个，总数显示(10/6)直到完，需要记录哪些人抢到了红包，重复抢作弊不可以。 4. 有可能还需要你计时，完整抢完，从发出到全部over，耗时多少? 5. 红包过期，或者群主人品差，没人抢红包，原封不动退回。 6. 红包过期，剩余金额可能需要回退到发红包主账户下。 <font color = 'red' 由于是高并发不能用mysql来做，只能用redis，那需要要redis的什么数据类型?</font 架构设计 难点： <font color = 'blue' 1 拆分算法如何</font 红包其实就是金额，拆分算法如何 ?给你100块，分成10个小红包(金额有可能小概率相同，有2个红包都是2.58)如何拆分随机金额设定每个红包里面安装多少钱? <font color = 'blue' 2 次数限制</font 每个人只能抢一次，次数限制 <font color = 'blue' 3 原子性3</font 每抢走一个红包就减少一个(类似减库存)，那这个就需要保证库存的 原子性，但是还需要不加锁实现，因为大量并发上来后，全部都卡死的话，用户使用效果不佳，并且容易导致服务器被压垮 你认为存在redis什么数据类型里面? set ? hash? list? 关键点 发红包 抢红包 ​ 抢，不加锁且原子性，还能支持高并发 ​ 没人一次且有抢红包记录 记红包 ​ 记录每个人抢了多少 拆红包 ​ 拆红包算法： 1. 所有人抢到金额之和等于红包金额，不能超过，也不能少于。 2. 每个人至少抢到一分钱 3. 要保证所有人抢到金额的几率相等 结论： <font color = 'blue' 抢红包业务通用算法：二倍均值法</font 剩余红包金额为m，剩余人数为n，那么有如下公式: 每次抢到的金额 = 随机区间 (0，(剩余红包金额m ÷ 剩余人数n )x 2) 这个公式，保证了每次随机金额的平均值是相等的，不会因为抢红包的先后顺序而造成不公平。 举个栗子: 假设有10个人，红包总额100元。 第1次: 100 ÷ 10 x 2 = 20,所以第一个人的随机范围是 (0，20 )，平均可以抢到10元。假设第一个人随机到10元，那么剩余金额是100 10 = 90 第2次: 909 x2 = 20,所以第二个人的随机范围同样是 (0，20 )，平均可以抢到10元。假设第二个人随机到10元，那么剩余金额是90 10 = 80 元。 第3次: 80 8 x2 = 20,所以第三个人的随机范围同样是 (0，20 )，平均可以抢到10元。 以此类推，每一次随机范围的均值是相等的。 编码实现 java package com.luojia.redis7 study.controller; import cn.hutool.core.util.idutil; import com.google.common.primitives.ints; import org.springframework.beans.factory.annotation.autowired; import org.springframework.data.redis.core.redistemplate; import org.springframework.web.bind.annotation.requestmapping; import org.springframework.web.bind.annotation.restcontroller; import java.util.arrays; import java.util.random; import java.util.concurrent.timeunit; @restcontroller public class redpackagecontroller { public static final string red package key = \"redpackage:\"; public static final string red package consume key = \"redpackage:consume\"; @autowired private redistemplate redistemplate; @requestmapping(value = \"/send\") public string"}];

let currentMode = 'toc';
let currentChapter = -1;
let observer = null;
let chapterCache = {};
let loadingChapter = -1;
let chapterRequestId = 0;
let pendingScrollTarget = null;

function setupObserver() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id;
        document.querySelectorAll('.nav-sections li').forEach(li => li.classList.remove('active'));
        const active = document.querySelector('[data-section="' + id + '"]');
        if (active) {
          active.classList.add('active');
          const chIdx = id.split('-section-')[0].replace('chapter-', '');
          const chEl = document.querySelector('[data-chapter="' + chIdx + '"]');
          if (chEl && !chEl.classList.contains('open')) {
            toggleChapter(chEl);
          }
        }
      }
    });
  }, { rootMargin: '-10% 0px -80% 0px' });
  document.querySelectorAll('.section').forEach(el => observer.observe(el));
}

function loadChapter(idx, scrollToId) {
  if (currentChapter === idx && !scrollToId) return;
  if (loadingChapter === idx) {
    pendingScrollTarget = scrollToId || pendingScrollTarget;
    return;
  }

  if (chapterCache[idx] !== undefined) {
    chapterRequestId += 1;
    loadingChapter = -1;
    _renderChapter(idx, scrollToId);
    return;
  }

  const requestId = ++chapterRequestId;
  loadingChapter = idx;
  pendingScrollTarget = scrollToId || null;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">加载中...</div>';

  const script = document.createElement('script');
  script.src = 'chapter-' + idx + '.js';
  script.async = true;
  script.onload = function() {
    chapterCache[idx] = window._chapterHtml;
    window._chapterHtml = null;
    script.remove();
    if (requestId !== chapterRequestId) return;
    const target = pendingScrollTarget;
    pendingScrollTarget = null;
    loadingChapter = -1;
    _renderChapter(idx, target);
  };
  script.onerror = function() {
    script.remove();
    if (requestId !== chapterRequestId) return;
    content.innerHTML = '<div class="loading">章节加载失败，请刷新重试</div>';
    pendingScrollTarget = null;
    loadingChapter = -1;
  };
  document.head.appendChild(script);
}

function _renderChapter(idx, scrollToId) {
  const content = document.getElementById('content');
  content.innerHTML = chapterCache[idx];
  currentChapter = idx;
  setupObserver();
  if (scrollToId) {
    requestAnimationFrame(() => {
      const el = document.getElementById(scrollToId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  } else {
    window.scrollTo(0, 0);
  }
}

function buildNav() {
  const toc = document.getElementById('tocList');
  let html = '';
  navData.forEach((ch, i) => {
    html += '<li>';
    html += '<div class="nav-chapter" data-chapter="' + i + '" onclick="toggleChapter(this)">';
    html += '<span class="arrow">▶</span>' + ch.title + '</div>';
    html += '<ul class="nav-sections" id="nav-ch-' + i + '">';
    ch.sections.forEach((sec, j) => {
      html += '<li data-section="' + sec.id + '" onclick="goToSection(\'' + sec.id + '\')">' + sec.title + '</li>';
    });
    html += '</ul></li>';
  });
  toc.innerHTML = html;
}

function toggleChapter(el) {
  el.classList.toggle('open');
  const idx = parseInt(el.dataset.chapter);
  const list = document.getElementById('nav-ch-' + idx);
  list.classList.toggle('open');
  if (el.classList.contains('open') && currentChapter !== idx && loadingChapter !== idx) {
    loadChapter(idx);
  }
}

function goToSection(id) {
  const chIdx = parseInt(id.split('-section-')[0].replace('chapter-', ''));
  if (currentChapter !== chIdx) {
    loadChapter(chIdx, id);
  } else {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.querySelectorAll('.nav-sections li').forEach(li => li.classList.remove('active'));
  const active = document.querySelector('[data-section="' + id + '"]');
  if (active) active.classList.add('active');
  document.querySelector('.sidebar').classList.remove('open');
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-mode="' + mode + '"]').classList.add('active');

  const toc = document.getElementById('tocList');
  const results = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');

  if (mode === 'toc') {
    toc.style.display = '';
    results.classList.remove('open');
    results.innerHTML = '';
    input.placeholder = '搜索章节...';
    document.querySelectorAll('.nav-chapter').forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.nav-sections li').forEach(el => el.classList.remove('hidden'));
  } else {
    toc.style.display = 'none';
    input.placeholder = '搜索正文内容...';
  }

  onSearch(input.value);
}

function onSearch(query) {
  if (currentMode === 'toc') {
    filterNav(query);
  } else {
    doSearch(query);
  }
}

function filterNav(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll('.nav-chapter').forEach(chEl => {
    const chTitle = chEl.textContent.replace('▶', '').trim().toLowerCase();
    const idx = chEl.dataset.chapter;
    const list = document.getElementById('nav-ch-' + idx);
    if (!q) {
      chEl.classList.remove('hidden');
      list.querySelectorAll('li').forEach(li => li.classList.remove('hidden'));
      return;
    }
    let hasVisible = false;
    list.querySelectorAll('li').forEach(li => {
      const match = li.textContent.toLowerCase().includes(q);
      li.classList.toggle('hidden', !match);
      if (match) hasVisible = true;
    });
    const chMatch = chTitle.includes(q);
    if (chMatch || hasVisible) {
      chEl.classList.remove('hidden');
      if (!chEl.classList.contains('open')) toggleChapter(chEl);
    } else {
      chEl.classList.add('hidden');
    }
  });
}

function highlightText(text, query) {
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx < 0) return escapeHtml(text);
  const start = Math.max(0, idx - 40);
  const end = Math.min(text.length, idx + query.length + 40);
  let snippet = (start > 0 ? '...' : '') + text.slice(start, end) + (end < text.length ? '...' : '');
  const si = snippet.toLowerCase().indexOf(query.toLowerCase());
  return escapeHtml(snippet.slice(0, si)) + '<mark>' + escapeHtml(snippet.slice(si, si + query.length)) + '</mark>' + escapeHtml(snippet.slice(si + query.length));
}

function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function doSearch(query) {
  const results = document.getElementById('searchResults');
  const q = query.trim().toLowerCase();

  if (!q) {
    results.classList.remove('open');
    results.innerHTML = '';
    return;
  }

  results.classList.add('open');

  let html = '';
  let count = 0;
  const seen = new Set();

  navData.forEach((ch) => {
    ch.sections.forEach((sec) => {
      if (count >= 80) return;
      if (seen.has(sec.id)) return;
      if (sec.title.toLowerCase().includes(q) || ch.title.toLowerCase().includes(q)) {
        seen.add(sec.id);
        html += '<li class="search-result" onclick="goToSection(\'' + sec.id + '\')">';
        html += '<div class="ch-label">' + ch.title + '</div>';
        html += '<strong>' + sec.title + '</strong>';
        html += '</li>';
        count++;
      }
    });
  });

  searchIndex.forEach((item) => {
    if (count >= 80) return;
    if (seen.has(item.sid)) return;
    if (!item.t.includes(q)) return;
    seen.add(item.sid);
    const snippet = highlightText(item.t, q);
    html += '<li class="search-result" onclick="goToSection(\'' + item.sid + '\')">';
    html += '<div class="ch-label">' + item.ch + ' › ' + item.sec + '</div>';
    html += '<div class="snippet">' + snippet + '</div>';
    html += '</li>';
    count++;
  });

  if (count === 0) {
    results.innerHTML = '<li class="search-no-result">无匹配结果</li>';
  } else {
    results.innerHTML = html + (count >= 80 ? '<li class="search-no-result">仅显示前 80 条</li>' : '');
  }
}

buildNav();
loadChapter(0);
const firstCh = document.querySelector('[data-chapter="0"]');
if (firstCh) toggleChapter(firstCh);

/* 侧边栏被省略号截断的目录项，鼠标移入时用浮层展示全文 */
(function () {
  let tip = document.getElementById('tocTip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'tocTip';
    document.body.appendChild(tip);
  }
  const list = document.getElementById('tocList');
  const side = document.getElementById('sidebar');
  if (!list || !side) return;
  const hide = () => { tip.style.display = 'none'; };
  const show = (el) => {
    const text = (el.classList.contains('nav-chapter')
      ? el.textContent.replace('▶', '')
      : el.textContent).trim();
    if (!text) { hide(); return; }
    tip.textContent = text;
    tip.style.display = 'block';
    const r = el.getBoundingClientRect();
    const tr = tip.getBoundingClientRect();
    let x = r.right + 8;
    let y = r.top + r.height / 2 - tr.height / 2;
    if (x + tr.width > window.innerWidth - 8) x = Math.max(8, window.innerWidth - 8 - tr.width);
    if (y + tr.height > window.innerHeight - 8) y = window.innerHeight - 8 - tr.height;
    if (y < 8) y = 8;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  };
  list.addEventListener('mouseover', (e) => {
    const el = e.target.closest ? e.target.closest('.nav-chapter, .nav-sections li') : null;
    if (!el || el.offsetWidth === 0) { hide(); return; }
    if (el.scrollWidth <= el.clientWidth + 1) { hide(); return; }
    show(el);
  });
  list.addEventListener('mouseleave', hide);
  list.addEventListener('click', hide);
  side.addEventListener('scroll', hide, { passive: true });
  window.addEventListener('resize', hide);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
})();
</script>
